<!doctype html>
<html lang="pl" class="czj-system-theme">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Co za dzban — trwa aktualizacja</title>
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="/branding/brand.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
        }

        main {
            width: min(100%, 520px);
            padding: 36px;
            border: 1px solid var(--czj-border);
            border-radius: var(--czj-radius);
            background: var(--czj-card-bg);
            box-shadow: var(--czj-card-shadow);
        }

        img {
            display: block;
            width: 88px;
            height: 88px;
            margin-bottom: 28px;
        }

        p {
            margin: 0;
            color: var(--czj-muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .eyebrow {
            margin-bottom: 12px;
            color: var(--czj-link);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--czj-border);
            font-size: 15px;
            font-weight: 600;
        }

        .pulse {
            width: 10px;
            height: 10px;
            flex: 0 0 auto;
            border-radius: 999px;
            background: var(--czj-accent);
            box-shadow: 0 0 0 0 var(--czj-accent);
            animation: pulse 1.8s ease-out infinite;
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 10px transparent;
            }
            100% {
                box-shadow: 0 0 0 0 transparent;
            }
        }

        @media (max-width: 440px) {
            main {
                padding: 28px 22px;
            }

            img {
                width: 72px;
                height: 72px;
            }
        }
    </style>
</head>
<body>
    <main>
        <img class="czj-brand-mark" src="/branding/politics-logo-96px.png" alt="">
        <div class="eyebrow">Przerwa techniczna</div>
        <h1>Aktualizujemy Co za dzban</h1>
        <p>Wdrażamy nową wersję serwisu. Strona powinna wrócić za chwilę, zwykle po odświeżeniu okna przeglądarki.</p>
        <div class="status"><span class="pulse" aria-hidden="true"></span>Przełączamy ruch na świeżą instancję</div>
    </main>
</body>
</html>
