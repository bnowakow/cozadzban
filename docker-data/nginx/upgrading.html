<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>CoZaDzban.pl - trwa aktualizacja</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f8fb;
            --panel: #ffffff;
            --ink: #172033;
            --muted: #5c667a;
            --accent: #1f7a6d;
            --warm: #c4512c;
            --line: #d9dee8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            background: linear-gradient(135deg, #ffffff 0%, var(--bg) 52%, #edf3f1 100%);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 520px);
            padding: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 24px 70px rgba(23, 32, 51, 0.14);
        }

        img {
            display: block;
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin-bottom: 28px;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .eyebrow {
            margin-bottom: 12px;
            color: var(--warm);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(32px, 8vw, 48px);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            color: var(--ink);
            font-size: 15px;
            font-weight: 600;
        }

        .pulse {
            width: 10px;
            height: 10px;
            flex: 0 0 auto;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 0 0 rgba(31, 122, 109, 0.45);
            animation: pulse 1.8s ease-out infinite;
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 10px rgba(31, 122, 109, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(31, 122, 109, 0);
            }
        }

        @media (max-width: 440px) {
            main {
                padding: 28px 22px;
            }

            img {
                width: 72px;
                height: 72px;
            }
        }
    </style>
</head>
<body>
    <main>
        <img src="/cozadzban-logo.png" alt="CoZaDzban.pl">
        <div class="eyebrow">Przerwa techniczna</div>
        <h1>Aktualizujemy CoZaDzban.pl</h1>
        <p>Wdrażamy nową wersję serwisu. Strona powinna wrócić za chwilę, zwykle po odświeżeniu okna przeglądarki.</p>
        <div class="status"><span class="pulse" aria-hidden="true"></span>Przełączamy ruch na świeżą instancję</div>
    </main>
</body>
</html>
