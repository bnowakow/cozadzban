upstream springboot_active {
    include /etc/nginx/upstream.conf;
    keepalive 16;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_port $proxy_x_forwarded_port {
    default $http_x_forwarded_port;
    "" $server_port;
}

server {
    listen 80;
    server_name _;

    error_page 502 503 504 =503 /upgrading.html;

    location = /upgrading.html {
        internal;
        add_header Retry-After 10 always;
        root /usr/share/nginx/html;
    }

    location = /cozadzban-logo.png {
        root /usr/share/nginx/html;
        access_log off;
        expires 1h;
    }

    location = /favicon.png {
        root /usr/share/nginx/html;
    }

    location = /privacy-policy.html {
        root /usr/share/nginx/html;
    }

    location = /user-data-deletion.html {
        root /usr/share/nginx/html;
    }

    location = /facebook-terms.html {
        return 301 https://cozadzban.pl/privacy-policy.html;
    }

    location = /facebook-data-deletion.html {
        return 301 https://cozadzban.pl/user-data-deletion.html;
    }

    location = /facebook-legal.css {
        root /usr/share/nginx/html;
    }

    location / {
        proxy_pass http://springboot_active;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_intercept_errors on;
        # Put Meta's domain verification tag in the server-rendered HTML head.
        sub_filter '<head>' '<head><meta name="facebook-domain-verification" content="emuuqlxat5epk6iaoys1zt0kai22oj">';
        sub_filter_once on;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_timeout 3s;
        proxy_next_upstream_tries 2;
    }
}
