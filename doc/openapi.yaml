openapi: 3.0.3
info:
  title: CoZaZjeb API
  description: |
    ## Overview
    CoZaZjeb is a link-collecting application. Users submit a URL and a language
    tag; the server fetches the target page and automatically enriches the record
    with title, thumbnail and lead before persisting it.

    ## Components
    1. **REST API** — CRUD endpoints for `Article` resources (this spec).
    2. **PostgreSQL database** — all data persisted via Spring Data JDBC.
    3. **Flyway migrations** — all schema changes are managed as versioned SQL
       migration scripts located in `src/main/resources/db/migration/`.
       No DDL is generated or executed outside of Flyway.
    4. **RSS feed** — `GET /rss` exposes articles as an RSS 2.0 feed;
       filterable per language with `?lang=<BCP-47>`.
    5. **Vaadin UI** — server-side paginated view of articles (separate from
       this REST spec; rendered at the root path `/`).

    ## Implementation notes
    - Language is a free-form BCP-47 string (e.g. `pl`, `en`, `de`).
    - `title`, `thumbnail` and `lead` are server-fetched; clients only supply
      `url` + `language` on create/replace.
    - `aiSummary` is reserved for a future AI enrichment step; always `null`
      in the current version.
    - Error responses use `application/problem+json` (RFC 9457 /
      Spring `ProblemDetail`).

  version: 0.0.1-SNAPSHOT

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Articles
    description: CRUD operations for Article resources
  - name: RSS
    description: RSS feed endpoints

paths:

  /api/articles:

    get:
      tags: [Articles]
      summary: List articles (paginated)
      operationId: listArticles
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of articles per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: "Sort expression: field,direction — e.g. createdAt,desc"
          schema:
            type: string
            example: createdAt,desc
      responses:
        '200':
          description: Paginated list of articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'

    post:
      tags: [Articles]
      summary: Create a new article
      operationId: createArticle
      description: >
        Accepts a URL and a BCP-47 language tag.
        The server fetches the page at the given URL and automatically
        populates title, thumbnail and lead before persisting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
            example:
              url: https://example.com/some-article
              language: pl
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/articles/{id}:

    parameters:
      - $ref: '#/components/parameters/ArticleId'

    get:
      tags: [Articles]
      summary: Get article by ID
      operationId: getArticle
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Articles]
      summary: Replace article input fields
      operationId: replaceArticle
      description: >
        Replaces url and language. The server re-fetches the target page to
        refresh title, thumbnail and lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Article replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    patch:
      tags: [Articles]
      summary: Partially update an article
      operationId: patchArticle
      description: >
        Updates only the provided fields. If url is changed the server
        re-fetches the page to refresh the enriched fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticlePatch'
      responses:
        '200':
          description: Article updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Articles]
      summary: Delete an article
      operationId: deleteArticle
      responses:
        '204':
          description: Article deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /rss:

    get:
      tags: [RSS]
      summary: RSS 2.0 feed
      operationId: getRssFeed
      description: >
        Returns an RSS 2.0 feed of articles ordered by creation date (newest first).
        Provide the `lang` query parameter to filter to a single BCP-47 language.
      parameters:
        - name: lang
          in: query
          description: BCP-47 language tag filter (e.g. en, pl, de)
          required: false
          schema:
            type: string
            example: pl
      responses:
        '200':
          description: RSS feed
          content:
            application/rss+xml:
              schema:
                type: string

components:

  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      description: Unique article identifier
      schema:
        type: integer
        format: int64
        example: 42

  schemas:

    ArticleInput:
      type: object
      required: [url, language]
      properties:
        url:
          type: string
          format: uri
          description: Full URL of the article page to fetch and store
          example: https://example.com/some-article
        language:
          type: string
          description: BCP-47 language tag identifying the article's language
          example: pl

    ArticlePatch:
      type: object
      description: Fields that may be partially updated; omitted fields are left unchanged
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/updated-article
        language:
          type: string
          description: BCP-47 language tag
          example: en

    Article:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        url:
          type: string
          format: uri
          example: https://example.com/some-article
        language:
          type: string
          description: BCP-47 language tag
          example: pl
        title:
          type: string
          description: Title fetched from the article page
          nullable: true
          example: "An Interesting Article"
        thumbnail:
          type: string
          format: uri
          description: Thumbnail URL fetched from the article page (og:image or similar)
          nullable: true
          example: https://example.com/images/thumb.jpg
        lead:
          type: string
          description: Lead/excerpt fetched from the article page (og:description or similar)
          nullable: true
          example: "A short summary of the article content."
        aiSummary:
          type: string
          description: AI-generated summary — future feature, null until implemented
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-02T10:00:00Z"

    ArticlePage:
      type: object
      description: Spring Page wrapper for Article
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        totalElements:
          type: integer
          format: int64
          example: 150
        totalPages:
          type: integer
          example: 8
        size:
          type: integer
          example: 20
        number:
          type: integer
          description: Current zero-based page number
          example: 0
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: false

    ProblemDetail:
      type: object
      description: RFC 9457 / Spring ProblemDetail error response
      properties:
        type:
          type: string
          format: uri
          example: https://example.com/problems/validation-error
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'url' must be a valid URI"
        instance:
          type: string
          format: uri
          example: /api/articles

  responses:

    BadRequest:
      description: Request payload is invalid or malformed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnprocessableEntity:
      description: The URL could not be fetched or its content could not be parsed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
