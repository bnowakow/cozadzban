# ============================================================
# CoZaDzban — Full System Specification
#
# This file is the single source of truth for ALL system specs.
# It uses the OpenAPI 3.0 format for the API contract and
# OpenAPI x- extensions to capture database, architecture,
# business rules and UI specifications.
#
# Intended audience: LLMs used for code generation / review.
# The maintained API contract lives in openapi.yaml; springdoc generates
# /v3/api-docs from the running application, not from either YAML file.
# ============================================================

openapi: 3.0.3

# ──────────────────────────────────────────────────────────────
# ARCHITECTURE SPEC  (x-architecture)
# ──────────────────────────────────────────────────────────────
x-architecture:
  language: Kotlin
  framework: Spring Boot 4.x
  javaVersion: 21
  buildTool: Gradle (Kotlin DSL)
  components:
    - name: REST API
      technology: Spring MVC (spring-boot-starter-webmvc)
      description: >
        CRUD endpoints for Article resources plus an RSS feed endpoint.
        Request/response bodies use JSON; errors use application/problem+json
        (RFC 9457 / Spring ProblemDetail).
    - name: Authentication and authorization
      technology: Spring Security Resource Server + Google OpenID Connect
      description: >
        Google is the selected OAuth/OIDC provider.
        Signed Google JWTs are validated using issuer metadata from
        https://accounts.google.com.
        Read endpoints are public. Write-inducing endpoints require a valid
        Bearer token and allowlisted email.
        Authorization model has two roles: USER and ADMIN.
        USER can perform article write operations.
        ADMIN can perform all operations, including allowlist management.
        A dedicated machine-to-machine API key may also be accepted for article
        create and article content patch requests used by the Facebook importer.
    - name: Database
      technology: PostgreSQL + Spring Data JDBC
      description: >
        All domain data is stored in PostgreSQL.
        Persistence uses Spring Data JDBC (not JPA/Hibernate) via
        CrudRepository / NamedParameterJdbcTemplate.
        No DDL is auto-generated; all schema changes go through Flyway.
        All queries MUST use parameterised statements — raw string
        concatenation into SQL is forbidden to prevent SQL injection
        (OWASP A03).
    - name: Schema migrations
      technology: Flyway
      description: >
        Versioned SQL migration scripts in src/main/resources/db/migration/.
        Naming convention: V<version>__<description>.sql (e.g. V1__create_articles.sql).
        No DDL must be written outside Flyway scripts.
    - name: URL enrichment
      technology: Spring RestClient (spring-boot-starter-restclient)
      description: >
        On create (POST), replace (PUT) and partial update (PATCH when url is
        changed), the server synchronously fetches the target URL and extracts
        title (og:title / <title>), thumbnail (og:image), favicon
        (downloaded from link icon metadata into the local favicon cache), lead
        (og:description / <meta name="description">), and best-effort
        publication date metadata.
        Enrichment is synchronous and atomic — if the fetch fails no DB write occurs.
        Defaults: connect timeout 3 s, read timeout 5 s, no retries.
        If the fetch returns a non-2xx status, times out, or the URL is
        unreachable, the server responds with 422 and the article is not persisted.
    - name: RSS feed
      technology: Custom controller returning application/rss+xml
      rssFieldMapping:
        rssTitle: article.title
        rssLink: article.publisherUrl when present, otherwise article.url
        rssDescription: article.lead
        rssPubDate: article.publishedAt when present, otherwise article.createdAt
        rssGuid: article.id
        userData: never exposed
      rssChannel:
        title: Co za dzban
        link: https://cozadzban.pl
        description: fucked up news
        language: en
        generator: cozadzban.pl
        lastBuildDateSource: app.build.timestamp injected by Gradle as ISO-8601 UTC
        lastBuildDateFormat: RFC-822 UTC (converted by RSS controller from ISO-8601)
        langFilter: GET /rss?lang=<BCP-47> filters to a single language; channel language element is set to the filter value
      htmlDiscovery:
        linkRelAlternate: '<link rel="alternate" type="application/rss+xml" title="Co za dzban RSS" href="/rss">'
        visibleUiLink: ArticleListView top bar includes an RSS icon/link to /rss
    - name: Vaadin UI
      technology: Vaadin 25 + spring-boot-starter (server-side)
      description: >
        Paginated, server-side rendered view of articles mounted at /.
        Not part of the REST API surface; see x-vaadin-ui for the spec.
    - name: Observability
      technology: Micrometer + Brave (Zipkin tracing) + Actuator
      description: >
        Distributed tracing via Brave/Zipkin. Actuator exposes health, metrics,
        info and env. /actuator/health and its probe subpaths are public;
        info, metrics and env require an authenticated, allowlisted session or
        bearer token. Health details are shown only when authorized.
    - name: Web security defaults
      technology: Spring Security + CORS
      description: >
        CORS allows only origin https://cozadzban.pl.
        API is stateless, so CSRF is disabled for /api/** and /rss.
        CSRF remains enabled for Vaadin UI routes.
    - name: Bootstrap configuration
      technology: Spring Boot configuration properties
      description: >
        COZADZBAN_BOOTSTRAP_ADMIN_EMAIL is only required when the app_user
        table contains no ADMIN rows. If at least one ADMIN exists, the env var
        is optional and ignored. If no ADMINs exist and the env var is missing
        or empty, startup fails fast. If no ADMINs exist and env var is a valid
        email, one ADMIN row is seeded (or an existing USER is promoted).

    - name: Frontend authentication
      technology: Vaadin UI + Spring Security oauth2Login (Authorization Code)
      description: >
        Login starts with redirect to Google authorization endpoint.
        OAuth callback is handled server-side; frontend JavaScript never receives
        access tokens or ID tokens.
        Session is represented by HttpOnly server session cookie.
        /auth/me provides current user info.
    - name: Authentication endpoints
      technology: Spring MVC UiAuthController + Spring Security oauth2Login
      description: >
        GET /auth/login starts OAuth Authorization Code flow.
        GET /auth/me returns current user email, nullable role, and allowlist state.
        POST /auth/logout invalidates server session and clears session cookie.
    - name: Admin management panel
      technology: Vaadin UI AdminView at @Route("/admin")
      description: >
        ADMIN-only view with user table, add user form, soft-delete/restore/update role actions.
        View invokes application services server-side from Vaadin event handlers;
        no browser-side token forwarding is used.
    - name: Facebook import orchestration
      technology: Spring Batch tasklet + scheduled/admin launch + Spring-managed Selenium WebDriver + proposal inbox
      description: >
        Spring Batch owns run lifecycle/history for the facebookImportJob. The job
        receives an explicit importType parameter. The Selenium importer is the
        browser-backed profile importer. The Apify importer uses the synchronous
        Apify actor run endpoint so each import completes sequentially inside one
        Spring Batch execution. Worker-startup runs launch available importers in
        APIFY then SELENIUM order. Selenium scheduled runs and Apify paid scheduled
        runs use separate intervals. ADMIN REST/UI triggers can launch enabled
        importers manually. The worker/server submits discovered
        article proposals to machine-only server endpoints instead of creating Articles
        directly. Logged-in users review proposals later in a Vaadin inbox.
    - name: Notifications
      technology: Pushover REST API + encrypted per-user preferences
      description: >
        ACTIVE logged-in users can configure their own Pushover user key in the
        Vaadin notification settings view. Pushover keys are encrypted at rest
        with AES-GCM and are never exposed back to the browser after saving.
        ACTIVE users can opt into article proposal summary notifications. ACTIVE
        ADMIN users can additionally opt into scheduled Facebook login/2FA alerts.
        Manual Facebook imports and the automatic worker-startup import do not
        send login-required alerts.
    - name: Analytics and consent
      technology: Vaadin UI + configurable tracking IDs
      description: >
        Google Analytics and StatCounter scripts are rendered only when their
        IDs are configured and the user has explicitly accepted analytics
        cookies. Consent is analytics-only and can be changed later. RSS feed
        requests emit best-effort server-side analytics events when the matching
        server-side analytics credentials are configured.
    - name: Article content preservation cache
      technology: PostgreSQL-backed content cache
      description: >
        Implemented: article text/content is captured at creation/update time
        into the article_content table (V5 migration) for preservation only.
        Content is NOT used for UI rendering, source fallback, or AI summary.
        New cache writes normally retain at most 1,200 characters plus an ellipsis,
        preferring a word boundary after character 900. A historical repaired
        Facebook post is exempt from this shortening. The final safety cap is
        5 MiB of UTF-8 text; either shortening sets the truncated flag. Separate product/legal decisions required before any
        further use.

# ──────────────────────────────────────────────────────────────
# DATABASE SPEC  (x-database)
# ──────────────────────────────────────────────────────────────
x-database:
  engine: PostgreSQL
  migrationTool: Flyway
  migrationPath: src/main/resources/db/migration/
  namingConvention: "V<version>__<snake_case_description>.sql"
  tables:
    - name: article
      migration: V1__create_articles.sql
      description: Stores enriched article records submitted by users.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: PRIMARY KEY
        - name: url
          type: TEXT
          constraints: "NOT NULL UNIQUE"
          description: Full URL of the source page as submitted by the user. Must be globally unique.
        - name: publisher_url
          type: TEXT
          migration: V41__article_publisher_url.sql
          constraints: nullable
          description: Verified publisher article URL, distinct from the imported Facebook source when available.
        - name: language
          type: VARCHAR(20)
          constraints: NOT NULL
          description: BCP-47 language tag (e.g. pl, en, de).
        - name: title
          type: TEXT
          constraints: nullable
          description: Page title fetched from og:title or <title>.
        - name: thumbnail
          type: TEXT
          constraints: nullable
          description: Thumbnail URL fetched from og:image.
        - name: favicon
          type: TEXT
          constraints: nullable
          description: Local cached favicon URL downloaded from source site link icon metadata when available.
        - name: lead
          type: TEXT
          constraints: nullable
          description: Lead text fetched from og:description or <meta name="description">.
        - name: quote
          type: TEXT
          constraints: nullable
          description: Optional user-provided quote or comment about the article. Not server-fetched.
        - name: ai_summary
          type: TEXT
          constraints: nullable
          description: Reserved for future AI-generated summary. Always NULL currently.
        - name: created_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
          description: Timestamp of record creation; set by the database.
        - name: published_at
          type: TIMESTAMPTZ
          constraints: nullable
          description: Source article publication timestamp, fetched from metadata when available or edited manually.
        - name: created_by_user_id
          type: BIGINT
          constraints: "NOT NULL REFERENCES app_user(id)"
          description: Immutable FK to the user who created the article.
        - name: source_import_type
          type: VARCHAR(32)
          migration: V29__facebook_import_type_attribution.sql
          constraints: "nullable"
        - name: source_import_run_id
          type: TEXT
          migration: V29__facebook_import_type_attribution.sql
          constraints: "REFERENCES facebook_import_run(import_run_id) ON DELETE SET NULL"
        - name: source_facebook_proposal_id
          type: BIGINT
          migration: V29__facebook_import_type_attribution.sql
          constraints: "REFERENCES facebook_article_proposal(id) ON DELETE SET NULL"
      indexes:
        - name: article_language_idx
          columns: [language]
          description: Speeds up per-language RSS feed queries.
        - name: article_created_at_idx
          columns: [created_at DESC]
          description: Speeds up default sort order for list and RSS endpoints.
        - name: article_published_at_idx
          columns: [published_at DESC]
          description: Speeds up publication date filtering and sorting.
        - name: article_created_by_user_idx
          columns: [created_by_user_id]
          description: Supports authenticated creator display and ownership queries.
    - name: app_user
      migration: V2__create_app_users.sql
      description: Stores emails permitted to execute write operations.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: PRIMARY KEY
        - name: email
          type: VARCHAR(254)
          constraints: "NOT NULL UNIQUE"
          description: Lowercased, trimmed email used for authorization allowlist.
        - name: role
          type: VARCHAR(16)
          constraints: "NOT NULL"
          description: Authorization role, one of USER or ADMIN.
        - name: status
          type: VARCHAR(16)
          constraints: "NOT NULL DEFAULT 'ACTIVE'"
          description: User lifecycle status, one of ACTIVE or DELETED. DELETED users are retained but are not allowlisted for writes; Google authentication may still establish an unprivileged session.
        - name: created_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
          description: UTC timestamp of allowlist entry creation.
      indexes:
        - name: app_user_email_idx
          columns: [email]
          description: Supports fast exact email lookups during authorization.
        - name: app_user_status_idx
          columns: [status]
          description: Supports active-user authorization and admin filtering.

    - name: facebook_page_connection
      migration: V35__facebook_page_publishing_foundation.sql
      description: >
        Per-language Page configuration with a language primary key, unique Page ID,
        encrypted access token, enabled flag, time zone and future link-selection
        settings. New connections default to disabled. Timestamps are UTC.
      columns:
        - name: language
          type: VARCHAR(20)
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "PRIMARY KEY"
        - name: page_id
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL UNIQUE"
        - name: page_name
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL"
        - name: access_token_encrypted
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL"
        - name: enabled
          type: BOOLEAN
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT false"
        - name: time_zone
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT 'Europe/Warsaw'"
        - name: monthly_link_limit
          type: INTEGER
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT 5 CHECK (monthly_link_limit >= 0)"
        - name: minimum_post_age_hours
          type: INTEGER
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT 24 CHECK (minimum_post_age_hours >= 0)"
        - name: scheduler_interval_minutes
          type: INTEGER
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT 60 CHECK (scheduler_interval_minutes > 0)"
        - name: connected_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT now()"
        - name: updated_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT now()"
    - name: facebook_page_publication
      migration: V35__facebook_page_publishing_foundation.sql
      description: >
        Durable publication queue with unique article_id_snapshot and post_id.
        article_id is a nullable FK with ON DELETE SET NULL; the snapshot preserves
        identity after deletion. Tracks Page, status, post permalink, image source,
        attempt count, sanitized error and UTC timestamps. The photo ID added
        in V36 supports later caption updates. Edit and delete work is tracked
        separately in facebook_page_sync.
      columns:
        - name: id
          type: BIGSERIAL
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "PRIMARY KEY"
        - name: article_id
          type: BIGINT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "UNIQUE REFERENCES article(id) ON DELETE SET NULL"
        - name: article_id_snapshot
          type: BIGINT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL UNIQUE"
        - name: language
          type: VARCHAR(20)
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL"
        - name: page_id
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: status
          type: VARCHAR(32)
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT 'PENDING'"
        - name: post_id
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "UNIQUE"
        - name: post_permalink
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: photo_id
          type: TEXT
          migration: V36__facebook_page_synchronization.sql
          constraints: "nullable"
        - name: image_source
          type: VARCHAR(32)
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "CHECK (image_source IN ('THUMBNAIL', 'PLACEHOLDER'))"
        - name: attempt_count
          type: INTEGER
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT 0 CHECK (attempt_count >= 0)"
        - name: last_error
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: created_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT now()"
        - name: published_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: updated_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT now()"
    - name: facebook_post_reaction_snapshot
      migration: V35__facebook_page_publishing_foundation.sql
      description: Per-post reaction totals and sanitized Graph read failures, collected by the engagement scheduler.
      columns:
        - name: id
          type: BIGSERIAL
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "PRIMARY KEY"
        - name: publication_id
          type: BIGINT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL REFERENCES facebook_page_publication(id) ON DELETE CASCADE"
        - name: reaction_count
          type: BIGINT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "CHECK (reaction_count >= 0)"
        - name: status
          type: VARCHAR(16)
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL CHECK (status IN ('SUCCESS', 'FAILED'))"
        - name: error_detail
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: measured_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT now()"
    - name: facebook_link_comment
      migration: V35__facebook_page_publishing_foundation.sql
      description: Per-post link selection, attempt, confirmed comment, failure and reconciliation record.
      columns:
        - name: id
          type: BIGSERIAL
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "PRIMARY KEY"
        - name: publication_id
          type: BIGINT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL UNIQUE REFERENCES facebook_page_publication(id) ON DELETE CASCADE"
        - name: page_id
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL"
        - name: post_id
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL"
        - name: story_url
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL"
        - name: status
          type: VARCHAR(32)
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL CHECK (status IN ('SELECTED', 'ATTEMPTING', 'CONFIRMED', 'FAILED', 'NEEDS_RECONCILIATION'))"
        - name: comment_id
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "UNIQUE"
        - name: attempted_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: confirmed_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: last_error
          type: TEXT
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "nullable"
        - name: created_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT now()"
        - name: updated_at
          type: TIMESTAMPTZ
          migration: V35__facebook_page_publishing_foundation.sql
          constraints: "NOT NULL DEFAULT now()"
    - name: facebook_page_sync
      migration: V36__facebook_page_synchronization.sql
      description: Durable update and delete requests, with uncertain-result reconciliation and manual image-replacement status.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: "PRIMARY KEY"
        - name: publication_id
          type: BIGINT
          constraints: "NOT NULL REFERENCES facebook_page_publication(id) ON DELETE CASCADE"
        - name: action
          type: VARCHAR(16)
          constraints: "NOT NULL; UPDATE or DELETE; unique with publication_id"
        - name: status
          type: VARCHAR(32)
          constraints: "NOT NULL; PENDING, ATTEMPTING, CONFIRMED, FAILED, NEEDS_RECONCILIATION, REPLACEMENT_REQUIRED or CANCELLED"
        - name: attempt_count
          type: INTEGER
          constraints: "NOT NULL DEFAULT 0"
        - name: dirty
          type: BOOLEAN
          constraints: "NOT NULL DEFAULT false"
        - name: replacement_required
          type: BOOLEAN
          constraints: "NOT NULL DEFAULT false"
        - name: requested_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
        - name: attempted_at
          type: TIMESTAMPTZ
          constraints: "nullable"
        - name: completed_at
          type: TIMESTAMPTZ
          constraints: "nullable"
        - name: last_error
          type: TEXT
          constraints: "nullable"
        - name: updated_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
    - name: article_story_view_daily
      migration: V37__article_story_view_daily.sql
      description: Daily UTC aggregate of qualifying story-page loads, without visitor identifiers or request metadata.
      columns:
        - name: article_id
          type: BIGINT
          constraints: "NOT NULL REFERENCES article(id) ON DELETE CASCADE; primary key with view_date_utc"
        - name: view_date_utc
          type: DATE
          constraints: "NOT NULL; UTC calendar date; primary key with article_id"
        - name: view_count
          type: BIGINT
          constraints: "NOT NULL DEFAULT 0 CHECK (view_count >= 0)"
    - name: facebook_article_image_generation
      migration: V39__facebook_article_image_generation.sql
      description: Durable generation state for a missing or rejected source thumbnail.
      columns:
        - name: article_id
          type: BIGINT
          constraints: "PRIMARY KEY REFERENCES article(id) ON DELETE CASCADE"
        - name: status
          type: VARCHAR(24)
          constraints: "NOT NULL CHECK (status IN ('MISSING_THUMBNAIL', 'GENERATING', 'GENERATED', 'FAILED'))"
        - name: attempt_count
          type: INTEGER
          constraints: "NOT NULL DEFAULT 0 CHECK (attempt_count >= 0)"
        - name: next_attempt_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
        - name: last_error
          type: TEXT
          constraints: nullable
        - name: updated_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
        - name: regenerate_requested
          type: BOOLEAN
          migration: V42__image_regeneration_after_article_edits.sql
          constraints: "NOT NULL DEFAULT false"
      indexes:
        - name: facebook_article_image_generation_due_idx
          columns: [status, next_attempt_at, article_id]
    - name: facebook_article_image_generation_pace
      migration: V39__facebook_article_image_generation.sql
      description: One shared next-claim time for the image generator across blue and green instances.
      columns:
        - name: id
          type: INTEGER
          constraints: "PRIMARY KEY CHECK (id = 1)"
        - name: next_claim_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
    - name: sessions
      migration: none (server-managed web session)
      description: No additional DB table required; session is server-managed and identified by HttpOnly cookie.
    - name: article_content
      migration: V5__article_content.sql
      description: Stores preserved article text captured at creation/update time. Used for archival only.
      columns:
        - name: article_id
          type: BIGINT
          constraints: "PRIMARY KEY REFERENCES article(id) ON DELETE CASCADE"
          description: FK to the parent article. Cascade delete removes content when article is deleted.
        - name: content
          type: TEXT
          constraints: NOT NULL
          description: Captured text normally shortened to 1200 characters plus ellipsis, with a historical repair exception and final 5 MiB UTF-8 cap; truncation is flagged.
        - name: truncated
          type: BOOLEAN
          constraints: "NOT NULL DEFAULT false"
          description: True when the stored content was truncated due to length limit.
        - name: captured_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
          description: Timestamp of when content was last captured.
    - name: facebook_import_run
      migration: V18__facebook_article_proposals.sql
      description: Stores Facebook import lifecycle, progress, cost and notification metadata.
      columns:
        - name: import_run_id
          type: TEXT
          constraints: PRIMARY KEY
        - name: import_type
          type: VARCHAR(32)
          migration: V29__facebook_import_type_attribution.sql
          constraints: "NOT NULL DEFAULT SELENIUM CHECK IN (API, APIFY, SELENIUM)"
          description: Import implementation used for this run.
        - name: status
          type: VARCHAR(32)
