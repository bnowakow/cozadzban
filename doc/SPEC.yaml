# ============================================================
# CoZaDzban — Full System Specification
#
# This file is the single source of truth for ALL system specs.
# It uses the OpenAPI 3.0 format for the API contract and
# OpenAPI x- extensions to capture database, architecture,
# business rules and UI specifications.
#
# Intended audience: LLMs used for code generation / review.
# Runtime OpenAPI (served by springdoc) lives in openapi.yaml.
# ============================================================

openapi: 3.0.3

# ──────────────────────────────────────────────────────────────
# ARCHITECTURE SPEC  (x-architecture)
# ──────────────────────────────────────────────────────────────
x-architecture:
  language: Kotlin
  framework: Spring Boot 4.x
  javaVersion: 21
  buildTool: Gradle (Kotlin DSL)
  components:
    - name: REST API
      technology: Spring MVC (spring-boot-starter-webmvc)
      description: >
        CRUD endpoints for Article resources plus an RSS feed endpoint.
        Request/response bodies use JSON; errors use application/problem+json
        (RFC 9457 / Spring ProblemDetail).
    - name: Authentication and authorization
      technology: Spring Security Resource Server + Google OpenID Connect
      description: >
        Google is the selected OAuth/OIDC provider.
        JWT access tokens are validated using issuer metadata from
        https://accounts.google.com.
        Read endpoints are public. Write-inducing endpoints require a valid
        Bearer token and allowlisted email.
        Authorization model has two roles: USER and ADMIN.
        USER can perform article write operations.
        ADMIN can perform all operations, including allowlist management.
        A dedicated machine-to-machine API key may also be accepted for article
        create and article content patch requests used by the Facebook importer.
    - name: Database
      technology: PostgreSQL + Spring Data JDBC
      description: >
        All domain data is stored in PostgreSQL.
        Persistence uses Spring Data JDBC (not JPA/Hibernate) via
        CrudRepository / NamedParameterJdbcTemplate.
        No DDL is auto-generated; all schema changes go through Flyway.
        All queries MUST use parameterised statements — raw string
        concatenation into SQL is forbidden to prevent SQL injection
        (OWASP A03).
    - name: Schema migrations
      technology: Flyway
      description: >
        Versioned SQL migration scripts in src/main/resources/db/migration/.
        Naming convention: V<version>__<description>.sql (e.g. V1__create_articles.sql).
        No DDL must be written outside Flyway scripts.
    - name: URL enrichment
      technology: Spring RestClient (spring-boot-starter-restclient)
      description: >
        On create (POST), replace (PUT) and partial update (PATCH when url is
        changed), the server synchronously fetches the target URL and extracts
        title (og:title / <title>), thumbnail (og:image), favicon
        (downloaded from link icon metadata into the local favicon cache), lead
        (og:description / <meta name="description">), and best-effort
        publication date metadata.
        Enrichment is synchronous and atomic — if the fetch fails no DB write occurs.
        Defaults: connect timeout 3 s, read timeout 5 s, no retries.
        If the fetch returns a non-2xx status, times out, or the URL is
        unreachable, the server responds with 422 and the article is not persisted.
    - name: RSS feed
      technology: Custom controller returning application/rss+xml
      rssFieldMapping:
        rssTitle: article.title
        rssLink: article.url
        rssDescription: article.lead
        rssPubDate: article.publishedAt when present, otherwise article.createdAt
        rssGuid: article.id
        userData: never exposed
      rssChannel:
        title: Co za dzban
        link: https://cozadzban.pl
        description: fucked up news
        language: en
        generator: cozadzban.pl
        lastBuildDateSource: app.build.timestamp injected by Gradle as ISO-8601 UTC
        lastBuildDateFormat: RFC-822 UTC (converted by RSS controller from ISO-8601)
        langFilter: GET /rss?lang=<BCP-47> filters to a single language; channel language element is set to the filter value
      htmlDiscovery:
        linkRelAlternate: '<link rel="alternate" type="application/rss+xml" title="Co za dzban RSS" href="/rss">'
        visibleUiLink: ArticleListView top bar includes an RSS icon/link to /rss
    - name: Vaadin UI
      technology: Vaadin 25 + spring-boot-starter (server-side)
      description: >
        Paginated, server-side rendered view of articles mounted at /.
        Not part of the REST API surface; see x-vaadin-ui for the spec.
    - name: Observability
      technology: Micrometer + Brave (Zipkin tracing) + Actuator
      description: >
        Distributed tracing via Brave/Zipkin. Actuator endpoints exposed for
        health, metrics and info.
    - name: Web security defaults
      technology: Spring Security + CORS
      description: >
        CORS allows only origin https://cozadzban.pl.
        API is stateless, so CSRF is disabled for /api/** and /rss.
        CSRF remains enabled for Vaadin UI routes.
    - name: Bootstrap configuration
      technology: Spring Boot configuration properties
      description: >
        COZADZBAN_BOOTSTRAP_ADMIN_EMAIL is only required when the app_user
        table contains no ADMIN rows. If at least one ADMIN exists, the env var
        is optional and ignored. If no ADMINs exist and the env var is missing
        or empty, startup fails fast. If no ADMINs exist and env var is a valid
        email, one ADMIN row is seeded (or an existing USER is promoted).

    - name: Frontend authentication
      technology: Vaadin UI + Spring Security oauth2Login (Authorization Code + PKCE)
      description: >
        Login starts with redirect to Google authorization endpoint.
        OAuth callback is handled server-side; frontend JavaScript never receives
        access tokens or ID tokens.
        Session is represented by HttpOnly server session cookie.
        /auth/me provides current user info.
    - name: Authentication endpoints
      technology: Spring MVC UiAuthController + Spring Security oauth2Login
      description: >
        GET /auth/login starts OAuth Authorization Code + PKCE flow.
        GET /auth/me returns current user email, nullable role, and allowlist state.
        POST /auth/logout invalidates server session and clears session cookie.
    - name: Admin management panel
      technology: Vaadin UI AdminView at @Route("/admin")
      description: >
        ADMIN-only view with user table, add user form, soft-delete/restore/update role actions.
        View invokes application services server-side from Vaadin event handlers;
        no browser-side token forwarding is used.
    - name: Facebook import orchestration
      technology: Spring Batch tasklet + scheduled/admin launch + Spring-managed Selenium WebDriver + proposal inbox
      description: >
        A long-lived Selenium browser session is owned by the worker app and reused
        across import runs. Spring Batch owns run lifecycle/history for the
        facebookImportJob, while the scraper remains a single synchronous tasklet.
        The worker launches once on startup and then at the configured interval
        when scheduling is enabled; ADMIN REST/UI triggers launch the same Batch job
        manually. Each run generates its importRunId before login, opens the browser
        on demand if needed, verifies the Facebook login state, emits a login-required
        event when manual two-factor login is needed, and processes at most one import
        at a time per worker. The worker submits discovered article proposals to
        machine-only server endpoints instead of creating Articles directly. Logged-in
        users review proposals later in a Vaadin inbox.
    - name: Analytics and consent
      technology: Vaadin UI + configurable tracking IDs
      description: >
        Google Analytics and StatCounter scripts are rendered only when their
        IDs are configured and the user has explicitly accepted analytics
        cookies. Consent is analytics-only and can be changed later. RSS feed
        requests emit best-effort server-side analytics events when the matching
        server-side analytics credentials are configured.
    - name: Article content preservation cache
      technology: Future PostgreSQL-backed content cache
      description: >
        Implemented: article text/content is captured at creation/update time
        into the article_content table (V5 migration) for preservation only.
        Content is NOT used for UI rendering, source fallback, or AI summary.
        Max stored length is 5 MiB of UTF-8 text; longer content is truncated
        and flagged. Separate product/legal decisions required before any
        further use.

# ──────────────────────────────────────────────────────────────
# DATABASE SPEC  (x-database)
# ──────────────────────────────────────────────────────────────
x-database:
  engine: PostgreSQL
  migrationTool: Flyway
  migrationPath: src/main/resources/db/migration/
  namingConvention: "V<version>__<snake_case_description>.sql"
  tables:
    - name: article
      migration: V1__create_articles.sql
      description: Stores enriched article records submitted by users.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: PRIMARY KEY
        - name: url
          type: TEXT
          constraints: "NOT NULL UNIQUE"
          description: Full URL of the source page as submitted by the user. Must be globally unique.
        - name: language
          type: VARCHAR(20)
          constraints: NOT NULL
          description: BCP-47 language tag (e.g. pl, en, de).
        - name: title
          type: TEXT
          constraints: nullable
          description: Page title fetched from og:title or <title>.
        - name: thumbnail
          type: TEXT
          constraints: nullable
          description: Thumbnail URL fetched from og:image.
        - name: favicon
          type: TEXT
          constraints: nullable
          description: Local cached favicon URL downloaded from source site link icon metadata when available.
        - name: lead
          type: TEXT
          constraints: nullable
          description: Lead text fetched from og:description or <meta name="description">.
        - name: quote
          type: TEXT
          constraints: nullable
          description: Optional user-provided quote or comment about the article. Not server-fetched.
        - name: ai_summary
          type: TEXT
          constraints: nullable
          description: Reserved for future AI-generated summary. Always NULL currently.
        - name: created_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
          description: Timestamp of record creation; set by the database.
        - name: published_at
          type: TIMESTAMPTZ
          constraints: nullable
          description: Source article publication timestamp, fetched from metadata when available or edited manually.
        - name: created_by_user_id
          type: BIGINT
          constraints: "NOT NULL REFERENCES app_user(id)"
          description: Immutable FK to the user who created the article.
      indexes:
        - name: article_language_idx
          columns: [language]
          description: Speeds up per-language RSS feed queries.
        - name: article_created_at_idx
          columns: [created_at DESC]
          description: Speeds up default sort order for list and RSS endpoints.
        - name: article_published_at_idx
          columns: [published_at DESC]
          description: Speeds up publication date filtering and sorting.
        - name: article_created_by_user_idx
          columns: [created_by_user_id]
          description: Supports authenticated creator display and ownership queries.
    - name: app_user
      migration: V2__create_app_users.sql
      description: Stores emails permitted to execute write operations.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: PRIMARY KEY
        - name: email
          type: VARCHAR(254)
          constraints: "NOT NULL UNIQUE"
          description: Lowercased, trimmed email used for authorization allowlist.
        - name: role
          type: VARCHAR(16)
          constraints: "NOT NULL"
          description: Authorization role, one of USER or ADMIN.
        - name: status
          type: VARCHAR(16)
          constraints: "NOT NULL DEFAULT 'ACTIVE'"
          description: User lifecycle status, one of ACTIVE or DELETED. DELETED users are retained but cannot authenticate or authorize writes.
        - name: created_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
          description: UTC timestamp of allowlist entry creation.
      indexes:
        - name: app_user_email_idx
          columns: [email]
          description: Supports fast exact email lookups during authorization.
        - name: app_user_status_idx
          columns: [status]
          description: Supports active-user authorization and admin filtering.

    - name: sessions
      migration: none (server-managed web session)
      description: No additional DB table required; session is server-managed and identified by HttpOnly cookie.
    - name: article_content
      migration: V5__article_content.sql
      description: Stores preserved article text captured at creation/update time. Used for archival only.
      columns:
        - name: article_id
          type: BIGINT
          constraints: "PRIMARY KEY REFERENCES article(id) ON DELETE CASCADE"
          description: FK to the parent article. Cascade delete removes content when article is deleted.
        - name: content
          type: TEXT
          constraints: NOT NULL
          description: Captured article text, truncated to 5 MiB of UTF-8 bytes when necessary.
        - name: truncated
          type: BOOLEAN
          constraints: "NOT NULL DEFAULT false"
          description: True when the stored content was truncated due to length limit.
        - name: captured_at
          type: TIMESTAMPTZ
          constraints: nullable
          description: Timestamp of when content was last captured.
    - name: facebook_import_run
      migration: V18__facebook_article_proposals.sql
      description: Stores Facebook import run metadata for proposal batches and future notifications.
      columns:
        - name: import_run_id
          type: TEXT
          constraints: PRIMARY KEY
        - name: status
          type: VARCHAR(32)
          constraints: "NOT NULL CHECK IN (RUNNING, FINISHED, FAILED, TERMINATED)"
        - name: started_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
        - name: finished_at
          type: TIMESTAMPTZ
          constraints: nullable
        - name: summary_logs_compressed
          type: BYTEA
          constraints: nullable
          description: UTF-8 GZIP compressed run diagnostics.
    - name: facebook_article_proposal
      migration: V18__facebook_article_proposals.sql
      description: Stores discovered Facebook import candidates awaiting human review.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: PRIMARY KEY
        - name: canonical_article_url
          type: TEXT
          constraints: "NOT NULL UNIQUE"
          description: Canonical article URL; identity for duplicate prevention.
        - name: status
          type: VARCHAR(32)
          constraints: "nullable CHECK IN (ACCEPTED, REJECTED, FAILED)"
          description: NULL means pending review.
        - name: logs_compressed
          type: BYTEA
          constraints: nullable
          description: UTF-8 GZIP compressed proposal diagnostics.
    - name: Spring Batch metadata tables
      migration: V19__spring_batch_metadata.sql
      description: >
        Spring Batch 6 PostgreSQL metadata for durable facebookImportJob run
        lifecycle/history. Flyway owns the BATCH_JOB_*, BATCH_STEP_*, and
        BATCH_*_SEQ objects; Spring Batch schema initialization remains disabled.
# ──────────────────────────────────────────────────────────────
# BUSINESS RULES  (x-business-rules)
# ──────────────────────────────────────────────────────────────
x-business-rules:
  - id: BR-01
    name: URL enrichment on create
    description: >
      When a new Article is created (POST /api/articles), the server MUST fetch
      the URL and populate title, thumbnail, favicon, lead, and best-effort publishedAt
      before persisting.
      The operation is fully atomic: if enrichment fails (non-2xx, timeout, or
      unreachable), the server responds with 422 and no DB write occurs.
  - id: BR-02
    name: URL enrichment on replace
    description: >
      When an Article is replaced (PUT /api/articles/{id}), the server MUST
      re-fetch the new URL to refresh title, thumbnail, favicon, lead, and best-effort
      publishedAt unless the request explicitly supplies publishedAt.
      The operation is fully atomic: if enrichment fails, the server responds
      with 422 and the existing article record is left unchanged.
  - id: BR-03
    name: Partial update enrichment
    description: >
      When an Article is patched (PATCH /api/articles/{id}) and the url field
      is included in the payload, the server MUST re-fetch to refresh enriched
      fields. If the patch explicitly includes publishedAt, the supplied value
      overrides fetched publication metadata. The operation is fully atomic: if enrichment fails, the server
      responds with 422 and the existing article record is left unchanged.
      If url is absent, enriched fields are left unchanged.
  - id: BR-04
    name: Language normalization and validation
    description: >
      Language is accepted as a conservative BCP-47-like string, normalized to
      lowercase before persistence, and validated with
      ^[a-z]{2,3}(-[a-z0-9]{2,8})*$. Invalid values return 400 Bad Request.
      The UI language filter uses distinct normalized values already present in
      the database. The public feed shows All plus the three most-used languages
      and a compact overflow menu for the complete language list.
  - id: BR-05
    name: AI summary is future-only
    description: >
      The aiSummary field MUST always be null in the current implementation.
      It is present in the schema as a placeholder for a future enrichment step.
  - id: BR-06
    name: Schema changes via Flyway only
    description: >
      No DDL (CREATE TABLE, ALTER TABLE, etc.) may be executed outside of a
      Flyway migration script. Spring Data JDBC ddl-auto must NOT be set.
  - id: BR-07
    name: RSS ordering
    description: >
      The RSS feed MUST list articles in descending createdAt order
      (newest first). RSS pubDate uses publishedAt when present and falls back
      to createdAt. RSS MUST never expose creator/user data.
  - id: BR-08
    name: URL uniqueness
    description: >
      The url field MUST be globally unique across all articles regardless
      of language. Attempting to create an article with a url that already
      exists MUST return 409 Conflict. A UNIQUE constraint on the url column
      enforces this at the persistence layer.
  - id: BR-09
    name: SQL injection prevention
    description: >
      All database access MUST use parameterised queries. Spring Data JDBC
      repositories fulfil this automatically. Any custom queries using
      NamedParameterJdbcTemplate MUST use named parameters (:param) and
      never string concatenation. Raw JdbcTemplate with concatenated SQL
      is forbidden (OWASP A03).
  - id: BR-10
    name: Public read endpoints
    description: >
      The following endpoints MUST be publicly accessible without
      authentication: GET /api/articles, GET /api/articles/{id}, GET /rss.
  - id: BR-11
    name: Protected write endpoints
    description: >
      The following endpoints MUST require a valid OAuth2 Bearer token issued
      by Google OIDC: POST /api/articles, PUT /api/articles/{id},
      PATCH /api/articles/{id}, DELETE /api/articles/{id}.
      Missing or invalid tokens return 401; insufficient privileges return 403.
  - id: BR-12
    name: OAuth token validation rules
    description: >
      Accepted token type is OAuth2 Bearer access token (JWT).
      ID tokens are not accepted for API authorization.
      Required claim checks: iss=https://accounts.google.com,
      aud contains configured application client id,
      exp in the future, sub present, email present,
      and email_verified=true.
  - id: BR-13
    name: Allowlist enforcement
    description: >
      For all write operations, normalized token email (trimmed, lowercased)
      must exist in app_user.email with status ACTIVE.
      If token is valid but email is not allowlisted, return 403.
  - id: BR-14
    name: URL canonicalization defaults
    description: >
      URL uniqueness and conflict detection use canonicalized URL value:
      lowercase scheme and host, remove default ports (:80 for http, :443 for https),
      remove fragment, preserve path and query, and remove trailing slash only
      for root path. Query parameters known to be tracking-only are removed
      before uniqueness checks and persistence: fbclid, utm_*, gclid, dclid,
      and msclkid. Facebook URLs preserve only semantic identity parameters
      (fbid, set, story_fbid, id); Instagram URLs remove all query parameters.
      Canonicalized URL is persisted in article.url.
  - id: BR-15
    name: UTC time standard
    description: >
      All persisted timestamps are UTC.
      JSON date-time fields use ISO-8601 UTC.
      RSS pubDate uses RFC-822 UTC.
  - id: BR-16
    name: CORS and CSRF defaults
    description: >
      CORS allows only https://cozadzban.pl.
      CSRF is disabled for /api/** and /rss.
      CSRF remains enabled for Vaadin UI routes.
  - id: BR-17
    name: Allowlist management API
    description: >
      Allowlist is managed using /api/users endpoints.
      All these endpoints require valid token, allowlisted email,
      and ADMIN role.
      Role changes are performed with PATCH /api/users/{id}.
  - id: BR-18
    name: PATCH media type and semantics
    description: >
      PATCH /api/articles/{id} uses JSON Merge Patch
      (application/merge-patch+json) semantics.
  - id: BR-19
    name: PATCH null and empty-string handling
    description: >
      For PATCH /api/articles/{id}, null value for required fields
      (url, language) is invalid and returns 400 Bad Request.
      Empty string ("") for any string field is invalid and returns 400.
  - id: BR-20
    name: Bootstrap admin user
    description: >
      On application startup, count ADMIN rows in app_user.
      If at least one ADMIN exists, skip bootstrap entirely (env var ignored).
      If no ADMIN exists, COZADZBAN_BOOTSTRAP_ADMIN_EMAIL is required:
        missing, empty, or invalid email format → fail startup fast.
        valid email → insert one ADMIN row (trim + lowercase);
        if email already exists with role USER, promote it to ADMIN.
  - id: BR-21
    name: Role-based access control
    description: >
      USER can read and perform article writes.
      ADMIN can perform all USER actions and manage allowlist users.
  - id: BR-22
    name: Build timestamp source
    description: >
      RSS channel lastBuildDate must come from application property
      app.build.timestamp, injected at build time as ISO-8601 UTC
      (e.g. 2026-05-02T10:00:00Z) by the Gradle processResources task.
      The RSS controller parses this ISO-8601 string and reformats it
      to RFC-822 UTC before emitting the feed.
      If the property is missing or unparseable, startup fails fast.
  - id: BR-23
    name: Minimum admin invariant
    description: >
      System must always keep at least one ACTIVE ADMIN user.
      Soft-deleting the final ACTIVE ADMIN returns 409 Conflict.
      Any role or status change that would result in zero ACTIVE ADMIN users
      returns 409 Conflict.
  - id: BR-24
    name: Frozen response contract behavior
    description: >
      Response field order is non-contractual and clients must not depend on it.
      Producers must emit only documented fields for frozen schemas.
      Consumers should ignore unknown fields for forward compatibility.
  - id: BR-25
    name: Conflict discriminator contract
    description: >
      Every 409 response uses ProblemDetail with mandatory fields:
      status, type, title, detail.
      type must be a stable URI discriminator. Optional extension fields such as
      conflictField, existingId, remainingAdmins may be included when relevant.
  - id: BR-26
    name: Sort field allowlist
    description: >
      The sort parameter on GET /api/articles MUST be validated against an
      explicit allowlist before use in SQL ORDER BY:
      [id, createdAt, publishedAt, language, title, url].
      Column names must never be interpolated from raw user input.
      An unrecognised field returns 400 Bad Request.
  - id: BR-27
    name: Quote field semantics
    description: >
      quote is user-provided text, optional and nullable.
      Clients supply it in POST/PUT body alongside url and language.
      If omitted from POST/PUT, it defaults to null.
      In PATCH, an explicit null value clears the field; omitting quote leaves
      it unchanged (standard JSON Merge Patch semantics).
      Facebook import marker phrases such as "co za dzban" are discovery signals
      and MUST NOT be persisted as article quotes.
  - id: BR-28
    name: Input field length and format constraints
    description: >
      url: minLength 1, maxLength 2048, must match ^https?://.+ (http/https only).
      language: minLength 1, maxLength 20 (matches VARCHAR(20) DB column),
      normalized to lowercase, and must match ^[a-z]{2,3}(-[a-z0-9]{2,8})*$.
      quote: minLength 1 when present and non-null, maxLength 2000.
      publishedAt: nullable ISO-8601 date-time when present.
      Empty string ("") is invalid for any string field and returns 400.
      Violations return 400 Bad Request with ProblemDetail.
  - id: BR-29
    name: Allowlist email and role validation
    description: >
      email must be a valid RFC 5321 address, maxLength 254 characters.
      role must be exactly one of the enum values USER or ADMIN (case-sensitive).
      status must be exactly one of ACTIVE or DELETED when included in admin
      edit payloads.
      Any unrecognised role value returns 400 Bad Request.
      Empty string for email or role returns 400 Bad Request.

  - id: BR-30
    name: Frontend login flow
    description: >
      User clicks "Login" button on ArticleListView.
      Frontend navigates to GET /auth/login which redirects to Google OIDC.
      OAuth callback is processed server-side using Authorization Code + PKCE.
      Frontend JavaScript MUST NOT receive or store raw OAuth tokens.
      UI stores only minimal display state (e.g. authenticated=true, email, role).
      ArticleListView updates UI to show logout button and "Add Article" button.
  - id: BR-31
    name: Backend session issuance
    description: >
      On successful OAuth callback, backend creates authenticated server session.
      Session cookie is HttpOnly, Secure in production, SameSite=Lax, Path=/.
      Role is resolved from allowlist (`app_user`) using normalized email.
      Users with status DELETED cannot log in or authorize write operations.
      Session lifetime has idle timeout and absolute timeout configured in app properties.
  - id: BR-32
    name: Logout clears session
    description: >
      POST /auth/logout invalidates the server session, clears session cookie,
      and returns 204.
      Frontend clears local user state and shows "Login" button again.
  - id: BR-33
    name: Admin panel RBAC
    description: >
      GET /admin route requires authenticated user with role=ADMIN.
      If user is not authenticated or not ADMIN, redirect to /?require-login=true or show 403.
      Admin can list users, add users, soft-delete/restore users, and update roles.
      These actions are executed server-side via application services.
  - id: BR-34
    name: Article creation requires login
    description: >
      "Add Article" button visible only when user is authenticated (active server session).
      Click opens modal with form (url, language, optional quote).
      Submission executes server-side `ArticleService` create operation from Vaadin event handler.
      On success (201), modal closes, grid refreshes, success toast shown.
      On failure (400, 409, 422, 403), error toast shown with detail.
  - id: BR-35
    name: Session renewal and expiry
    description: >
      Session expiry is controlled server-side by idle and absolute timeouts.
      Session renewal uses server policy (sliding expiration) and does not expose
      OAuth tokens or custom JWT refresh endpoints to frontend JavaScript.
      Expired session returns 401 for /auth/me and requires re-login.
  - id: BR-36
    name: CSRF protection with cookies
    description: >
      Cookie-based authenticated UI requests MUST be protected by CSRF tokens.
      HttpOnly protects against token theft via JavaScript but does NOT mitigate CSRF.
      Vaadin/Spring Security CSRF mechanisms remain enabled for session-backed UI endpoints.
      Stateless bearer-token API endpoints MAY remain CSRF-disabled.
  - id: BR-37
    name: Article creator ownership
    description: >
      Every article MUST have an immutable created_by_user_id FK to app_user.
      Article creation resolves this FK from the authenticated DB user: JWT email
      for REST requests and session principal for Vaadin UI requests. PUT/PATCH
      never accept or change creator.
  - id: BR-38
    name: Creator exposure rules
    description: >
      Public/anonymous article list and detail responses MUST omit creator data.
      Authenticated article responses MUST include createdBy { id, email } in
      both the list endpoint (GET /api/articles) and the detail endpoint
      (GET /api/articles/{id}). Creator IDs are batch-fetched per page for the
      list endpoint to avoid N+1 queries.
      RSS MUST never expose creator/user data.
  - id: BR-39
    name: Existing article creator backfill
    description: >
      The migration adding article.created_by_user_id MUST backfill all existing
      articles to the oldest app_user by created_at ASC, id ASC. If articles
      exist but no users exist, migration fails and the app must not launch.
  - id: BR-40
    name: Soft-deleted users
    description: >
      Deleting a user changes status from ACTIVE to DELETED. User rows and email
      uniqueness are retained for audit/history and article creator FKs. DELETED
      users cannot log in or authorize writes. Admins can restore users by
      changing status back to ACTIVE.
  - id: BR-41
    name: Publication date metadata
    description: >
      publishedAt is nullable. Enrichment attempts publication date extraction
      in order: meta[property=article:published_time], JSON-LD Article or
      NewsArticle datePublished, meta[name=date], meta[property=datePublished],
      and time[datetime]. Missing or unparseable publication date does not fail
      enrichment and persists null unless a user-supplied value is provided.
  - id: BR-42
    name: Article filtering
    description: >
      Article list endpoints support filters for language, publishedAt range,
      and createdAt range. The public Vaadin feed exposes language and collapsed
      publishedAt range filters.
  - id: BR-50
    name: Article favicon backfill
    description: >
      On application startup, the server SHOULD scan existing articles whose
      favicon is missing, blank, or not a local /favicons/... cache URL, download
      the source site's favicon from article.url metadata or origin /favicon.ico,
      and update only the article.favicon column. The backfill MUST be
      best-effort and MUST NOT block article reads when an individual favicon
      cannot be fetched.
  - id: BR-43
    name: Analytics consent
    description: >
      Google Analytics and StatCounter scripts are loaded only when configured
      IDs are present and the user has accepted analytics cookies. Consent text
      must make clear tracking is for analytics only, and users can reject or
      later revoke consent. The consent banner is shown by default (when
      analytics is configured) and remains visible until the user explicitly
      accepts or declines. RSS feed requests MAY emit best-effort server-side
      analytics events using configured analytics credentials; these events MUST
      NOT block the RSS response.
  - id: BR-44
    name: RSS discovery
    description: >
      Article pages MUST advertise the RSS feed to browsers/feed readers using
      a standard HTML discovery link:
      <link rel="alternate" type="application/rss+xml" title="Co za dzban RSS" href="/rss">.
      The UI SHOULD also include a visible RSS icon/link to /rss in the article
      list top bar.
  - id: BR-45
    name: Article content preservation cache future consideration
    description: >
      Article text/content is captured at creation/update time (V5 migration,
      article_content table, max 5 MiB of UTF-8 text with truncation flag). Used for
      archival/preservation only. Do NOT use for UI rendering, source fallback,
      or AI summary generation without separate product/legal decisions on
      sanitization, access control, copyright/privacy posture, and purge behavior.
  - id: BR-46
    name: Facebook import job orchestration
    description: >
      Facebook import runs through the Spring Batch facebookImportJob, with a
      single synchronous tasklet wrapping the Selenium scraper. The worker may
      launch the job manually through ADMIN REST/UI controls or automatically
      once on startup and then every configured interval when scheduling is
      enabled. A single long-lived Selenium browser session is reused across
      runs. The worker must generate the importRunId before login, verify whether
      Facebook is already logged in before each import, emit a login-required
      event and wait for manual/two-factor login when needed, and record FINISHED,
      FAILED, or TERMINATED for every terminal path. Only one import may run at a
      time per worker, and the browser window remains open until application
      shutdown. Discovery submits proposal batches and must not block on a human
      approval modal or create Articles directly.
  - id: BR-47
    name: Facebook import admin access
    description: >
      The Facebook import trigger endpoints and the ArticleListView button are
      visible and usable only by authenticated ADMIN users. Non-admin users must
      not see the control in the UI and must receive 403/Forbidden when calling
      the admin endpoints directly.
  - id: BR-48
    name: Machine-to-machine Facebook proposal writes
    description: >
      The Facebook importer writes proposal batches, proposal existence checks,
      and import-run completion events using a dedicated machine credential. The
      machine credential must not grant access to allowlist or admin endpoints.
      Accepted proposals create Articles owned by the configured ACTIVE import bot user.
  - id: BR-49
    name: Facebook article proposal inbox
    description: >
      The worker submits candidates as stored article proposals with candidateId,
      article URL, source Facebook post URL, guessed language, importRunId, and
      compressed diagnostics. Canonical article URL is unique across proposals;
      if the URL already exists as an Article or Proposal the worker/server skips it.
      Rediscovery updates lastSeen/log diagnostics without resetting an existing decision.
      Proposal status is null for pending or one of accepted, rejected, failed.
      All ACTIVE logged-in users may review proposals at /article-proposals, open
      article/Facebook links in a new tab, correct language, and accept or reject.
      Accept creates a normal Article owned by the configured import bot; if creation
      fails the proposal is marked failed and may be retried.
  - id: BR-50
    name: Facebook import notification hooks
    description: >
      The import system emits Spring application events for future notification
      delivery without implementing a delivery channel in this phase:
      FacebookImportLoginRequiredEvent on the worker when manual login or second
      factor is needed, FacebookProposalBatchSubmittedEvent on the server when a
      batch accepts at least one new proposal, and FacebookImportRunCompletedEvent
      when the server records run completion.
# ──────────────────────────────────────────────────────────────
# VAADIN UI SPEC  (x-vaadin-ui)
# ──────────────────────────────────────────────────────────────
x-vaadin-ui:
  mountPath: /
  technology: Vaadin 25, server-side rendering
  views:
    - name: ArticleListView
      route: /
      description: >
        Lazy-loaded social feed listing article cards.
      features:
        - Vaadin VirtualList lazy loading backed by server-side pagination
        - Article cards with optional square thumbnail, source favicon/name, published date, title, optional quote, and lead
        - Whole card opens source URL in a new tab
        - Language chips show All plus the three most-used languages and a compact overflow menu
        - Published date range controls are collapsed until the user clicks the Published date filter
        - Header includes logo, RSS link, icon-only theme toggle, and authentication/actions
        - Footer shows app version and a concise cookie notice

    - name: (Enhanced) ArticleListView
      route: /
      enhancements:
        - "Top-right corner: Login button if not authenticated; Logout button if authenticated (present on every page)"
        - "Logout button click -> invalidates server session, clears security context, redirects to /"
        - "Login button click -> navigates to GET /auth/login (OAuth flow)"
        - "If authenticated: Add Article button in toolbar"
        - "If authenticated: Article Proposals button links to /article-proposals"
        - "If authenticated and ADMIN: Import Facebook Posts button next to Add Article triggers the Facebook import job"
        - "Facebook import is non-blocking and submits proposals to /article-proposals; no approval modal is shown during discovery"
        - "Click Add Article -> modal with form (url, language, quote, optional publishedAt date/time)"
        - "Form validation: url required (^https?://.+), language required and normalized lowercase, quote optional, publishedAt optional"
        - "Submit server-side via ArticleService with loading spinner; on success close modal + refresh grid + success toast"
        - "On error (400/409/422): show error toast with detail"
        - "On successful callback: close login modal, update UI to show logout button and Add Article, show success toast"
        - "Authenticated users may see creator email/id where useful; anonymous users never see creator data"
        - "Expose RSS discovery via rel=alternate in page HTML and visible RSS icon/link in the top bar"
        - "Analytics consent banner appears only when analytics IDs are configured and controls Google Analytics/StatCounter loading"

    - name: AdminView
      route: /admin
      description: >
        Admin-only user management panel. Requires authentication + ADMIN role.
        If not authenticated or not admin, show 403 or redirect to /?require-login=true
      columns: [id, email, role, status, createdAt]
      features:
        - Users table with all app_user records
        - "Delete icon/button per row: invokes AppUserService soft delete, confirm dialog, error toast if 409 (last active admin)"
        - "Role selector per row: change role invokes AppUserService patchRole, shows success/error toast"
        - "Status selector per row: ACTIVE/DELETED; restoring a deleted user changes status back to ACTIVE"
        - "Add User button -> modal with email input + role selector"
        - "Submit invokes AppUserService create, error toast on 400/409, success toast + table refresh"
        - "Logout button in top-right (same as every other view): invalidates session, redirects to /"

    - name: ArticleContentCacheAdminView
      route: /admin/article-content-cache
      description: >
        Admin-only article content cache management panel. Requires authentication + ADMIN role.
      features:
        - Preserved content cache table with article ID, source URL, dates, size, truncation state, and capture time
        - Filters for article ID, article URL, publishedAt range, and createdAt range
        - View dialog for preserved content with refresh-from-source, edit, save, and purge actions
        - Navigation back to user management and the public feed
    - name: FacebookArticleProposalView
      route: /article-proposals
      description: >
        Proposal inbox for ACTIVE logged-in users to review Facebook import candidates.
      features:
        - Grid sorted by submittedAt descending
        - Default pending-only status filter plus all/accepted/rejected/failed filters
        - Article URL and Facebook post URL render as external links opening in a new tab
        - Review dialog shows compressed diagnostics, editable language, Accept, Reject, and retry for failed proposals
# ──────────────────────────────────────────────────────────────
# API SPEC  (standard OpenAPI)
# ──────────────────────────────────────────────────────────────
info:
  title: CoZaDzban API
  description: |
    ## Overview
    CoZaDzban is a link-collecting application. Users submit a URL and a language
    tag; the server fetches the target page and automatically enriches the record
    with title, thumbnail, favicon, lead, and best-effort publication date before persisting it.

    ## Components
    1. **REST API** — CRUD endpoints for `Article` resources (this spec).
    2. **PostgreSQL database** — all data persisted via Spring Data JDBC.
    3. **Flyway migrations** — all schema changes are managed as versioned SQL
       migration scripts located in `src/main/resources/db/migration/`.
       No DDL is generated or executed outside of Flyway.
    4. **RSS feed** — `GET /rss` exposes articles as an RSS 2.0 feed;
       filterable per language with `?lang=<BCP-47>`.
    5. **Vaadin UI** — server-side lazy feed of articles (separate from
       this REST spec; rendered at the root path `/`).

    6. **Frontend authentication** — Vaadin UI starts OAuth Authorization Code + PKCE
       via backend redirect (`GET /auth/login`) and uses server-side session cookie.
    7. **Admin pages** — Vaadin UI at `/admin` for ADMIN users to manage allowlist
       (add/soft-delete/restore/update users) and at `/admin/article-content-cache`
       to inspect, refresh, edit, and purge preserved article content cache entries,
       using server-side service calls.
    8. **Facebook import job** — Spring Batch runs a single Selenium tasklet, either
       from ADMIN REST/UI triggers or the worker schedule (`run now`, then every
       configured interval). The worker reuses one browser session, emits a login
       required event when manual Facebook 2FA is needed, and submits discovered
       candidates as stored article proposals instead of creating Articles directly.
    9. **Article proposal inbox** — ACTIVE logged-in users review Facebook import
       proposals at `/article-proposals`, correct language, and accept/reject.
    10. **Machine-to-machine writes** — the Facebook importer submits proposals and
       run completion events using a dedicated API key tied to an allowlisted bot user.
    ## Implementation notes
    - Language is normalized to lowercase and validated against a conservative
      BCP-47-like pattern (e.g. `pl`, `en`, `en-gb`).
    - `title`, `thumbnail`, `favicon`, `lead`, and best-effort `publishedAt` are
      server-fetched; clients supply `url`, `language`, optional `quote`, and
      optional `publishedAt` on create/replace. Enrichment is
      atomic — 422 on failure means no DB write occurs and existing records are unchanged.
    - Each article stores an immutable creator FK. Creator data is omitted from
      anonymous article responses and RSS; authenticated article responses may
      include `createdBy`.
    - `aiSummary` is reserved for a future AI enrichment step; always `null`
      in the current version.
    - Read endpoints (`GET /api/articles`, `GET /api/articles/{id}`, `GET /rss`)
      are public. REST write endpoints require Google OAuth2/OIDC Bearer tokens.
      First-party Vaadin UI writes are executed server-side and authenticated by session.
    - Write endpoints additionally require the token email to be present in
      database allowlist (`app_user` entity managed via API).
    - Roles: USER can write articles; ADMIN can manage allowlist users.
    - COZADZBAN_BOOTSTRAP_ADMIN_EMAIL is only required when no ADMIN exists
      in `app_user`; if ADMINs already exist the var is ignored.
    - If required and missing/empty/invalid, startup fails fast.
    - If required and valid, startup seeds one ADMIN row (or promotes USER).
    - All API timestamps are UTC.
    - Error responses use `application/problem+json` (RFC 9457 /
      Spring `ProblemDetail`).

  version: 0.49.0-SNAPSHOT
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080
    description: Local development

x-security-policy:
  provider: google-oidc
  issuer: https://accounts.google.com
  acceptedTokenType: access_token_jwt
  requiredClaims: [iss, aud, exp, sub, email, email_verified]
  requireEmailVerified: true
  acceptedAlgorithms: [RS256]
  requireHttpsIssuerAndJwks: true
  rejectUnsignedTokens: true
  clockSkewSeconds: 60
  denyByDefault: true
  audienceSource: spring.security.oauth2.resourceserver.jwt.audiences
  allowlist:
    enabled: true
    table: app_user
    roleColumn: role
    statusColumn: status
    activeStatus: ACTIVE
    emailNormalization: trim+lowercase
  machineToMachine:
    enabled: true
    headerName: X-CoZaDzban-M2M-Key
    apiKeyEnvVar: APP_MACHINE_AUTH_API_KEY
    principalEmailEnvVar: APP_MACHINE_AUTH_PRINCIPAL_EMAIL
    allowedForEndpoints:
      - POST /api/articles
      - PATCH /api/articles/{id}
  bootstrap:
    adminEmailEnvVar: COZADZBAN_BOOTSTRAP_ADMIN_EMAIL
    enforcedOnlyWhenNoAdminsExist: true
    failFastWhenRequiredButMissingOrEmpty: true
    failFastOnInvalidEmail: true
    seedAdminRow: true
    promoteExistingUserToAdmin: true
  cors:
    allowedOrigins: [https://cozadzban.pl]
    allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowedHeaders: [Authorization, Content-Type]
    preflightMaxAgeSeconds: 600
    allowCredentials: false
  csrf:
    disabledPaths: [/api/**, /rss]
    enabledForVaadinUi: true

x-runtime-configuration:
  analytics:
    googleAnalyticsMeasurementIdEnvVar: GOOGLE_ANALYTICS_MEASUREMENT_ID
    statCounterProjectIdEnvVar: STATCOUNTER_PROJECT_ID
    statCounterSecurityIdEnvVar: STATCOUNTER_SECURITY_ID
    renderOnlyWhenConfigured: true
    requiresUserConsent: true
  facebookImport:
    springBatchAutoRunProperty: spring.batch.job.enabled=false
    springBatchSchemaInitializationProperty: spring.batch.jdbc.initialize-schema=never
    scheduleEnabledEnvVar: APP_FACEBOOK_IMPORT_SCHEDULE_ENABLED
    scheduleEnabledDefault: false
    scheduleIntervalEnvVar: APP_FACEBOOK_IMPORT_SCHEDULE_INTERVAL
    scheduleIntervalDefault: 8h
    scheduleInitialDelayEnvVar: APP_FACEBOOK_IMPORT_SCHEDULE_INITIAL_DELAY
    scheduleInitialDelayDefault: 0s
    manualLoginTimeoutEnvVar: APP_FACEBOOK_IMPORT_MANUAL_LOGIN_TIMEOUT
    manualLoginTimeoutDefault: 3m
    schedulingSemantics: run on worker startup, then wait interval after each launch attempt; skip ticks while another import is active

x-problem-types:
  articleUrlConflict:
    uri: https://cozadzban.pl/problems/article-url-conflict
    status: 409
    title: Article URL Already Exists
  allowlistEmailConflict:
    uri: https://cozadzban.pl/problems/allowlist-email-conflict
    status: 409
    title: Allowlisted Email Already Exists
  lastAdminRequired:
    uri: https://cozadzban.pl/problems/last-admin-required
    status: 409
    title: Last Admin Required
  facebookImportBusy:
    uri: https://cozadzban.pl/problems/facebook-import-busy
    status: 409
    title: Facebook Import Already Running
  facebookImportNotRunning:
    uri: https://cozadzban.pl/problems/facebook-import-not-running
    status: 409
    title: No Active Facebook Import

tags:
  - name: Articles
    description: CRUD operations for Article resources
  - name: RSS
    description: RSS feed endpoints
  - name: Security
    description: Allowlist management endpoints
  - name: Authentication
    description: UI authentication and session endpoints
  - name: Facebook Import
    description: Manual Facebook post import job endpoints; scheduled worker launches use the same Batch job internally

paths:

  /api/articles:

    get:
      tags: [Articles]
      summary: List articles (paginated) or check whether a URL exists
      operationId: listArticles
      security: []
      parameters:
        - name: existsUrl
          in: query
          description: When present, returns only whether the canonicalized URL already exists.
          required: false
          schema:
            type: string
            format: uri
            maxLength: 2048
            pattern: '^https?://.+'
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of articles per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: >
            Sort expression: field,direction — e.g. createdAt,desc.
            Permitted fields: id, createdAt, publishedAt, language, title, url.
            Unknown field returns 400 Bad Request.
          schema:
            type: string
            enum:
              - id,asc
              - id,desc
              - createdAt,asc
              - createdAt,desc
              - publishedAt,asc
              - publishedAt,desc
              - language,asc
              - language,desc
              - title,asc
              - title,desc
              - url,asc
              - url,desc
            example: createdAt,desc
        - name: language
          in: query
          description: Normalized BCP-47-like language filter, e.g. pl or en-gb
          required: false
          schema:
            type: string
            maxLength: 20
            pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
            example: pl
        - name: publishedFrom
          in: query
          description: Inclusive lower bound for publishedAt
          required: false
          schema:
            type: string
            format: date-time
        - name: publishedTo
          in: query
          description: Inclusive upper bound for publishedAt
          required: false
          schema:
            type: string
            format: date-time
        - name: createdFrom
          in: query
          description: Inclusive lower bound for createdAt
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: Inclusive upper bound for createdAt
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated list of articles
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ArticlePage'
                  - $ref: '#/components/schemas/ArticleUrlExistsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Articles]
      summary: Create a new article
      operationId: createArticle
      security:
        - googleOidc: []
        - machineApiKey: []
      description: >
        Accepts a URL and a BCP-47 language tag.
        The server fetches the page at the given URL and automatically
        populates title, thumbnail, favicon, lead, and best-effort publishedAt before
        persisting. Creator is resolved from the authenticated DB user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
            example:
              url: https://example.com/some-article
              language: pl
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login:

    get:
      tags: [Authentication]
      summary: Start Google OAuth login
      operationId: startLogin
      security: []
      description: >
        Redirects browser to Google OpenID Connect authorization endpoint using
        Authorization Code flow. Callback is handled by Spring Security.
      responses:
        '302':
          description: Redirect to Google authorization endpoint

  /auth/me:

    get:
      tags: [Authentication]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      description: >
        Returns email, nullable role, and allowlist state of the currently
        authenticated user from server session. Authenticated users who are not
        active in the allowlist receive `allowlisted=false` and `role=null`.
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    example: user@example.com
                  role:
                    type: string
                    nullable: true
                    enum: [USER, ADMIN]
                    example: ADMIN
                  allowlisted:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:

    post:
      tags: [Authentication]
      summary: Clear authentication session
      operationId: logout
      security:
        - cookieAuth: []
      description: >
        Invalidates server session and clears session cookie.
        Returns 204 No Content.
      responses:
        '204':
          description: Logged out successfully; cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/facebook-import/run:

    post:
      tags: [Facebook Import]
      summary: Trigger the Facebook import job
      operationId: runFacebookImport
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: >
        Starts the Facebook import job if no other import is currently running.
        The request launches the same Spring Batch facebookImportJob used by the
        worker scheduler. The job reuses a long-lived Selenium browser session,
        opens the browser on demand, verifies Facebook login before scanning posts,
        and emits a login-required event if manual/two-factor login is needed.
        Returns 202 Accepted when the job is accepted. Discovery is non-blocking
        and submits non-duplicate candidates to the article proposal inbox; no
        same-session approval modal is shown.
      responses:
        '202':
          description: Facebook import job accepted for execution
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/facebook-import/terminate:

    post:
      tags: [Facebook Import]
      summary: Terminate the active Facebook import job
      operationId: terminateFacebookImport
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: >
        Interrupts the active Facebook import job if one is running. The Selenium
        browser window is intentionally kept alive so the next run can reuse the
        logged-in session. Returns 202 Accepted when termination is accepted.
      responses:
        '202':
          description: Facebook import job termination accepted
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/proposals/exists:

    get:
      tags: [Facebook Import]
      summary: Check whether an article URL already exists as an Article or proposal
      operationId: facebookProposalExists
      security:
        - machineApiKey: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
            pattern: '^https?://.+'
      responses:
        '200':
          description: Existing Article or proposal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookProposalExistsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/proposals:

    post:
      tags: [Facebook Import]
      summary: Submit discovered Facebook article proposals
      operationId: submitFacebookArticleProposals
      security:
        - machineApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookProposalBatchRequest'
      responses:
        '200':
          description: Proposal batch processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookProposalBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/runs/{importRunId}/complete:

    post:
      tags: [Facebook Import]
      summary: Mark a Facebook import run completed
      operationId: completeFacebookImportRun
      security:
        - machineApiKey: []
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookImportRunCompletionRequest'
      responses:
        '204':
          description: Import run completion recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/articles/{id}:

    parameters:
      - $ref: '#/components/parameters/ArticleId'

    get:
      tags: [Articles]
      summary: Get article by ID
      operationId: getArticle
      security: []
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Articles]
      summary: Replace article input fields
      operationId: replaceArticle
      security:
        - googleOidc: []
      description: >
        Replaces url, language and optional quote. The server re-fetches the
        target page to refresh title, thumbnail, lead, and best-effort
        publishedAt unless publishedAt is explicitly supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Article replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Articles]
      summary: Partially update an article
      operationId: patchArticle
      security:
        - googleOidc: []
        - machineApiKey: []
      description: >
        Updates only the provided fields. Updatable fields: url, language, quote, publishedAt,
        and internal preserved content.
        Setting quote to null explicitly clears it; omitting quote leaves it unchanged.
        Setting publishedAt to null explicitly clears it; omitting publishedAt leaves it unchanged unless url changes and no override is supplied.
        Setting content stores/replaces the preserved content cache; setting content to null or blank clears it.
        If url is changed the server re-fetches the page to refresh the enriched
        fields. Fully atomic — if enrichment fails the server responds with 422
        and the existing record is left unchanged.
        Null for url or language is invalid and returns 400.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ArticlePatch'
      responses:
        '200':
          description: Article updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Articles]
      summary: Delete an article
      operationId: deleteArticle
      security:
        - googleOidc: []
      responses:
        '204':
          description: Article deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rss:

    get:
      tags: [RSS]
      summary: RSS 2.0 feed
      operationId: getRssFeed
      security: []
      x-rss-channel:
        title: Co za dzban
        link: https://cozadzban.pl
        description: fucked up news
        language:
          default: en
          note: accepts normalized BCP-47-like tags
        generator: cozadzban.pl
        lastBuildDateSource: app.build.timestamp injected by Gradle as ISO-8601 UTC
        lastBuildDateFormat: RFC-822 UTC (converted by RSS controller from ISO-8601)
        lastBuildDateFallback: fail-fast when app.build.timestamp is missing or unparseable
      x-html-discovery:
        linkRelAlternate: '<link rel="alternate" type="application/rss+xml" title="Co za dzban RSS" href="/rss">'
        visibleUiLink: ArticleListView top bar includes an RSS icon/link to /rss
      description: >
        Returns an RSS 2.0 feed of articles ordered by creation date (newest first).
        Provide the `lang` query parameter to filter to a single BCP-47 language.
        RSS pubDate uses publishedAt when present and falls back to createdAt.
        RSS never exposes article creator/user data.
      parameters:
        - name: lang
          in: query
          description: >-
            BCP-47 language tag filter (e.g. en, pl, de).
            Must match the same normalized BCP-47-like validation used by articles.
          required: false
          schema:
            type: string
            pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
            example: pl
      responses:
        '200':
          description: RSS feed
          content:
            application/rss+xml:
              schema:
                type: string

  /rss/image/{id}:

    get:
      tags: [RSS]
      summary: Proxy an article thumbnail for RSS readers
      operationId: getRssImage
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thumbnail image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Thumbnail could not be fetched or was not an image

  /api/users:

    get:
      tags: [Security]
      summary: List allowlisted users
      operationId: listAppUsers
      x-required-role: ADMIN
      security:
        - googleOidc: []
      responses:
        '200':
          description: List of allowlisted users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Security]
      summary: Add user to allowlist
      operationId: addAppUser
      x-required-role: ADMIN
      security:
        - googleOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserInput'
      responses:
        '201':
          description: User added to allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}/status:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Allowed user identifier to update

    patch:
      tags: [Security]
      summary: Compatibility endpoint for updating user status
      operationId: updateAppUserStatus
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: Prefer PATCH /api/users/{id} with the status field for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserStatusPatch'
      responses:
        '200':
          description: User restored to ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '204':
          description: User marked DELETED
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Allowed user identifier to remove

    delete:
      tags: [Security]
      summary: Soft-delete user from allowlist
      operationId: removeAppUser
      x-required-role: ADMIN
      security:
        - googleOidc: []
      responses:
        '204':
          description: User marked DELETED and no longer allowed to authenticate or authorize writes
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Security]
      summary: Update allowlisted user role/status
      operationId: updateAppUserRole
      x-required-role: ADMIN
      security:
        - googleOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserRolePatch'
      responses:
        '200':
          description: Allowed user role/status updated (or unchanged if same values requested)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  securitySchemes:
    googleOidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration

    machineApiKey:
      type: apiKey
      in: header
      name: X-CoZaDzban-M2M-Key
      description: Machine credential used by the remote Facebook importer to submit proposals

    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-managed authenticated session cookie
  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      description: Unique article identifier
      schema:
        type: integer
        format: int64
        example: 42

  schemas:

    ArticleInput:
      type: object
      required: [url, language]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://.+'
          description: Full URL of the article page to fetch and store (http/https only). The server persists the canonicalized URL and removes tracking-only query parameters such as fbclid, utm_*, gclid, dclid, and msclkid before uniqueness checks.
          example: https://example.com/some-article
        language:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
          description: BCP-47 language tag identifying the article's language
          example: pl
        quote:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          description: Optional user-provided quote or comment about the article
          example: "This perfectly captures the absurdity."
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional manual source publication timestamp. If omitted on create, enrichment attempts to populate it.
          example: "2026-05-02T08:30:00Z"

    ArticleUrlExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          example: true

    FacebookProposalExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: True when the canonical URL already exists as an Article or proposal.
          example: false

    FacebookProposalSubmission:
      type: object
      required: [candidateId, articleUrl, language]
      properties:
        candidateId:
          type: string
          example: facebook-import-candidate-42
        articleUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://.+'
          example: https://example.com/story
        facebookPostUrl:
          type: string
          format: uri
          nullable: true
          example: https://www.facebook.com/source/posts/123
        language:
          type: string
          maxLength: 20
          pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
          description: Worker-guessed language; users may correct it before accepting.
          example: pl
        logs:
          type: string
          nullable: true
          description: Worker diagnostics stored server-side as compressed UTF-8 GZIP bytes.

    FacebookProposalBatchRequest:
      type: object
      required: [importRunId, passIndex, passCount, proposals]
      properties:
        importRunId:
          type: string
          example: facebook-import-20260524T100000Z-1
        passIndex:
          type: integer
          minimum: 1
          example: 1
        passCount:
          type: integer
          minimum: 1
          example: 4
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/FacebookProposalSubmission'
        logs:
          type: string
          nullable: true

    FacebookProposalBatchResponse:
      type: object
      required: [importRunId, submitted, skippedExisting]
      properties:
        importRunId:
          type: string
        submitted:
          type: integer
          example: 3
        skippedExisting:
          type: integer
          example: 1

    FacebookImportRunCompletionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [RUNNING, FINISHED, FAILED, TERMINATED]
          example: FINISHED
        discoveredCount:
          type: integer
          default: 0
        submittedCount:
          type: integer
          default: 0
        skippedExistingCount:
          type: integer
          default: 0
        failedCount:
          type: integer
          default: 0
        logs:
          type: string
          nullable: true

    ArticlePatch:
      type: object
      description: JSON Merge Patch document; omitted fields are left unchanged
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://.+'
          example: https://example.com/updated-article
        language:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
          description: BCP-47 language tag
          example: en
        quote:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          description: User-provided quote; null explicitly clears it; empty string is invalid
          example: "This perfectly captures the absurdity."
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Source publication timestamp; null explicitly clears it
          example: "2026-05-02T08:30:00Z"
        content:
          type: string
          nullable: true
          description: Internal preserved content cache value; null or blank clears cached content. Not exposed in article responses or RSS.

    Article:
      type: object
      description: >
        Article response. `createdBy` is included only for authenticated requests
        and omitted for anonymous/public responses and RSS.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        url:
          type: string
          format: uri
          example: https://example.com/some-article
        language:
          type: string
          description: BCP-47 language tag
          example: pl
        title:
          type: string
          description: Title fetched from the article page
          nullable: true
          example: "An Interesting Article"
        thumbnail:
          type: string
          format: uri
          description: Thumbnail URL fetched from the article page (og:image or similar)
          nullable: true
          example: https://example.com/images/thumb.jpg
        favicon:
          type: string
          description: Local cached favicon URL downloaded from source site icon metadata
          nullable: true
          example: /favicons/2f1a0c8d9e7b6a5c4d3e2f10987654321abcdeffedcba9876543210012345678.png
        lead:
          type: string
          description: Lead/excerpt fetched from the article page (og:description or similar)
          nullable: true
          example: "A short summary of the article content."
        quote:
          type: string
          description: User-provided quote or comment about the article
          nullable: true
          example: "This perfectly captures the absurdity."
        aiSummary:
          type: string
          description: AI-generated summary — future feature, null until implemented
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Source article publication timestamp, fetched from metadata or edited manually
          example: "2026-05-02T08:30:00Z"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-02T10:00:00Z"
        createdBy:
          $ref: '#/components/schemas/ArticleCreator'

    ArticleCreator:
      type: object
      readOnly: true
      description: Present only for authenticated article responses; never exposed in anonymous responses or RSS.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com

    AppUserInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Email to add to the write-operation allowlist (RFC 5321 max 254 chars)
          example: admin@cozadzban.pl
        role:
          type: string
          enum: [USER, ADMIN]
          minLength: 1
          description: Authorization role assigned to this user
          example: USER
        status:
          type: string
          enum: [ACTIVE, DELETED]
          description: Optional initial lifecycle status; defaults to ACTIVE
          example: ACTIVE

    AppUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        email:
          type: string
          format: email
          maxLength: 254
          example: admin@cozadzban.pl
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER
        status:
          type: string
          enum: [ACTIVE, DELETED]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-02T10:00:00Z"

    AppUserRolePatch:
      type: object
      minProperties: 1
      description: Role/status update payload for allowlisted user
      properties:
        role:
          type: string
          enum: [USER, ADMIN]
          minLength: 1
          description: New role to assign
          example: ADMIN
        status:
          type: string
          enum: [ACTIVE, DELETED]
          description: New lifecycle status to assign
          example: ACTIVE

    AppUserStatusPatch:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, DELETED]
          description: New lifecycle status to assign
          example: ACTIVE

    ArticlePage:
      type: object
      description: Frozen page response shape for Article
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        pageable:
          $ref: '#/components/schemas/Pageable'
        totalElements:
          type: integer
          format: int64
          example: 150
        totalPages:
          type: integer
          example: 8
        size:
          type: integer
          example: 20
        number:
          type: integer
          description: Current zero-based page number
          example: 0
        numberOfElements:
          type: integer
          example: 20
        sort:
          $ref: '#/components/schemas/Sort'
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        offset:
          type: integer
          format: int64
          example: 0
        paged:
          type: boolean
          example: true
        unpaged:
          type: boolean
          example: false
        sort:
          $ref: '#/components/schemas/Sort'

    Sort:
      type: object
      properties:
        sorted:
          type: boolean
          example: true
        unsorted:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false

    ProblemDetail:
      type: object
      description: RFC 9457 / Spring ProblemDetail error response
      required: [type, title, status, detail]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          example: https://example.com/problems/validation-error
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'url' must be a valid URI"
        instance:
          type: string
          format: uri
          example: /api/articles
        conflictField:
          type: string
          description: Optional field name that caused a conflict
          example: url
        existingId:
          type: integer
          format: int64
          description: Optional existing resource identifier for conflict cases
          example: 42
        remainingAdmins:
          type: integer
          description: Optional count of admins that would remain after operation
          example: 0

  responses:

    BadRequest:
      description: Request payload is invalid or malformed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: Conflict with business rules
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            articleUrlConflict:
              summary: Duplicate article URL
              value:
                type: https://cozadzban.pl/problems/article-url-conflict
                title: Article URL Already Exists
                status: 409
                detail: "Article with this URL already exists (canonicalized: <url>)."
                instance: /api/articles
                conflictField: url
                existingId: 42
            allowlistEmailConflict:
              summary: Duplicate allowlist email
              value:
                type: https://cozadzban.pl/problems/allowlist-email-conflict
                title: Allowlisted Email Already Exists
                status: 409
                detail: User with this email is already allowlisted.
                instance: /api/users
                conflictField: email
                existingId: 7
            lastAdminRequired:
              summary: Attempt to remove final admin
              value:
                type: https://cozadzban.pl/problems/last-admin-required
                title: Last Admin Required
                status: 409
                detail: Operation would leave the system without an ADMIN user.
                instance: /api/users/1
                remainingAdmins: 0
            facebookImportBusy:
              summary: Facebook import already running
              value:
                type: https://cozadzban.pl/problems/facebook-import-busy
                title: Facebook Import Already Running
                status: 409
                detail: Facebook import is already running.
                instance: /api/admin/facebook-import/run
            facebookImportNotRunning:
              summary: No Facebook import to terminate
              value:
                type: https://cozadzban.pl/problems/facebook-import-not-running
                title: No Active Facebook Import
                status: 409
                detail: No Facebook import job is currently running.
                instance: /api/admin/facebook-import/terminate

    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: Authenticated but not allowed to perform this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnprocessableEntity:
      description: The URL could not be fetched or its content could not be parsed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
