        - Filters for article ID, article URL, publishedAt range, and createdAt range
        - View dialog for preserved content with refresh-from-source, edit, save, and purge actions
        - Navigation back to user management and the public feed
    - name: FacebookArticleProposalView
      route: /article-proposals
      description: >
        Proposal inbox for ACTIVE logged-in users to review Facebook import candidates.
      features:
        - Grid sorted by submittedAt descending
        - Default pending-only status filter plus all/accepted/rejected/failed filters
        - Article URL and Facebook post URL render as external links opening in a new tab
