        - Device suggestions are loaded from Pushover user validation response devices
        - ACTIVE USER and ADMIN accounts can separately toggle proposal review and auto-approval notifications
        - ACTIVE ADMIN accounts can additionally toggle scheduled Facebook login-required notifications
        - Send test notification button
# ──────────────────────────────────────────────────────────────
# API SPEC  (standard OpenAPI)
# ──────────────────────────────────────────────────────────────
info:
  title: CoZaDzban API
  description: |
    ## Overview
    CoZaDzban is a link-collecting application. Users submit a URL and a language
    tag; the server fetches the target page and automatically enriches the record
    with title, thumbnail, favicon, lead, and best-effort publication date before persisting it.

    ## Components
    1. **REST API** — CRUD endpoints for `Article` resources (this spec).
    2. **PostgreSQL database** — all data persisted via Spring Data JDBC.
    3. **Flyway migrations** — all schema changes are managed as versioned SQL
       migration scripts located in `src/main/resources/db/migration/`.
       No DDL is generated or executed outside of Flyway.
    4. **RSS feed** — `GET /rss` exposes articles as an RSS 2.0 feed;
       filterable per language with `?lang=<BCP-47>`.
    5. **Vaadin UI** — server-side lazy feed of articles (separate from
       this REST spec; rendered at the root path `/`).

    6. **Frontend authentication** — Vaadin UI starts OAuth Authorization Code
       via backend redirect (`GET /auth/login`) and uses server-side session cookie.
    7. **Admin pages** — Vaadin UI at `/admin` for ADMIN users to manage allowlist
       (add/soft-delete/restore/update users) and at `/admin/article-content-cache`
       to inspect, refresh, edit, and purge preserved article content cache entries,
       using server-side service calls.
    8. **Facebook import job** — Spring Batch can run the Selenium profile importer
       and the paid Apify external retrieval importer. Startup sequencing runs Apify
       before Selenium when both are enabled. Apify uses the synchronous actor run
       endpoint, has scheduling separate from Selenium scheduling, and checks persisted
       APIFY run timestamps so paid runs can be limited to a daily cadence across restarts.
       Import runs submit proposal candidates for later review instead of creating
       articles directly.
    9. **Article proposal inbox** — ACTIVE logged-in users review Facebook import
       proposals at `/article-proposals`, correct language, and accept/reject.
       Canonical proposal URLs are unique. Apify submissions are processed
       synchronously: new Apify proposals are auto-accepted immediately, and
       matching pending Selenium proposals are refreshed with Apify metadata and
       auto-accepted in place.
    10. **Machine-to-machine writes** — the Facebook importer submits proposals,
       login-required reports, and run completion events using a dedicated API key
       tied to an allowlisted bot user.
    11. **Notifications** — ACTIVE users can configure Pushover delivery in the
       server-side UI. Proposal review and auto-approval summaries use separate opt-in preferences for ACTIVE users; scheduled
       Facebook login/2FA alerts are sent only to opted-in ACTIVE ADMIN users,
       excluding the worker-startup import.
    ## Implementation notes
    - Language is normalized to lowercase and validated against a conservative
      BCP-47-like pattern (e.g. `pl`, `en`, `en-gb`).
    - `title`, `thumbnail`, `favicon`, `lead`, and best-effort `publishedAt` are
      server-fetched; clients supply `url`, `language`, optional `quote`, and
      optional `publishedAt` on create/replace. Enrichment is
      atomic — 422 on failure means no DB write occurs and existing records are unchanged.
    - Each article stores an immutable creator FK. Creator data is omitted from
      anonymous article responses and RSS; authenticated article responses may
      include `createdBy`.
    - `aiSummary` is reserved for a future AI enrichment step. Null article fields,
      including `aiSummary`, are omitted from JSON responses.
    - Read endpoints (`GET /api/articles`, `GET /api/articles/{id}`, `GET /rss`)
      are public. REST writes require Google OAuth2/OIDC Bearer tokens; article
      POST and PATCH also accept the configured machine API key for an ACTIVE bot user.
      First-party Vaadin UI writes are executed server-side and authenticated by session.
    - Write endpoints additionally require the token email to be present in
      database allowlist (`app_user` entity managed via API).
    - Roles: USER can write articles; ADMIN can manage allowlist users.
    - COZADZBAN_BOOTSTRAP_ADMIN_EMAIL is only required when no ADMIN exists
      in `app_user`; if ADMINs already exist the var is ignored.
    - If required and missing/empty/invalid, startup fails fast.
    - If required and valid, startup seeds one ADMIN row (or promotes USER).
    - Google login may establish a session for a non-allowlisted or deleted user;
      `/auth/me` reports `role: null` and `allowlisted: false`. Privileged actions
      require an ACTIVE allowlist entry.
    - All API timestamps are UTC.
    - Error responses use `application/problem+json` (RFC 9457 /
      Spring `ProblemDetail`).

  version: 0.62.30-SNAPSHOT
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080
    description: Local development

x-security-policy:
  provider: google-oidc
  issuer: https://accounts.google.com
  acceptedTokenType: signed_google_jwt
  requiredClaims: [iss, aud, exp, sub, email, email_verified]
  requireEmailVerified: true
  acceptedAlgorithms: [RS256]
  requireHttpsIssuerAndJwks: true
  rejectUnsignedTokens: true
  clockSkewSeconds: 60
  denyByDefault: true
  audienceSource: spring.security.oauth2.resourceserver.jwt.audiences
  allowlist:
    enabled: true
    table: app_user
    roleColumn: role
    statusColumn: status
    activeStatus: ACTIVE
    emailNormalization: trim+lowercase
  machineToMachine:
    enabled: true
    headerName: X-CoZaDzban-M2M-Key
    apiKeyEnvVar: APP_MACHINE_AUTH_API_KEY
    principalEmailEnvVar: APP_MACHINE_AUTH_PRINCIPAL_EMAIL
    allowedForEndpoints:
      - POST /api/articles
      - PATCH /api/articles/{id}
      - /api/facebook-import/**
  browserAdminImportAlias:
    basePath: /admin/facebook-import
    mirrors: /api/admin/facebook-import
    authentication: ACTIVE ADMIN server-side session
    csrf: enabled for POST requests
  uiSessionRoleRefresh:
    currentBehavior: >
      Roles are mapped at Google login. Before dispatching subsequent requests,
      UiSessionAuthorizationFilter rechecks sessions carrying USER or ADMIN
      privileges against the current database role and ACTIVE status.
    revocation: >
      A changed role, soft-deleted user, missing allowlist row or missing email
      invalidates the privileged session and rejects that request with HTTP 401
      before Vaadin navigation, UIDL events or other application handlers execute.
      A fresh Google login is required to obtain the current permissions.
      Requests already executing when a role/status change commits may complete.
    scope: >
      Applies to all privileged Google UI sessions, including already-open admin
      views, dialogs and shared import controls on the feed. Anonymous requests,
      unprivileged Google sessions, and API bearer/machine credentials retain
      their existing authorization behavior. UI requests also validate the
      attached OAuth session when a bearer header replaces request authentication.
  bootstrap:
    adminEmailEnvVar: COZADZBAN_BOOTSTRAP_ADMIN_EMAIL
    enforcedOnlyWhenNoAdminsExist: true
    failFastWhenRequiredButMissingOrEmpty: true
    failFastOnInvalidEmail: true
    seedAdminRow: true
    promoteExistingUserToAdmin: true
  cors:
    allowedOrigins: [https://cozadzban.pl]
    allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowedHeaders: [Authorization, Content-Type]
    preflightMaxAgeSeconds: 600
    allowCredentials: false
  csrf:
    disabledPaths: [/api/**, /rss]
    enabledForVaadinUi: true

x-runtime-configuration:
  analytics:
    googleAnalyticsMeasurementIdEnvVar: GOOGLE_ANALYTICS_MEASUREMENT_ID
    googleAnalyticsApiSecretEnvVar: GOOGLE_ANALYTICS_API_SECRET
    statCounterProjectIdEnvVar: STATCOUNTER_PROJECT_ID
    statCounterSecurityIdEnvVar: STATCOUNTER_SECURITY_ID
    renderOnlyWhenConfigured: true
    requiresUserConsent: true
  notifications:
    enabledEnvVar: APP_NOTIFICATIONS_ENABLED
    pushoverAppTokenEnvVar: APP_NOTIFICATIONS_PUSHOVER_APP_TOKEN
    encryptionKeyEnvVar: APP_NOTIFICATIONS_ENCRYPTION_KEY
    pushoverBaseUrlEnvVar: APP_NOTIFICATIONS_PUSHOVER_BASE_URL
    pushoverDeviceSemantics: zero selected devices means all active devices; multiple selected devices are sent as comma-separated Pushover device targets
    pushoverDeviceDiscovery: device suggestions are read from the Pushover user validation response devices array
    deliverySemantics: best-effort; failures are logged and do not block imports
  facebookImport:
    springBatchAutoRunProperty: spring.batch.job.enabled=false
    springBatchSchemaInitializationProperty: spring.batch.jdbc.initialize-schema=never
    markerPhraseEnvVar: APP_FACEBOOK_IMPORT_MARKER_PHRASE
    markerPhraseDefault: co za dzban
    translatedMarkerPhraseEnvVar: APP_FACEBOOK_IMPORT_TRANSLATED_MARKER_PHRASE
    translatedMarkerPhraseDefault: what a pitcher
    scheduleEnabledEnvVar: APP_FACEBOOK_IMPORT_SCHEDULE_ENABLED
    scheduleEnabledDefault: false
    scheduleRunOnStartupEnvVar: APP_FACEBOOK_IMPORT_SCHEDULE_RUN_ON_STARTUP
    scheduleRunOnStartupDefault: false
    scheduleIntervalEnvVar: APP_FACEBOOK_IMPORT_SCHEDULE_INTERVAL
    scheduleIntervalDefault: 8h
    scheduleInitialDelayEnvVar: APP_FACEBOOK_IMPORT_SCHEDULE_INITIAL_DELAY
    scheduleInitialDelayDefault: 0s
    sharedEnvVars:
      - APP_FACEBOOK_IMPORT_SCHEDULE_ENABLED
      - APP_FACEBOOK_IMPORT_SCHEDULE_RUN_ON_STARTUP
      - APP_FACEBOOK_IMPORT_SCHEDULE_INTERVAL
      - APP_FACEBOOK_IMPORT_SCHEDULE_INITIAL_DELAY
      - APP_FACEBOOK_IMPORT_RUN_TIMEOUT
      - APP_FACEBOOK_IMPORT_TARGET_API_BASE_URL
      - APP_FACEBOOK_IMPORT_TARGET_API_KEY
      - APP_FACEBOOK_IMPORT_TARGET_API_KEY_HEADER
      - APP_FACEBOOK_IMPORT_TARGET_PROPOSAL_PATH
      - APP_FACEBOOK_IMPORT_TARGET_PROPOSAL_EXISTS_PATH
      - APP_FACEBOOK_IMPORT_TARGET_RUN_PATH
      - APP_FACEBOOK_IMPORT_TARGET_API_CONNECT_TIMEOUT
      - APP_FACEBOOK_IMPORT_TARGET_API_READ_TIMEOUT
      - APP_FACEBOOK_IMPORT_REJECTION_ARTIFACT_DIR
    seleniumEnvVars:
      - APP_FACEBOOK_IMPORT_SELENIUM_ENABLED
      - APP_FACEBOOK_IMPORT_SELENIUM_PROFILE_URL
      - APP_FACEBOOK_IMPORT_SELENIUM_USERNAME
      - APP_FACEBOOK_IMPORT_SELENIUM_PASSWORD
      - APP_FACEBOOK_IMPORT_SELENIUM_BROWSER
      - APP_FACEBOOK_IMPORT_SELENIUM_HEADLESS
      - APP_FACEBOOK_IMPORT_SELENIUM_REUSE_BROWSER_ACROSS_RESTARTS
      - APP_FACEBOOK_IMPORT_SELENIUM_DRIVER_SESSION_FILE
      - APP_FACEBOOK_IMPORT_SELENIUM_SCROLLS
      - APP_FACEBOOK_IMPORT_SELENIUM_WAIT_AFTER_LOGIN
      - APP_FACEBOOK_IMPORT_SELENIUM_WAIT_AFTER_PAGE_OPEN
      - APP_FACEBOOK_IMPORT_SELENIUM_WAIT_AFTER_SCROLL
      - APP_FACEBOOK_IMPORT_SELENIUM_MANUAL_LOGIN_TIMEOUT
    apifyEnvVars:
      - APP_FACEBOOK_IMPORT_APIFY_ENABLED
      - APP_FACEBOOK_IMPORT_APIFY_API_TOKEN
      - APP_FACEBOOK_IMPORT_APIFY_BASE_URL
      - APP_FACEBOOK_IMPORT_APIFY_ACTOR_ID
      - APP_FACEBOOK_IMPORT_APIFY_PROFILE_URL
      - APP_FACEBOOK_IMPORT_APIFY_ONLY_POSTS_NEWER_THAN
      - APP_FACEBOOK_IMPORT_APIFY_RESULTS_LIMIT
      - APP_FACEBOOK_IMPORT_APIFY_CAPTION_TEXT
      - APP_FACEBOOK_IMPORT_APIFY_MAX_COST_USD
      - APP_FACEBOOK_IMPORT_APIFY_SCHEDULE_ENABLED
      - APP_FACEBOOK_IMPORT_APIFY_SCHEDULE_INTERVAL
      - APP_FACEBOOK_IMPORT_APIFY_COST_SUMMARY_DAYS
      - APP_FACEBOOK_IMPORT_APIFY_LOW_CREDIT_ALERTS_ENABLED
      - APP_FACEBOOK_IMPORT_APIFY_CONNECT_TIMEOUT
      - APP_FACEBOOK_IMPORT_APIFY_READ_TIMEOUT
    schedulingSemantics: enabled import types run sequentially

# Phases 1-4 are implemented. The full test suite for phases 3-4 remains
# pending on a development machine; do not run it on the deployment server.
x-planned-features:
  frontPageCache:
    status: planned_not_implemented
    plan: doc/FRONT_PAGE_CACHE_PLAN.md
    summary: >
      Per-container cache of the signed-out front page (no filter, ?lang=pl and
      ?lang=en) and the matching story pages, invalidated and rebuilt on every
      article change and daily, with an ADMIN menu action that shows rebuild
      progress. Deferred because measurement showed front-page queries take
      under 2 ms; generated image size was the first-load cost and was fixed first.
  articleImageGeneration:
    status: experimental_implemented
    plan: doc/ARTICLE_IMAGE_GENERATION_PLAN.md
    websiteCopy: >
      The PNG original is kept for Facebook and og:image. The feed and story pages
      show a JPEG copy (quality 0.82, about ten times smaller) through
      /generated-images/{id}.jpg?v=<version>. The URL is cacheable for a year, and
      the copy is rebuilt whenever the PNG changes.
    codexCliRuntime: >
      Installed in the Spring Boot Docker image for operator device-code login
      and feasibility work. A named Docker volume persists CODEX_HOME across
      container replacement. The opt-in Codex image generator already invokes
      the CLI for missing or rejected source thumbnails; production provider
      authorization and usage controls remain undecided.
    codexAuthMonitoring: >
      A daily host cron checks the cached ChatGPT login and makes one bounded
      live Codex request from an isolated one-off container. The check uses
      only the auth volume and egress network, logs its result, and reports
      failure through the configured cron mail when available.
    firstUseCase: >
      Generate a labeled editorial illustration for an article with no usable
      source thumbnail before its Facebook Page photo post. Keep the source
      thumbnail as first choice and the branded placeholder as fallback.
    productionProvider: OpenAI Image API with server-side API key
    authentication: >
      ADMIN-only key connection with encrypted server-side storage. Do not use
      Codex app-server ChatGPT login for this hosted service. A containerized
      Codex CLI/device-code proof of concept is operator-only until an approved
      hosted OAuth route supports image generation.
    delivery: >
      The durable job, validated local asset, ADMIN status and manual trigger,
      and Facebook publication fallback are implemented experimentally.
      Provider connection and usage caps remain planned.
  facebookPagePublishing:
    status: implemented_pending_full_tests
    scope: Facebook Pages managed by this application, never personal profiles
    implementationPhases:
      - phase: 1
        name: Page connection and persistence foundation
        status: implemented
        work: >
          Add Flyway migrations and Spring Data JDBC models for per-language
          Page configuration, encrypted Page credentials, publication jobs,
          Meta post identity, reaction snapshots, and link-comment outcomes.
          Add an ADMIN-only settings view and server-side Meta authorization
          flow using a Facebook Login for Business configuration ID rather than
          a scope query parameter. Keep publishing disabled until an ADMIN connects and enables a
          Page. Do not backfill existing articles automatically.
        completion: >
          An ADMIN can connect, inspect, configure, disconnect, and reconnect
          each language's Page. Tokens remain server-side and are encrypted at
          rest. Schema, authorization, and settings behavior pass the test suite.
      - phase: 2
        name: Automatic image posts and article links
        status: implemented
        work: >
          Create a durable publication job for each new article, publish an
          image post without a URL after commit, use a branded placeholder if
          the thumbnail is absent or unusable, and show the successful Meta
          post link in the article view. Record failures and support safe
          reconciliation of ambiguous publish results.
        completion: >
          A new article in a configured language produces at most one Page
          post; failures leave the article intact and visible to admins.
          The article view links to the published Facebook post. Tests cover
          UI, REST, and import-created articles and image fallback.
      - phase: 3
        name: Engagement, link selection, and synchronization
        status: implemented
        verification: >
          Compilation and read-only SQL query plans were checked on the deployment
          server. Full tests and Flyway runtime validation remain pending on a
          development machine because tests must not run on this server.
        work: >
          Schedule reaction-count collection, apply the configurable minimum
          age and per-Page monthly link budget, add selected story links as
          Page comments, and store attempts, confirmed success, and failures.
          Queue and process article edit and deletion synchronization with
          durable status and safe retry handling.
        completion: >
          The scheduler respects the five-link default and Page time zone,
          never double-counts or blindly duplicates comments, and records
          Meta reaction and synchronization outcomes. Tests cover concurrent
          budget claims, failed Graph calls, edits, and deletions.
      - phase: 4
        name: Story views and ranking refinement
        status: implemented_pending_full_tests
        verification: >
          Production and test sources compiled on the deployment server.
          Deployed Flyway V37 applied and read-only article and Page report
          queries returned data. The full test suite remains pending on a
          development machine because tests must not run on this server.
        work: >
          Count story-page views with bot filtering, expose useful article and
          Page publication statistics to admins, and keep view counts
          available to future link-selection rules. Retain reaction count as
          the initial ranking signal until a different rule is chosen.
        completion: >
          Admins can compare story views with Facebook reactions without
          exposing visitor or creator data publicly. View counting and
          reporting pass the test suite.
    pageConfiguration:
      access: ADMIN-only Vaadin settings view
      mapping: one enabled Facebook Page per normalized article language
      fields: [language, pageId, enabled, timeZone, monthlyLinkLimit, minimumPostAge, schedulerInterval]
      defaults:
        timeZone: Europe/Warsaw
        monthlyLinkLimit: 5
        minimumPostAge: 24h
      missingLanguagePage: retain the article and show an unpublished configuration status to admins
      authorization: >
        An ADMIN connects each Page through a server-side Meta authorization-code
        flow. The server exchanges the code, obtains the Page access token and
        stores it encrypted at rest. OAuth state and Page identity are verified.
        Browser JavaScript never receives Meta access or ID tokens. The
        application requests only the Page publishing, engagement and reading
        permissions needed by the implemented Graph API calls.
    articleCreation:
      trigger: every newly persisted Article, including UI, REST API and import-created articles
      delivery: >
        Create a durable publication job in the article transaction. Publish
        asynchronously after commit so Meta failures cannot roll back article
        creation. Keep the article ID, language, Page ID, publishing state,
        Meta post ID and permalink, timestamps, attempt count and sanitized
        error details. Use a uniqueness constraint to prevent duplicate jobs.
        Reconcile ambiguous Graph API timeouts before retrying to avoid
        duplicate public posts.
      format: image post with title and short lead or summary in the article language, without any external URL
      image: >
        Use the article thumbnail when available and usable. If absent or
        unusable, render a branded local placeholder image. Keep image
        selection and generation behind a replaceable component so a future
        service can generate an image from article text. Document this
        replacement point in that component's code when implemented.
      thumbnailRightsReview: >
        Republishing source-site thumbnails on Facebook may require rights
        review. The initial implementation uses article thumbnails as
        requested; revisit the source-image permission policy before
        expanding publication to additional Pages or sources.
    articleChanges:
      status: implemented
      update: >
        Queue synchronization after an article edit and track the result.
        The scheduler updates the Facebook post where the Graph API permits.
        If an image cannot be changed in place, record that replacement is
        required and preserve the existing post association until resolved.
      delete: >
        Persist a deletion job containing the Meta post ID before deleting the
        article, then let the scheduler remove the Facebook post and record
        success or failure. Do not lose a pending deletion job when the article
        row is removed.
    publicArticleView:
      presentation: >
        Show the same source favicon and source name as the main article list,
        with a back link to the previous same-site page or the article list.
        Serve the thumbnail through the existing image endpoint so browser
        image rendering and social previews do not depend on source hotlinking.
      facebookPostLink: >
        When a post is published, show a link to that Facebook post in the
        article view as a place for readers to comment.
      theme: >
        The server-rendered story page uses the saved Co za dzban light or dark
        setting, falling back to the system color preference.
      viewCount: >
        Record qualifying GET browser HTML navigations as per-article daily
        UTC aggregates, separately from Facebook engagement snapshots. Exclude
        known bots, link previews, and non-navigation requests by request
        headers; no IP address, visitor ID, user agent, or creator data is
        persisted in the view table. Counts are page loads, not unique visitors.
    engagement:
      status: implemented
      collection: scheduled Graph API reads of each published post's reaction count
      persistence: store the reaction count, measurement time and API error state per post
      firstLinkSelectionRule: >
        After the configurable minimum post age (initially 24 hours), rank
        eligible posts on each Page by the latest reaction count. On each
        scheduler run, choose the highest-ranked posts while that Page has
        unused link slots for the current calendar month. Keep the selection
        policy separate from publishing so later rules can use article views
        or other statistics.
    linkComments:
      status: implemented
      target: the canonical /stories/{articleId} URL of the published article
      budget: >
        Initial configurable cap of five successful external-link comments
        per Page per calendar month in that Page's configured time zone.
        Persist all timestamps in UTC. Reserve slots for in-flight attempts so
        concurrent workers cannot overspend. The cap is an application policy,
        not a claim about Meta's effective Page limit; Meta may reject a link
        sooner or count comments against its own quota.
      persistence: >
        Store whether a link comment was selected, attempted, confirmed
        successful, or failed; the Page, article, Meta post and comment IDs;
        attempted and confirmed timestamps; and sanitized error details.
        A link counts against the application's monthly budget only after
        confirmed success. Reconcile ambiguous timeouts before retrying so
        the scheduler does not create duplicate comments.
      backfill: no automatic posting of existing articles; a separate ADMIN action is required

x-problem-types:
  articleUrlConflict:
    uri: https://cozadzban.pl/problems/article-url-conflict
    status: 409
    title: Article URL Already Exists
  allowlistEmailConflict:
    uri: https://cozadzban.pl/problems/allowlist-email-conflict
    status: 409
    title: Allowlisted Email Already Exists
  lastAdminRequired:
    uri: https://cozadzban.pl/problems/last-admin-required
    status: 409
    title: Last Admin Required
  facebookImportBusy:
    uri: https://cozadzban.pl/problems/facebook-import-busy
    status: 409
    title: Facebook Import Already Running
  facebookImportNotRunning:
    uri: https://cozadzban.pl/problems/facebook-import-not-running
    status: 409
    title: No Active Facebook Import

tags:
  - name: Articles
    description: CRUD operations for Article resources
  - name: RSS
    description: RSS feed endpoints
  - name: Security
    description: Allowlist management endpoints
  - name: Authentication
    description: UI authentication and session endpoints
  - name: Facebook Import
    description: Manual Facebook post import job endpoints; scheduled worker launches use the same Batch job internally

paths:

  /stories/{id}:
    get:
      tags: [Articles]
      summary: Read a public server-rendered story page
      description: Includes source icon and name, a back link, available Facebook post link, and Open Graph metadata; never includes creator data or preserved article content.
      operationId: getStoryPage
      security: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Public story HTML
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Article does not exist

  /sitemap.xml:
    get:
      tags: [Articles]
      summary: List public site and story URLs for crawlers
      operationId: getStorySitemap
      security: []
      responses:
        '200':
          description: Sitemap XML listing public pages and stories with an XSLT view for browsers; lastmod is omitted because article edits are not timestamped
          content:
            application/xml:
              schema:
                type: string

  /favicons/{filename}:
    get:
      tags: [Articles]
      summary: Read a cached source favicon
      operationId: getCachedFavicon
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}\.(png|jpg|gif|webp|ico|svg)$'
      responses:
        '200':
          description: Cached image with public 30-day Cache-Control
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid filename or missing cached image

  /flags/{filename}:
    get:
      tags: [Articles]
      summary: Read a cached language flag
      operationId: getCachedLanguageFlag
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z]{2}\.svg$'
      responses:
        '200':
          description: Cached flag with public 30-day Cache-Control
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid filename or missing cached flag

  /facebook-pages/oauth/start:
    get:
      tags: [Authentication]
      summary: Start server-side Facebook Page authorization
      description: Requires an ACTIVE ADMIN Google OAuth login session and configured Meta credentials. Stores OAuth state and normalized language in the session; tokens stay server-side.
      operationId: startFacebookPageAuthorization
      security:
        - cookieAuth: []
      parameters:
        - name: language
          in: query
          required: true
          schema:
            type: string
            maxLength: 20
            pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
      responses:
        '302':
          description: Redirect to Meta authorization
        '400':
          $ref: '#/components/responses/BadRequest'

  /facebook-pages/oauth/callback:
    get:
      tags: [Authentication]
      summary: Complete server-side Facebook Page authorization
      description: Requires the same ACTIVE ADMIN Google OAuth login session. Validates one-time state and a 10-minute expiry, exchanges the code server-side, and stores eligible Pages in the session for selection. Failures redirect with a session message.
      operationId: completeFacebookPageAuthorization
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to /admin/facebook-pages

  /api/articles:

    get:
      tags: [Articles]
      summary: List articles (paginated) or check whether a URL exists
      operationId: listArticles
      security: []
      parameters:
        - name: existsUrl
          in: query
          description: When present, returns only whether the canonicalized URL already exists.
          required: false
          schema:
            type: string
            format: uri
            maxLength: 2048
            pattern: '^https?://.+'
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of articles per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: >
            Sort expression: field,direction — e.g. createdAt,desc.
            Permitted fields: id, createdAt, publishedAt, language, title, url.
            Unknown field returns 400 Bad Request.
          schema:
            type: string
            enum:
              - id,asc
              - id,desc
              - createdAt,asc
              - createdAt,desc
              - publishedAt,asc
              - publishedAt,desc
              - language,asc
              - language,desc
              - title,asc
              - title,desc
              - url,asc
              - url,desc
            example: createdAt,desc
        - name: language
          in: query
          description: Normalized BCP-47-like language filter, e.g. pl or en-gb
          required: false
          schema:
            type: string
            maxLength: 20
            pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
            example: pl
        - name: publishedFrom
          in: query
          description: Inclusive lower bound for publishedAt
          required: false
          schema:
            type: string
            format: date-time
        - name: publishedTo
          in: query
          description: Inclusive upper bound for publishedAt
          required: false
          schema:
            type: string
            format: date-time
        - name: createdFrom
          in: query
          description: Inclusive lower bound for createdAt
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: Inclusive upper bound for createdAt
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated list of articles
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ArticlePage'
                  - $ref: '#/components/schemas/ArticleUrlExistsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Articles]
      summary: Create a new article
      operationId: createArticle
      security:
        - googleOidc: []
        - machineApiKey: []
      description: >
        Accepts a URL and a BCP-47 language tag.
        The server fetches the page at the given URL and automatically
        populates title, thumbnail, favicon, lead, and best-effort publishedAt before
        persisting. Creator is resolved from the authenticated DB user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
            example:
              url: https://example.com/some-article
              language: pl
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login:

    get:
      tags: [Authentication]
      summary: Start Google OAuth login
      operationId: startLogin
      security: []
      description: >
        Redirects browser to Google OpenID Connect authorization endpoint using
        Authorization Code flow. Callback is handled by Spring Security.
      responses:
        '302':
          description: Redirect to Google authorization endpoint

  /auth/me:

    get:
      tags: [Authentication]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      description: >
        Returns email, nullable role, and allowlist state of the currently
        authenticated user from server session. Authenticated users who are not
        active in the allowlist receive `allowlisted=false` and `role=null`.
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    example: user@example.com
                  role:
                    type: string
                    nullable: true
                    enum: [USER, ADMIN]
                    example: ADMIN
                  allowlisted:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:

    post:
      tags: [Authentication]
      summary: Clear authentication session
      operationId: logout
      security:
        - cookieAuth: []
      description: >
        Invalidates server session and clears session cookie. Requires a valid
        Spring CSRF token in all profiles; cookies alone are insufficient.
        Returns 204 No Content.
      responses:
        '204':
          description: Logged out successfully; cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/facebook-import/run:

    post:
      tags: [Facebook Import]
      summary: Trigger the Selenium Facebook import job compatibility endpoint
      operationId: runFacebookImport
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: >
        Backward-compatible alias for POST /api/admin/facebook-import/run/selenium.
        Starts the Selenium import only if Selenium import is available.
      responses:
        '202':
          description: Facebook import job accepted for execution
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/facebook-import/run/selenium:

    post:
      tags: [Facebook Import]
      summary: Trigger the Selenium Facebook import job
      operationId: runFacebookSeleniumImport
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: >
        Starts the Selenium import if no import is currently running. The job reuses
        a long-lived browser session, verifies Facebook login, and submits proposal
        candidates and browser diagnostics to the shared proposal inbox.
      responses:
        '202':
          description: Selenium Facebook import accepted for execution
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/facebook-import/run/apify:

    post:
      tags: [Facebook Import]
      summary: Trigger the Apify Facebook import job
      operationId: runFacebookApifyImport
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: >
        Starts the paid Apify import if no import is currently running. The job uses
        configured post age, result-limit, and max-cost guards before submitting
        proposal candidates to the shared proposal inbox.
      responses:
        '202':
          description: Apify Facebook import accepted for execution
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/facebook-import/terminate:

    post:
      tags: [Facebook Import]
      summary: Terminate the active Facebook import job
      operationId: terminateFacebookImport
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: >
        Interrupts the active Facebook import job if one is running. The Selenium
        browser window is intentionally kept alive so the next run can reuse the
        logged-in session. Returns 202 Accepted when termination is accepted.
      responses:
        '202':
          description: Facebook import job termination accepted
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/facebook-import/progress:

    get:
      tags: [Facebook Import]
      summary: Get the current Facebook import progress
      operationId: getFacebookImportProgress
      x-required-role: ADMIN
      security:
        - googleOidc: []
      responses:
        '200':
          description: Active or latest persisted import progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookImportProgressSnapshot'
        '204':
          description: No import progress is available
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/proposals/exists:

    get:
      tags: [Facebook Import]
      summary: Check whether an article URL already exists as an Article or proposal
      operationId: facebookProposalExists
      security:
        - machineApiKey: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
            pattern: '^https?://.+'
      responses:
        '200':
          description: Existing Article or proposal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookProposalExistsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/proposals:

    post:
      tags: [Facebook Import]
      summary: Submit discovered Facebook article proposals
      operationId: submitFacebookArticleProposals
      security:
        - machineApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookProposalBatchRequest'
      responses:
        '200':
          description: Proposal batch processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookProposalBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/runs/{importRunId}/complete:

    post:
      tags: [Facebook Import]
      summary: Mark a Facebook import run completed
      operationId: completeFacebookImportRun
      security:
        - machineApiKey: []
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookImportRunCompletionRequest'
      responses:
        '204':
          description: Import run completion recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/runs/{importRunId}/progress:

    post:
      tags: [Facebook Import]
      summary: Record Facebook import run progress
      operationId: recordFacebookImportProgress
      security:
        - machineApiKey: []
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookImportProgressRequest'
      responses:
        '204':
          description: Import run progress recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/runs/{importRunId}/login-required:

    post:
      tags: [Facebook Import]
      summary: Record that a Facebook import run needs manual login
      operationId: recordFacebookImportLoginRequired
      security:
        - machineApiKey: []
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookImportLoginRequiredRequest'
      responses:
        '204':
          description: Login-required event recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/facebook-import/runs/abandoned-startup-cleanup:

    post:
      tags: [Facebook Import]
      summary: Terminate abandoned Facebook import runs after worker startup
      operationId: cleanupAbandonedFacebookImportRunsOnStartup
      security:
        - machineApiKey: []
      description: >
        Used by a worker on startup to mark previously running import runs as
        terminated when the worker restarted before recording a terminal state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookImportStartupCleanupRequest'
      responses:
        '200':
          description: Abandoned import runs terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookImportStartupCleanupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/articles/{id}:

    parameters:
      - $ref: '#/components/parameters/ArticleId'

    get:
      tags: [Articles]
      summary: Get article by ID
      operationId: getArticle
      security: []
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Articles]
      summary: Replace article input fields
      operationId: replaceArticle
      security:
        - googleOidc: []
      description: >
        Replaces url, language and optional quote. The server re-fetches the
        target page to refresh title, thumbnail, lead, and best-effort
        publishedAt unless publishedAt is explicitly supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Article replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Articles]
      summary: Partially update an article
      operationId: patchArticle
      security:
        - googleOidc: []
        - machineApiKey: []
      description: >
        Updates only the provided fields. Updatable fields: url, language, quote, publishedAt,
        and internal preserved content.
        Setting quote to null explicitly clears it; omitting quote leaves it unchanged.
        Setting publishedAt to null explicitly clears it; omitting publishedAt leaves it unchanged, including when url changes.
        Setting content stores/replaces the preserved content cache; setting content to null or blank clears it.
        If url is changed the server re-fetches the page to refresh the enriched
        fields. Fully atomic — if enrichment fails the server responds with 422
        and the existing record is left unchanged.
        Null for url or language is invalid and returns 400.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ArticlePatch'
      responses:
        '200':
          description: Article updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Articles]
      summary: Delete an article
      operationId: deleteArticle
      security:
        - googleOidc: []
      responses:
        '204':
          description: Article deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rss:

    get:
      tags: [RSS]
      summary: RSS 2.0 feed
      operationId: getRssFeed
      security: []
      x-rss-channel:
        title: Co za dzban
        link: https://cozadzban.pl
        description: fucked up news
        language:
          default: en
          note: accepts normalized BCP-47-like tags
        generator: cozadzban.pl
        lastBuildDateSource: app.build.timestamp injected by Gradle as ISO-8601 UTC
        lastBuildDateFormat: RFC-822 UTC (converted by RSS controller from ISO-8601)
        lastBuildDateFallback: fail-fast when app.build.timestamp is missing or unparseable
      x-html-discovery:
        linkRelAlternate: '<link rel="alternate" type="application/rss+xml" title="Co za dzban RSS" href="/rss">'
        visibleUiLink: ArticleListView top bar includes an RSS icon/link to /rss
      description: >
        Returns an RSS 2.0 feed of articles ordered by creation date (newest first).
        Provide the `lang` query parameter to filter to a single BCP-47 language.
        Each item links to its verified publisher article URL when available,
        otherwise to the imported source URL.
        RSS pubDate uses publishedAt when present and falls back to createdAt.
        RSS never exposes article creator/user data.
      parameters:
        - name: lang
          in: query
          description: >-
            BCP-47 language tag filter (e.g. en, pl, de).
            Must match the same normalized BCP-47-like validation used by articles.
          required: false
          schema:
            type: string
            pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
            example: pl
      responses:
        '200':
          description: RSS feed
          content:
            application/rss+xml:
              schema:
                type: string

  /rss/image/{id}:

    get:
      tags: [RSS]
      summary: Proxy an article thumbnail for RSS readers and story pages
      operationId: getRssImage
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thumbnail image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Thumbnail could not be fetched or was not an image

  /generated-images/{id}.png:
    get:
      tags: [Articles]
      summary: Read a completed generated article illustration (full-quality PNG)
      description: >
        A `v` value equal to the current image version (the stored PNG's last-modified
        time in epoch milliseconds) returns `Cache-Control: public, max-age=31536000,
        immutable`. Without `v`, or with an older value, the response uses
        `max-age=600` and carries `Last-Modified`, so `If-Modified-Since`
        revalidation returns 304 without a body.
      operationId: getGeneratedArticleImage
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: v
          in: query
          required: false
          description: Image version used by the UI to make the URL cacheable for a year.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Original PNG, the same file used for Facebook photo posts and og:image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: The cached copy is still current
        '404':
          description: No completed generated image is available for this article

  /generated-images/{id}.jpg:
    get:
      tags: [Articles]
      summary: Read the smaller website copy of a generated article illustration
      description: >
        A `v` value equal to the current image version (the stored PNG's last-modified
        time in epoch milliseconds) returns `Cache-Control: public, max-age=31536000,
        immutable`. Without `v`, or with an older value, the response uses
        `max-age=600` and carries `Last-Modified`, so `If-Modified-Since`
        revalidation returns 304 without a body.
      operationId: getGeneratedArticleWebImage
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: v
          in: query
          required: false
          description: Image version used by the UI to make the URL cacheable for a year.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: JPEG copy shown in the feed and on story pages, created on first request and rebuilt when the PNG changes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: The cached copy is still current
        '404':
          description: No completed generated image is available for this article

  /api/users:

    get:
      tags: [Security]
      summary: List allowlisted users
      operationId: listAppUsers
      x-required-role: ADMIN
      security:
        - googleOidc: []
      responses:
        '200':
          description: List of allowlisted users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Security]
      summary: Add user to allowlist
      operationId: addAppUser
      x-required-role: ADMIN
      security:
        - googleOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserInput'
      responses:
        '201':
          description: User added to allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}/status:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Allowed user identifier to update

    patch:
      tags: [Security]
      summary: Compatibility endpoint for updating user status
      operationId: updateAppUserStatus
      x-required-role: ADMIN
      security:
        - googleOidc: []
      description: Prefer PATCH /api/users/{id} with the status field for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserStatusPatch'
      responses:
        '200':
          description: User restored to ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '204':
          description: User marked DELETED
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Allowed user identifier to remove

    delete:
      tags: [Security]
      summary: Soft-delete user from allowlist
      operationId: removeAppUser
      x-required-role: ADMIN
      security:
        - googleOidc: []
      responses:
        '204':
          description: User marked DELETED and no longer allowlisted for writes
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Security]
      summary: Update allowlisted user role/status
      operationId: updateAppUserRole
      x-required-role: ADMIN
      security:
        - googleOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserRolePatch'
      responses:
        '200':
          description: Allowed user role/status updated (or unchanged if same values requested)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  securitySchemes:
    googleOidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration

    machineApiKey:
      type: apiKey
      in: header
      name: X-CoZaDzban-M2M-Key
      description: Machine credential used by the remote Facebook importer to submit proposals

    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-managed authenticated session cookie
  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      description: Unique article identifier
      schema:
        type: integer
        format: int64
        example: 42

  schemas:

    ArticleInput:
      type: object
      required: [url, language]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://.+'
          description: Full URL of the article page to fetch and store (http/https only). The server persists the canonicalized URL and removes tracking-only query parameters such as fbclid, utm_*, gclid, dclid, and msclkid before uniqueness checks.
          example: https://example.com/some-article
        language:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
          description: BCP-47 language tag identifying the article's language
          example: pl
        quote:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          description: Optional user-provided quote or comment about the article
          example: "This perfectly captures the absurdity."
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional manual source publication timestamp. If omitted on create, enrichment attempts to populate it.
          example: "2026-05-02T08:30:00Z"

    ArticleUrlExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          example: true

    FacebookProposalExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: True when the canonical URL already exists as an Article or proposal.
          example: false

    FacebookProposalSubmission:
      type: object
      required: [candidateId, articleUrl, language]
      properties:
        candidateId:
          type: string
          example: facebook-import-candidate-42
        articleUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://.+'
          example: https://example.com/story
        facebookPostUrl:
          type: string
          format: uri
          nullable: true
          example: https://www.facebook.com/source/posts/123
        language:
          type: string
          maxLength: 20
          pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
          description: Worker-guessed language; users may correct it before accepting.
          example: pl
        logs:
          type: string
          nullable: true
          description: Worker diagnostics stored server-side as compressed UTF-8 GZIP bytes.

    FacebookProposalBatchRequest:
      type: object
      required: [importRunId, passIndex, passCount, proposals]
      properties:
        importType:
          type: string
          enum: [API, APIFY, SELENIUM]
          default: SELENIUM
          description: APIFY is accepted as an alias for API (case-insensitive); responses always report API.
        trigger:
          type: string
          enum: [MANUAL, WORKER_STARTUP, SCHEDULED]
          default: MANUAL
        importRunId:
          type: string
          example: facebook-import-20260524T100000Z-1
        passIndex:
          type: integer
          minimum: 1
          example: 1
        passCount:
          type: integer
          minimum: 1
          example: 4
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/FacebookProposalSubmission'
        logs:
          type: string
          nullable: true

    FacebookProposalBatchResponse:
      type: object
      required: [importRunId, submitted, skippedExisting, autoApproved, failed]
      properties:
        importRunId:
          type: string
        submitted:
          type: integer
          example: 3
        skippedExisting:
          type: integer
          example: 1

        autoApproved:
          type: integer
          description: Number of proposals automatically accepted as articles.
          default: 0
        failed:
          type: integer
          default: 0

    FacebookImportRunCompletionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [RUNNING, FINISHED, FAILED, TERMINATED]
          example: FINISHED
        importType:
          type: string
          enum: [API, APIFY, SELENIUM]
          default: SELENIUM
          description: APIFY is accepted as an alias for API (case-insensitive); responses always report API.
        trigger:
          type: string
          enum: [MANUAL, WORKER_STARTUP, SCHEDULED]
          default: MANUAL
        discoveredCount:
          type: integer
          default: 0
        submittedCount:
          type: integer
          default: 0
        skippedExistingCount:
          type: integer
          default: 0
        failedCount:
          type: integer
          default: 0
        statusDetail:
          type: string
          nullable: true
          description: Optional terminal status detail persisted with the import run.
        logs:
          type: string
          nullable: true

        autoApprovedCount:
          type: integer
          default: 0
        apifyActorRunId:
          type: string
          nullable: true
        apifyCostUsd:
          type: number
          nullable: true
          description: Actual Apify actor run cost in USD when available.
        apifyCreditsExhausted:
          type: boolean
          default: false
          description: >
            True when an Apify run failed because the account has no usage left this
            billing cycle: the pre-run balance check, an Apify payment error type when
            starting the run, or a failed run with the balance below the run budget. The
            server then publishes the Apify credits exhausted notification.
        apifyRemainingUsd:
          type: number
          nullable: true
          description: Apify usage left this billing cycle in USD, from GET /v2/users/me/limits.
        apifyUsageCycleEndAt:
          type: string
          format: date-time
          nullable: true
          description: End of the current Apify billing cycle (UTC).

    FacebookImportStartupCleanupRequest:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
          description: UTC timestamp for the worker startup cleanup; defaults server-side if omitted.

    FacebookImportStartupCleanupResponse:
      type: object
      required: [terminatedRunIds]
      properties:
        terminatedRunIds:
          type: array
          items:
            type: string

    FacebookImportLoginRequiredRequest:
      type: object
      required: [trigger, profileUrl]
      properties:
        trigger:
          type: string
          enum: [MANUAL, WORKER_STARTUP, SCHEDULED]
          example: SCHEDULED
        profileUrl:
          type: string
          format: uri
          example: https://www.facebook.com/bartek.dobrowolski.nowakowski
        detectedAt:
          type: string
          format: date-time
          description: UTC timestamp when the worker detected the login requirement; defaults server-side if omitted.
          example: "2026-05-24T10:00:00Z"
        timedOut:
          type: boolean
          default: false
          description: True when this report records that the login wait timed out; uses the same notification preference as login-required alerts.
        timeoutMessage:
          type: string
          nullable: true
          description: Optional worker timeout detail for diagnostics.

    FacebookImportProgressRequest:
      type: object
      required: [phase, phaseIndex, phaseCount]
      properties:
        importType:
          type: string
          enum: [API, APIFY, SELENIUM]
          default: SELENIUM
          description: APIFY is accepted as an alias for API (case-insensitive); responses always report API.
        trigger:
          type: string
          enum: [MANUAL, WORKER_STARTUP, SCHEDULED]
          default: MANUAL
        phase:
          type: string
          example: Checking existing proposals
        detail:
          type: string
          nullable: true
        phaseIndex:
          type: integer
          minimum: 0
        phaseCount:
          type: integer
          minimum: 0
        passIndex:
          type: integer
          default: 0
        passCount:
          type: integer
          default: 0
        matchedPostCount:
          type: integer
          default: 0
        submittedCount:
          type: integer
          default: 0
        skippedExistingCount:
          type: integer
          default: 0
        failedCount:
          type: integer
          default: 0
        occurredAt:
          type: string
          format: date-time
          description: UTC timestamp when the worker observed this progress state; defaults server-side if omitted.

    FacebookImportProgressSnapshot:
      type: object
      required:
        - importRunId
        - importType
        - status
        - startedAt
        - lastUpdatedAt
        - phaseIndex
        - phaseCount
        - passIndex
        - passCount
        - matchedPostCount
        - submittedCount
        - skippedExistingCount
        - failedCount
      properties:
        importType:
          type: string
          enum: [API, SELENIUM]
          default: SELENIUM
          description: Apify runs are reported as API.
        importRunId:
          type: string
        status:
          type: string
          enum: [RUNNING, FINISHED, FAILED, TERMINATED]
        startedAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
        phase:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        phaseIndex:
          type: integer
        phaseCount:
          type: integer
        passIndex:
          type: integer
        passCount:
          type: integer
        matchedPostCount:
          type: integer
        submittedCount:
          type: integer
        skippedExistingCount:
          type: integer
        failedCount:
          type: integer

    ArticlePatch:
      type: object
      description: JSON Merge Patch document; omitted fields are left unchanged
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://.+'
          example: https://example.com/updated-article
        language:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[a-z]{2,3}(-[a-z0-9]{2,8})*$'
          description: BCP-47 language tag
          example: en
        title:
          type: string
          nullable: true
          maxLength: 500
          description: Verified title override; null or blank clears it
        lead:
          type: string
          nullable: true
          maxLength: 2000
          description: Verified lead override; null or blank clears it
        publisherUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Verified publisher article URL; null or blank clears it
        quote:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          description: User-provided quote; null explicitly clears it; empty string is invalid
          example: "This perfectly captures the absurdity."
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Source publication timestamp; null explicitly clears it
          example: "2026-05-02T08:30:00Z"
        content:
          type: string
          nullable: true
          description: Preserved content cache input, normally shortened to 1200 characters plus ellipsis (with a historical repair exception) and capped at 5 MiB UTF-8; null or blank clears it. May repair a degraded Facebook post title. Cached content itself is not exposed in article responses or RSS.

    Article:
      type: object
      description: >
        Article response. `createdBy` is included only for authenticated requests
        and omitted for anonymous/public responses and RSS.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        url:
          type: string
          format: uri
          example: https://example.com/some-article
        publisherUrl:
          type: string
          format: uri
          nullable: true
          description: Verified publisher article URL when distinct from the imported source URL
        language:
          type: string
          description: BCP-47 language tag
          example: pl
        title:
          type: string
          description: Title fetched from the article page
          nullable: true
          example: "An Interesting Article"
        thumbnail:
          type: string
          format: uri
          description: Thumbnail URL fetched from the article page (og:image or similar)
          nullable: true
          example: https://example.com/images/thumb.jpg
        favicon:
          type: string
          description: Local cached favicon URL downloaded from source site icon metadata
          nullable: true
          example: /favicons/2f1a0c8d9e7b6a5c4d3e2f10987654321abcdeffedcba9876543210012345678.png
        lead:
          type: string
          description: Lead/excerpt fetched from the article page (og:description or similar)
          nullable: true
          example: "A short summary of the article content."
        quote:
          type: string
          description: User-provided quote or comment about the article
          nullable: true
          example: "This perfectly captures the absurdity."
        aiSummary:
          type: string
          description: AI-generated summary — future feature, null until implemented
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Source article publication timestamp, fetched from metadata or edited manually
          example: "2026-05-02T08:30:00Z"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-02T10:00:00Z"
        createdBy:
          $ref: '#/components/schemas/ArticleCreator'

    ArticleCreator:
      type: object
      readOnly: true
      description: Present only for authenticated article responses; never exposed in anonymous responses or RSS.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com

    AppUserInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Email to add to the write-operation allowlist (RFC 5321 max 254 chars)
          example: admin@cozadzban.pl
        role:
          type: string
          enum: [USER, ADMIN]
          minLength: 1
          description: Authorization role assigned to this user
          example: USER
        status:
          type: string
          enum: [ACTIVE, DELETED]
          description: Optional initial lifecycle status; defaults to ACTIVE
          example: ACTIVE

    AppUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        email:
          type: string
          format: email
          maxLength: 254
          example: admin@cozadzban.pl
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER
        status:
          type: string
          enum: [ACTIVE, DELETED]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-02T10:00:00Z"

    AppUserRolePatch:
      type: object
      minProperties: 1
      description: Role/status update payload for allowlisted user
      properties:
        role:
          type: string
          enum: [USER, ADMIN]
          minLength: 1
          description: New role to assign
          example: ADMIN
        status:
          type: string
          enum: [ACTIVE, DELETED]
          description: New lifecycle status to assign
          example: ACTIVE

    AppUserStatusPatch:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, DELETED]
          description: New lifecycle status to assign
          example: ACTIVE

    ArticlePage:
      type: object
      description: Frozen page response shape using creator-aware Article DTOs
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        pageable:
          $ref: '#/components/schemas/Pageable'
        totalElements:
          type: integer
          format: int64
          example: 150
        totalPages:
          type: integer
          example: 8
        size:
          type: integer
          example: 20
        number:
          type: integer
          description: Current zero-based page number
          example: 0
        numberOfElements:
          type: integer
          example: 20
        sort:
          $ref: '#/components/schemas/Sort'
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        offset:
          type: integer
          format: int64
          example: 0
        paged:
          type: boolean
          example: true
        unpaged:
          type: boolean
          example: false
        sort:
          $ref: '#/components/schemas/Sort'

    Sort:
      type: object
      properties:
        sorted:
          type: boolean
          example: true
        unsorted:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false

    ProblemDetail:
      type: object
      description: RFC 9457 / Spring ProblemDetail error response
      required: [type, title, status, detail]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'url' must be a valid URI"
        instance:
          type: string
          format: uri
          example: /api/articles

  responses:

    BadRequest:
      description: Request payload is invalid or malformed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: Conflict with business rules
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            articleUrlConflict:
              summary: Duplicate article URL
              value:
                type: https://cozadzban.pl/problems/article-url-conflict
                title: Article URL Already Exists
                status: 409
                detail: "An article with URL 'https://example.com/story' already exists"
                instance: /api/articles
            allowlistEmailConflict:
              summary: Duplicate allowlist email
              value:
                type: https://cozadzban.pl/problems/allowlist-email-conflict
                title: Allowlisted Email Already Exists
                status: 409
                detail: "User with email 'user@example.com' is already allowlisted"
                instance: /api/users
            lastAdminRequired:
              summary: Attempt to remove final admin
              value:
                type: https://cozadzban.pl/problems/last-admin-required
                title: Last Admin Required
                status: 409
                detail: Operation would leave the system without an ADMIN user
                instance: /api/users/1
            facebookImportBusy:
              summary: Facebook import already running
              value:
                type: https://cozadzban.pl/problems/facebook-import-busy
                title: Facebook Import Already Running
                status: 409
                detail: Facebook import is already running.
                instance: /api/admin/facebook-import/run
            facebookImportNotRunning:
              summary: No Facebook import to terminate
              value:
                type: https://cozadzban.pl/problems/facebook-import-not-running
                title: No Active Facebook Import
                status: 409
                detail: No Facebook import job is currently running.
                instance: /api/admin/facebook-import/terminate

    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: Authenticated but not allowed to perform this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnprocessableEntity:
      description: The URL could not be fetched or its content could not be parsed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
