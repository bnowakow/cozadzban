# ──────────────────────────────────────────────────────────────
# BUSINESS RULES  (x-business-rules)
# ──────────────────────────────────────────────────────────────
x-business-rules:
  - id: BR-01
    name: URL enrichment on create
    description: >
      When a new Article is created (POST /api/articles), the server MUST fetch
      the URL and populate title, thumbnail, favicon, lead, and best-effort publishedAt
      before persisting.
      The operation is fully atomic: if enrichment fails (non-2xx, timeout, or
      unreachable), the server responds with 422 and no DB write occurs.
  - id: BR-02
    name: URL enrichment on replace
    description: >
      When an Article is replaced (PUT /api/articles/{id}), the server MUST
      re-fetch the new URL to refresh title, thumbnail, favicon, lead, and best-effort
      publishedAt unless the request explicitly supplies publishedAt.
      The operation is fully atomic: if enrichment fails, the server responds
      with 422 and the existing article record is left unchanged.
  - id: BR-03
    name: Partial update enrichment
    description: >
      When an Article is patched (PATCH /api/articles/{id}) and the url field
      changes the canonical URL, the server re-fetches to refresh title, thumbnail,
      favicon, lead and preserved content. publishedAt changes only when explicitly
      provided; null clears it. An unchanged canonical URL does not trigger enrichment. The operation is fully atomic: if enrichment fails, the server
      responds with 422 and the existing article record is left unchanged.
      Without a URL change, enriched fields stay unchanged except that a content
      patch may repair a degraded Facebook post title.
  - id: BR-04
    name: Language normalization and validation
    description: >
      Language is accepted as a conservative BCP-47-like string, normalized to
      lowercase before persistence, and validated with
      ^[a-z]{2,3}(-[a-z0-9]{2,8})*$. Invalid values return 400 Bad Request.
      The UI language filter uses distinct normalized values already present in
      the database. The public feed shows All plus the three most-used languages
      and a compact overflow menu for the complete language list.
  - id: BR-05
    name: AI summary is future-only
    description: >
      The aiSummary field MUST always be null in the current implementation.
      It is present in the schema as a placeholder for a future enrichment step.
  - id: BR-06
    name: Schema changes via Flyway only
    description: >
      No DDL (CREATE TABLE, ALTER TABLE, etc.) may be executed outside of a
      Flyway migration script. Spring Data JDBC ddl-auto must NOT be set.
  - id: BR-07
    name: RSS ordering
    description: >
      The RSS feed MUST list articles in descending createdAt order
      (newest first). RSS pubDate uses publishedAt when present and falls back
      to createdAt. RSS MUST never expose creator/user data.
  - id: BR-08
    name: URL uniqueness
    description: >
      The url field MUST be globally unique across all articles regardless
      of language. Attempting to create an article with a url that already
      exists MUST return 409 Conflict. A UNIQUE constraint on the url column
      enforces this at the persistence layer.
  - id: BR-09
    name: SQL injection prevention
    description: >
      All database access MUST use parameterised queries. Spring Data JDBC
      repositories fulfil this automatically. Any custom queries using
      NamedParameterJdbcTemplate MUST use named parameters (:param) and
      never string concatenation. Raw JdbcTemplate with concatenated SQL
      is forbidden (OWASP A03).
  - id: BR-10
    name: Public read endpoints
    description: >
      The following endpoints MUST be publicly accessible without
      authentication: GET /api/articles, GET /api/articles/{id}, GET /rss.
  - id: BR-11
    name: Protected write endpoints
    description: >
      The following endpoints MUST require a valid OAuth2 Bearer token issued
      by Google OIDC: POST /api/articles, PUT /api/articles/{id},
      PATCH /api/articles/{id}, DELETE /api/articles/{id}.
      Missing or invalid tokens return 401; insufficient privileges return 403.
  - id: BR-12
    name: OAuth token validation rules
    description: >
      Accepted token type is OAuth2 Bearer access token (JWT).
      ID tokens are not accepted for API authorization.
      Required claim checks: iss=https://accounts.google.com,
      aud contains configured application client id,
      exp in the future, sub present, email present,
      and email_verified=true.
  - id: BR-13
    name: Allowlist enforcement
    description: >
      For all write operations, normalized token email (trimmed, lowercased)
      must exist in app_user.email with status ACTIVE.
      If token is valid but email is not allowlisted, return 403.
  - id: BR-14
    name: URL canonicalization defaults
    description: >
      URL uniqueness and conflict detection use canonicalized URL value:
      lowercase scheme and host, remove default ports (:80 for http, :443 for https),
      remove fragment, preserve path and query, and remove trailing slash only
      for root path. Query parameters known to be tracking-only are removed
      before uniqueness checks and persistence: fbclid, utm_*, gclid, dclid,
      and msclkid. Facebook URLs preserve only semantic identity parameters
      (fbid, set, story_fbid, id); Instagram URLs remove all query parameters.
      Canonicalized URL is persisted in article.url.
  - id: BR-15
    name: UTC time standard
    description: >
      All persisted timestamps are UTC.
      JSON date-time fields use ISO-8601 UTC.
      RSS pubDate uses RFC-822 UTC.
  - id: BR-16
    name: CORS and CSRF defaults
    description: >
      CORS allows only https://cozadzban.pl.
      CSRF is disabled for /api/** and /rss.
      CSRF remains enabled for Vaadin UI routes.
  - id: BR-17
    name: Allowlist management API
    description: >
      Allowlist is managed using /api/users endpoints.
      All these endpoints require valid token, allowlisted email,
      and ADMIN role.
      Role changes are performed with PATCH /api/users/{id}.
  - id: BR-18
    name: PATCH media type and semantics
    description: >
      PATCH /api/articles/{id} uses JSON Merge Patch
      (application/merge-patch+json) semantics.
  - id: BR-19
    name: PATCH null and empty-string handling
    description: >
      For PATCH /api/articles/{id}, null value for required fields
      (url, language) is invalid and returns 400 Bad Request.
      Empty string ("") for any string field is invalid and returns 400.
  - id: BR-20
    name: Bootstrap admin user
    description: >
      On application startup, count ADMIN rows in app_user.
      If at least one ADMIN exists, skip bootstrap entirely (env var ignored).
      If no ADMIN exists, COZADZBAN_BOOTSTRAP_ADMIN_EMAIL is required:
        missing, empty, or invalid email format → fail startup fast.
        valid email → insert one ADMIN row (trim + lowercase);
        if email already exists with role USER, promote it to ADMIN.
  - id: BR-21
    name: Role-based access control
    description: >
      USER can read and perform article writes.
      ADMIN can perform all USER actions and manage allowlist users.
  - id: BR-22
    name: Build timestamp source
    description: >
      RSS channel lastBuildDate must come from application property
      app.build.timestamp, injected at build time as ISO-8601 UTC
      (e.g. 2026-05-02T10:00:00Z) by the Gradle processResources task.
      The RSS controller parses this ISO-8601 string and reformats it
      to RFC-822 UTC before emitting the feed.
      If the property is missing or unparseable, startup fails fast.
  - id: BR-23
    name: Minimum admin invariant
    description: >
      System must always keep at least one ACTIVE ADMIN user.
      Soft-deleting the final ACTIVE ADMIN returns 409 Conflict.
      Any role or status change that would result in zero ACTIVE ADMIN users
      returns 409 Conflict.
  - id: BR-24
    name: Frozen response contract behavior
    description: >
      Response field order is non-contractual and clients must not depend on it.
      Producers must emit only documented fields for frozen schemas.
      Consumers should ignore unknown fields for forward compatibility.
  - id: BR-25
    name: Conflict discriminator contract
    description: >
      Every 409 response uses ProblemDetail with mandatory fields:
      status, type, title, detail.
      type must be a stable URI discriminator. Current handlers do not emit
      conflictField, existingId, or remainingAdmins extensions.
  - id: BR-26
    name: Sort field allowlist
    description: >
      The sort parameter on GET /api/articles MUST be validated against an
      explicit allowlist before use in SQL ORDER BY:
      [id, createdAt, publishedAt, language, title, url].
      Column names must never be interpolated from raw user input.
      An unrecognised field returns 400 Bad Request.
  - id: BR-27
    name: Quote field semantics
    description: >
      quote is user-provided text, optional and nullable.
      Clients supply it in POST/PUT body alongside url and language.
      If omitted from POST/PUT, it defaults to null.
      In PATCH, an explicit null value clears the field; omitting quote leaves
      it unchanged (standard JSON Merge Patch semantics).
      Facebook import marker phrases such as "co za dzban" and "what a pitcher"
      are discovery signals and MUST NOT be persisted as article quotes.
  - id: BR-28
    name: Input field length and format constraints
    description: >
      url: minLength 1, maxLength 2048, must match ^https?://.+ (http/https only).
      language: minLength 1, maxLength 20 (matches VARCHAR(20) DB column),
      normalized to lowercase, and must match ^[a-z]{2,3}(-[a-z0-9]{2,8})*$.
      quote: minLength 1 when present and non-null, maxLength 2000.
      publishedAt: nullable ISO-8601 date-time when present.
      Empty strings are invalid for url, language and quote. PATCH content may
      be null or blank to clear the preserved cache; non-string values return 400.
      Violations return 400 Bad Request with ProblemDetail.
  - id: BR-29
    name: Allowlist email and role validation
    description: >
      email must be a valid RFC 5321 address, maxLength 254 characters.
      role must be exactly one of the enum values USER or ADMIN (case-sensitive).
      status must be exactly one of ACTIVE or DELETED when included in admin
      edit payloads.
      Any unrecognised role value returns 400 Bad Request.
      Empty string for email or role returns 400 Bad Request.

  - id: BR-30
    name: Frontend login flow
    description: >
      User clicks "Login" button on ArticleListView.
      Frontend navigates to GET /auth/login which redirects to Google OIDC.
      OAuth callback is processed server-side using Authorization Code.
      Frontend JavaScript MUST NOT receive or store raw OAuth tokens.
      UI stores only minimal display state (e.g. authenticated=true, email, role).
      ArticleListView updates UI to show logout button and "Add Article" button.
  - id: BR-31
    name: Backend session issuance
    description: >
      On successful OAuth callback, backend creates authenticated server session.
      Session cookie is HttpOnly, SameSite=Lax, Path=/. Secure follows
      SESSION_COOKIE_SECURE (default false; set true for HTTPS production).
      Role is resolved from allowlist (`app_user`) using normalized email.
      Users with status DELETED cannot authorize write operations. Google login may
      still establish a session; /auth/me reports no role and allowlisted=false.
      Idle timeout is SERVER_SERVLET_SESSION_TIMEOUT (default 30m).
      No separate absolute session lifetime is currently implemented.
  - id: BR-32
    name: Logout clears session
    description: >
      POST /auth/logout invalidates the server session, clears session cookie,
      and returns 204.
      Frontend clears local user state and shows "Login" button again.
  - id: BR-33
    name: Admin panel RBAC
    description: >
      GET /admin route requires authenticated user with role=ADMIN.
      If user is not authenticated or not ADMIN, redirect to /?require-login=true or show 403.
      Admin can list users, add users, soft-delete/restore users, and update roles.
      These actions are executed server-side via application services.
  - id: BR-34
    name: Article creation requires login
    description: >
      "Add Article" button visible only when user is authenticated (active server session).
      Click opens modal with form (url, language, optional quote).
      Submission executes server-side `ArticleService` create operation from Vaadin event handler.
      On success (201), modal closes, grid refreshes, success toast shown.
      On failure (400, 409, 422, 403), error toast shown with detail.
  - id: BR-35
    name: Session renewal and expiry
    description: >
      Session expiry is controlled server-side by the configured idle timeout.
      Session renewal uses server policy (sliding expiration) and does not expose
      OAuth tokens or custom JWT refresh endpoints to frontend JavaScript.
      Expired session returns 401 for /auth/me and requires re-login.
  - id: BR-36
    name: CSRF protection with cookies
    description: >
      Cookie-based authenticated UI requests MUST be protected by CSRF tokens.
      HttpOnly protects against token theft via JavaScript but does NOT mitigate CSRF.
      Vaadin/Spring Security CSRF mechanisms remain enabled for session-backed UI endpoints.
      Stateless bearer-token API endpoints MAY remain CSRF-disabled.
  - id: BR-37
    name: Article creator ownership
    description: >
      Every article MUST have an immutable created_by_user_id FK to app_user.
      Article creation resolves this FK from the authenticated DB user: JWT email
      for REST requests and session principal for Vaadin UI requests. PUT/PATCH
      never accept or change creator.
  - id: BR-38
    name: Creator exposure rules
    description: >
      Public/anonymous article list and detail responses MUST omit creator data.
      Authenticated article responses MUST include createdBy { id, email } in
      both the list endpoint (GET /api/articles) and the detail endpoint
      (GET /api/articles/{id}). Creator IDs are batch-fetched per page for the
      list endpoint to avoid N+1 queries.
      RSS MUST never expose creator/user data.
  - id: BR-39
    name: Existing article creator backfill
    description: >
      The migration adding article.created_by_user_id MUST backfill all existing
      articles to the oldest app_user by created_at ASC, id ASC. If articles
      exist but no users exist, migration fails and the app must not launch.
  - id: BR-40
    name: Soft-deleted users
    description: >
      Deleting a user changes status from ACTIVE to DELETED. User rows and email
      uniqueness are retained for audit/history and article creator FKs. DELETED
      users cannot authorize writes. Google authentication does not restore allowlist
      membership. Admins can restore users by
      changing status back to ACTIVE.
  - id: BR-41
    name: Publication date metadata
    description: >
      publishedAt is nullable. Enrichment attempts publication date extraction
      in order: meta[property=article:published_time], JSON-LD Article or
      NewsArticle datePublished, meta[name=date], meta[property=datePublished],
      and time[datetime]. Missing or unparseable publication date does not fail
      enrichment and persists null unless a user-supplied value is provided.
  - id: BR-42
    name: Article filtering
    description: >
      Article list endpoints support filters for language, publishedAt range,
      and createdAt range. The public Vaadin feed exposes language and collapsed
      publishedAt range filters.
  - id: BR-50
    name: Article favicon backfill
    description: >
      On application startup, the server SHOULD scan existing articles whose
      favicon is missing, blank, or not a local /favicons/... cache URL, download
      the source site's favicon from article.url metadata or origin /favicon.ico,
      and update only the article.favicon column. The backfill MUST be
      best-effort and MUST NOT block article reads when an individual favicon
      cannot be fetched. It runs once per startup on a background thread,
      processes at most APP_FAVICON_BACKFILL_MAX_ARTICLES candidates (default
      500; 0 disables processing), and is skipped entirely when
      APP_FAVICON_BACKFILL_ENABLED=false (default true).
  - id: BR-43
    name: Analytics consent
    description: >
      Google Analytics and StatCounter scripts are loaded only when configured
      IDs are present and the user has accepted analytics cookies. Consent text
      must make clear tracking is for analytics only, and users can reject or
      later revoke consent. The consent banner is shown by default (when
      analytics is configured) and remains visible until the user explicitly
      accepts or declines. RSS feed requests MAY emit best-effort server-side
      analytics events using configured analytics credentials; these events MUST
      NOT block the RSS response.
  - id: BR-44
    name: RSS discovery
    description: >
      Article pages MUST advertise the RSS feed to browsers/feed readers using
      a standard HTML discovery link:
      <link rel="alternate" type="application/rss+xml" title="Co za dzban RSS" href="/rss">.
      The UI SHOULD also include a visible RSS icon/link to /rss in the article
      list top bar.
  - id: BR-45
    name: Article content preservation cache future consideration
    description: >
      Article text/content is captured at creation/update time (V5 migration,
      article_content table, normally 1200 characters plus ellipsis with a historical
      repair exception and a final 5 MiB UTF-8 cap with truncation flag). Used for
      archival/preservation only. Do NOT use for UI rendering, source fallback,
      or AI summary generation without separate product/legal decisions on
      sanitization, access control, copyright/privacy posture, and purge behavior.
  - id: BR-46
    name: Facebook import job orchestration
    description: >
      Facebook import runs through the Spring Batch facebookImportJob with an
      explicit importType parameter. SELENIUM runs reuse a long-lived browser,
      verify Facebook login before each import, emit a login-required event
      and wait for manual/two-factor login when needed. APIFY runs use the paid
      Apify actor configured by environment variables and must be cost-guarded by
      result limits plus max-cost configuration. Scheduled Apify runs use their own
      interval, separate from the Selenium schedule, and check persisted APIFY run
      timestamps before launch so restarts cannot bypass the interval. Worker-startup runs
      launch enabled import types sequentially with APIFY before SELENIUM. Regular Selenium
      scheduled ticks do not run Apify. Only one import may run at a time per runtime.
      Discovery submits proposal batches
      and must not block on a human approval modal or create Articles directly.
  - id: BR-47
    name: Facebook import admin access
    description: >
      The Facebook import trigger endpoints and the ArticleListView button are
      visible and usable only by authenticated ADMIN users. Non-admin users must
      not see the control in the UI and must receive 403/Forbidden when calling
      the admin endpoints directly.
  - id: BR-48
    name: Machine-to-machine Facebook proposal writes
    description: >
      The Facebook importer writes proposal batches, proposal existence checks,
      import-run completion events, and login-required reports using a dedicated
      machine credential. The machine credential must not grant access to allowlist or admin endpoints.
      Accepted proposals create Articles owned by the configured ACTIVE import bot user.
  - id: BR-49
    name: Facebook article proposal inbox
    description: >
      The worker submits candidates as stored article proposals with candidateId,
      article URL, source Facebook post URL, guessed language, importRunId, and
      compressed diagnostics. Canonical article URL is unique across proposals;
      if the URL already exists as an Article or Proposal the worker/server skips it.
      Rediscovery updates lastSeen/log diagnostics without resetting an existing decision.
      Proposal status is null for pending or ACCEPTED, REJECTED, FAILED, ALREADY_EXISTS.
      All ACTIVE logged-in users may review proposals at /article-proposals, open
      article/Facebook links in a new tab, correct language, and accept or reject.
      Accept creates a normal Article owned by the configured import bot and records
      source_import_type, source_import_run_id, and source_facebook_proposal_id on the
      Article; if creation fails the proposal is marked failed and may be retried.
  - id: BR-50
    name: Facebook import notifications
    description: >
      The import system emits Spring application events and delivers Pushover
      notifications to opted-in users. FacebookImportLoginRequiredEvent is reported
      to the server and notifies only ACTIVE ADMIN users who enabled login-required
      alerts, and only for SCHEDULED interval imports. Manual imports and the
      WORKER_STARTUP import do not send login-required alerts.
      FacebookImportLoginTimedOutEvent uses the same login-required notification
      preference and notifies the same scheduled ADMIN audience when the worker
      times out waiting for manual login or two-factor approval during a
      SCHEDULED interval import. FacebookImportRunCompletedEvent notifies ACTIVE
      users who enabled review notifications when max(submittedCount - autoApprovedCount, 0) > 0.
      Separate auto-approval notifications go to opted-in ACTIVE users when autoApprovedCount > 0.
      Apify credits exhausted notifications go to opted-in ACTIVE ADMIN users when a run
      completion reports apifyCreditsExhausted=true, for any trigger. The message includes the
      remaining Apify usage and the billing cycle end when known, and links to the Apify
      billing page. An hourly server check (APP_FACEBOOK_IMPORT_APIFY_LOW_CREDIT_ALERTS_ENABLED,
      default true, needs the Apify API token) forecasts when the cycle's credit runs out from
      the spend rate so far: used USD divided by elapsed cycle days, counting at least one
      day. It publishes ApifyCreditsLowEvent when exhaustion is predicted within 3 days, and
      again within 1 day, before the cycle resets. Each alert fires once per cycle, recorded in
      apify_credit_alert. If the first check already finds under a day left, only the 1-day
      alert is sent. Opted-in ACTIVE ADMIN users get the Apify credits running low
      notification with the predicted date, remaining and daily usage.
      Notification delivery failures are logged and must never block or fail an
      import run.
  - id: BR-51
    name: Notification preference security
    description: >
      Pushover user keys are entered only in the server-side Vaadin settings
      view, validated against Pushover before saving, encrypted at rest with
      AES-GCM using APP_NOTIFICATIONS_ENCRYPTION_KEY, and never returned in full
      to the UI. The UI may display only whether a key is configured and a
      non-secret suffix. Notification preferences belong to ACTIVE logged-in users.
