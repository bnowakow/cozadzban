# ============================================================
# CoZaZjeb — Full System Specification
#
# This file is the single source of truth for ALL system specs.
# It uses the OpenAPI 3.0 format for the API contract and
# OpenAPI x- extensions to capture database, architecture,
# business rules and UI specifications.
#
# Intended audience: LLMs used for code generation / review.
# Runtime OpenAPI (served by springdoc) lives in openapi.yaml.
# ============================================================

openapi: 3.0.3

# ──────────────────────────────────────────────────────────────
# ARCHITECTURE SPEC  (x-architecture)
# ──────────────────────────────────────────────────────────────
x-architecture:
  language: Kotlin
  framework: Spring Boot 4.x
  javaVersion: 21
  buildTool: Gradle (Kotlin DSL)
  components:
    - name: REST API
      technology: Spring MVC (spring-boot-starter-webmvc)
      description: >
        CRUD endpoints for Article resources plus an RSS feed endpoint.
        Request/response bodies use JSON; errors use application/problem+json
        (RFC 9457 / Spring ProblemDetail).
    - name: Authentication and authorization
      technology: Spring Security Resource Server + Google OpenID Connect
      description: >
        Google is the selected OAuth/OIDC provider.
        JWT access tokens are validated using issuer metadata from
        https://accounts.google.com.
        Read endpoints are public. Write-inducing endpoints require a valid
        Bearer token and allowlisted email.
        Authorization model has two roles: USER and ADMIN.
        USER can perform article write operations.
        ADMIN can perform all operations, including allowlist management.
    - name: Database
      technology: PostgreSQL + Spring Data JDBC
      description: >
        All domain data is stored in PostgreSQL.
        Persistence uses Spring Data JDBC (not JPA/Hibernate) via
        CrudRepository / NamedParameterJdbcTemplate.
        No DDL is auto-generated; all schema changes go through Flyway.
        All queries MUST use parameterised statements — raw string
        concatenation into SQL is forbidden to prevent SQL injection
        (OWASP A03).
    - name: Schema migrations
      technology: Flyway
      description: >
        Versioned SQL migration scripts in src/main/resources/db/migration/.
        Naming convention: V<version>__<description>.sql (e.g. V1__create_articles.sql).
        No DDL must be written outside Flyway scripts.
    - name: URL enrichment
      technology: Spring RestClient (spring-boot-starter-restclient)
      description: >
        On create (POST), replace (PUT) and partial update (PATCH when url is
        changed), the server synchronously fetches the target URL and extracts
        title (og:title / <title>), thumbnail (og:image) and lead
        (og:description / <meta name="description">).
        Enrichment is synchronous and atomic — if the fetch fails no DB write occurs.
        Defaults: connect timeout 3 s, read timeout 5 s, no retries.
        If the fetch returns a non-2xx status, times out, or the URL is
        unreachable, the server responds with 422 and the article is not persisted.
    - name: RSS feed
      technology: Custom controller returning application/rss+xml
      rssFieldMapping:
        rssTitle: article.title
        rssLink: article.url
        rssDescription: article.lead
        rssPubDate: article.createdAt
        rssGuid: article.id
      rssChannel:
        title: Co za zjeb
        link: https://cozazjeb.pl
        description: fucked up news
        language: en
        generator: cozazjeb.pl
        lastBuildDateSource: app.build.timestamp injected by Gradle as ISO-8601 UTC
        lastBuildDateFormat: RFC-822 UTC (converted by RSS controller from ISO-8601)
        langFilter: GET /rss?lang=<BCP-47> filters to a single language; channel language element is set to the filter value
    - name: Vaadin UI
      technology: Vaadin 25 + spring-boot-starter (server-side)
      description: >
        Paginated, server-side rendered view of articles mounted at /.
        Not part of the REST API surface; see x-vaadin-ui for the spec.
    - name: Observability
      technology: Micrometer + Brave (Zipkin tracing) + Actuator
      description: >
        Distributed tracing via Brave/Zipkin. Actuator endpoints exposed for
        health, metrics and info.
    - name: Web security defaults
      technology: Spring Security + CORS
      description: >
        CORS allows only origin https://cozazjeb.pl.
        API is stateless, so CSRF is disabled for /api/** and /rss.
        CSRF remains enabled for Vaadin UI routes.
    - name: Bootstrap configuration
      technology: Spring Boot configuration properties
      description: >
        COZAZJEB_BOOTSTRAP_ADMIN_EMAIL is only required when the app_user
        table contains no ADMIN rows. If at least one ADMIN exists, the env var
        is optional and ignored. If no ADMINs exist and the env var is missing
        or empty, startup fails fast. If no ADMINs exist and env var is a valid
        email, one ADMIN row is seeded (or an existing USER is promoted).

    - name: Frontend authentication
      technology: Vaadin UI + Spring Security oauth2Login (Authorization Code + PKCE)
      description: >
        Login starts with redirect to Google authorization endpoint.
        OAuth callback is handled server-side; frontend JavaScript never receives
        access tokens or ID tokens.
        Session is represented by HttpOnly server session cookie.
        /auth/me provides current user info.
    - name: Authentication endpoints
      technology: Spring MVC UiAuthController + Spring Security oauth2Login
      description: >
        GET /auth/login starts OAuth Authorization Code + PKCE flow.
        GET /auth/me returns current user (email, role).
        POST /auth/logout invalidates server session and clears session cookie.
    - name: Admin management panel
      technology: Vaadin UI AdminView at @Route("/admin")
      description: >
        ADMIN-only view with user table (CRUD), add user form, delete/update role actions.
        View invokes application services server-side from Vaadin event handlers;
        no browser-side token forwarding is used.

# ──────────────────────────────────────────────────────────────
# DATABASE SPEC  (x-database)
# ──────────────────────────────────────────────────────────────
x-database:
  engine: PostgreSQL
  migrationTool: Flyway
  migrationPath: src/main/resources/db/migration/
  namingConvention: "V<version>__<snake_case_description>.sql"
  tables:
    - name: article
      migration: V1__create_articles.sql
      description: Stores enriched article records submitted by users.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: PRIMARY KEY
        - name: url
          type: TEXT
          constraints: "NOT NULL UNIQUE"
          description: Full URL of the source page as submitted by the user. Must be globally unique.
        - name: language
          type: VARCHAR(20)
          constraints: NOT NULL
          description: BCP-47 language tag (e.g. pl, en, de).
        - name: title
          type: TEXT
          constraints: nullable
          description: Page title fetched from og:title or <title>.
        - name: thumbnail
          type: TEXT
          constraints: nullable
          description: Thumbnail URL fetched from og:image.
        - name: lead
          type: TEXT
          constraints: nullable
          description: Lead text fetched from og:description or <meta name="description">.
        - name: quote
          type: TEXT
          constraints: nullable
          description: Optional user-provided quote or comment about the article. Not server-fetched.
        - name: ai_summary
          type: TEXT
          constraints: nullable
          description: Reserved for future AI-generated summary. Always NULL currently.
        - name: created_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
          description: Timestamp of record creation; set by the database.
      indexes:
        - name: article_language_idx
          columns: [language]
          description: Speeds up per-language RSS feed queries.
        - name: article_created_at_idx
          columns: [created_at DESC]
          description: Speeds up default sort order for list and RSS endpoints.
    - name: app_user
      migration: V2__create_app_users.sql
      description: Stores emails permitted to execute write operations.
      columns:
        - name: id
          type: BIGSERIAL
          constraints: PRIMARY KEY
        - name: email
          type: VARCHAR(254)
          constraints: "NOT NULL UNIQUE"
          description: Lowercased, trimmed email used for authorization allowlist.
        - name: role
          type: VARCHAR(16)
          constraints: "NOT NULL"
          description: Authorization role, one of USER or ADMIN.
        - name: created_at
          type: TIMESTAMPTZ
          constraints: "NOT NULL DEFAULT now()"
          description: UTC timestamp of allowlist entry creation.
      indexes:
        - name: app_user_email_idx
          columns: [email]
          description: Supports fast exact email lookups during authorization.

    - name: sessions
      migration: none (server-managed web session)
      description: No additional DB table required; session is server-managed and identified by HttpOnly cookie.
# ──────────────────────────────────────────────────────────────
# BUSINESS RULES  (x-business-rules)
# ──────────────────────────────────────────────────────────────
x-business-rules:
  - id: BR-01
    name: URL enrichment on create
    description: >
      When a new Article is created (POST /api/articles), the server MUST fetch
      the URL and populate title, thumbnail and lead before persisting.
      The operation is fully atomic: if enrichment fails (non-2xx, timeout, or
      unreachable), the server responds with 422 and no DB write occurs.
  - id: BR-02
    name: URL enrichment on replace
    description: >
      When an Article is replaced (PUT /api/articles/{id}), the server MUST
      re-fetch the new URL to refresh title, thumbnail and lead.
      The operation is fully atomic: if enrichment fails, the server responds
      with 422 and the existing article record is left unchanged.
  - id: BR-03
    name: Partial update enrichment
    description: >
      When an Article is patched (PATCH /api/articles/{id}) and the url field
      is included in the payload, the server MUST re-fetch to refresh enriched
      fields. The operation is fully atomic: if enrichment fails, the server
      responds with 422 and the existing article record is left unchanged.
      If url is absent, enriched fields are left unchanged.
  - id: BR-04
    name: Language is BCP-47 string
    description: >
      Language is stored and accepted as a free-form BCP-47 string.
      No validation against a fixed enum; the client is responsible for
      supplying a valid tag (e.g. pl, en, en-GB).
  - id: BR-05
    name: AI summary is future-only
    description: >
      The aiSummary field MUST always be null in the current implementation.
      It is present in the schema as a placeholder for a future enrichment step.
  - id: BR-06
    name: Schema changes via Flyway only
    description: >
      No DDL (CREATE TABLE, ALTER TABLE, etc.) may be executed outside of a
      Flyway migration script. Spring Data JDBC ddl-auto must NOT be set.
  - id: BR-07
    name: RSS ordering
    description: >
      The RSS feed MUST list articles in descending createdAt order
      (newest first).
  - id: BR-08
    name: URL uniqueness
    description: >
      The url field MUST be globally unique across all articles regardless
      of language. Attempting to create an article with a url that already
      exists MUST return 409 Conflict. A UNIQUE constraint on the url column
      enforces this at the persistence layer.
  - id: BR-09
    name: SQL injection prevention
    description: >
      All database access MUST use parameterised queries. Spring Data JDBC
      repositories fulfil this automatically. Any custom queries using
      NamedParameterJdbcTemplate MUST use named parameters (:param) and
      never string concatenation. Raw JdbcTemplate with concatenated SQL
      is forbidden (OWASP A03).
  - id: BR-10
    name: Public read endpoints
    description: >
      The following endpoints MUST be publicly accessible without
      authentication: GET /api/articles, GET /api/articles/{id}, GET /rss.
  - id: BR-11
    name: Protected write endpoints
    description: >
      The following endpoints MUST require a valid OAuth2 Bearer token issued
      by Google OIDC: POST /api/articles, PUT /api/articles/{id},
      PATCH /api/articles/{id}, DELETE /api/articles/{id}.
      Missing or invalid tokens return 401; insufficient privileges return 403.
  - id: BR-12
    name: OAuth token validation rules
    description: >
      Accepted token type is OAuth2 Bearer access token (JWT).
      ID tokens are not accepted for API authorization.
      Required claim checks: iss=https://accounts.google.com,
      aud contains configured application client id,
      exp in the future, sub present, email present,
      and email_verified=true.
  - id: BR-13
    name: Allowlist enforcement
    description: >
      For all write operations, normalized token email (trimmed, lowercased)
      must exist in app_user.email.
      If token is valid but email is not allowlisted, return 403.
  - id: BR-14
    name: URL canonicalization defaults
    description: >
      URL uniqueness and conflict detection use canonicalized URL value:
      lowercase scheme and host, remove default ports (:80 for http, :443 for https),
      remove fragment, preserve path and query, and remove trailing slash only
      for root path.
      Canonicalized URL is persisted in article.url.
  - id: BR-15
    name: UTC time standard
    description: >
      All persisted timestamps are UTC.
      JSON date-time fields use ISO-8601 UTC.
      RSS pubDate uses RFC-822 UTC.
  - id: BR-16
    name: CORS and CSRF defaults
    description: >
      CORS allows only https://cozazjeb.pl.
      CSRF is disabled for /api/** and /rss.
      CSRF remains enabled for Vaadin UI routes.
  - id: BR-17
    name: Allowlist management API
    description: >
      Allowlist is managed using /api/users endpoints.
      All these endpoints require valid token, allowlisted email,
      and ADMIN role.
      Role changes are performed with PATCH /api/users/{id}.
  - id: BR-18
    name: PATCH media type and semantics
    description: >
      PATCH /api/articles/{id} uses JSON Merge Patch
      (application/merge-patch+json) semantics.
  - id: BR-19
    name: PATCH null and empty-string handling
    description: >
      For PATCH /api/articles/{id}, null value for required fields
      (url, language) is invalid and returns 400 Bad Request.
      Empty string ("") for any string field is invalid and returns 400.
  - id: BR-20
    name: Bootstrap admin user
    description: >
      On application startup, count ADMIN rows in app_user.
      If at least one ADMIN exists, skip bootstrap entirely (env var ignored).
      If no ADMIN exists, COZAZJEB_BOOTSTRAP_ADMIN_EMAIL is required:
        missing, empty, or invalid email format → fail startup fast.
        valid email → insert one ADMIN row (trim + lowercase);
        if email already exists with role USER, promote it to ADMIN.
  - id: BR-21
    name: Role-based access control
    description: >
      USER can read and perform article writes.
      ADMIN can perform all USER actions and manage allowlist users.
  - id: BR-22
    name: Build timestamp source
    description: >
      RSS channel lastBuildDate must come from application property
      app.build.timestamp, injected at build time as ISO-8601 UTC
      (e.g. 2026-05-02T10:00:00Z) by the Gradle processResources task.
      The RSS controller parses this ISO-8601 string and reformats it
      to RFC-822 UTC before emitting the feed.
      If the property is missing or unparseable, startup fails fast.
  - id: BR-23
    name: Minimum admin invariant
    description: >
      System must always keep at least one ADMIN user.
      Deleting the final ADMIN returns 409 Conflict.
      Any role change that would result in zero ADMIN users returns 409 Conflict.
  - id: BR-24
    name: Frozen response contract behavior
    description: >
      Response field order is non-contractual and clients must not depend on it.
      Producers must emit only documented fields for frozen schemas.
      Consumers should ignore unknown fields for forward compatibility.
  - id: BR-25
    name: Conflict discriminator contract
    description: >
      Every 409 response uses ProblemDetail with mandatory fields:
      status, type, title, detail.
      type must be a stable URI discriminator. Optional extension fields such as
      conflictField, existingId, remainingAdmins may be included when relevant.
  - id: BR-26
    name: Sort field allowlist
    description: >
      The sort parameter on GET /api/articles MUST be validated against an
      explicit allowlist before use in SQL ORDER BY: [id, createdAt, language, title, url].
      Column names must never be interpolated from raw user input.
      An unrecognised field returns 400 Bad Request.
  - id: BR-27
    name: Quote field semantics
    description: >
      quote is user-provided text, optional and nullable.
      Clients supply it in POST/PUT body alongside url and language.
      If omitted from POST/PUT, it defaults to null.
      In PATCH, an explicit null value clears the field; omitting quote leaves
      it unchanged (standard JSON Merge Patch semantics).
  - id: BR-28
    name: Input field length and format constraints
    description: >
      url: minLength 1, maxLength 2048, must match ^https?://.+ (http/https only).
      language: minLength 1, maxLength 20 (matches VARCHAR(20) DB column).
      quote: minLength 1 when present and non-null, maxLength 2000.
      Empty string ("") is invalid for any string field and returns 400.
      Violations return 400 Bad Request with ProblemDetail.
  - id: BR-29
    name: Allowlist email and role validation
    description: >
      email must be a valid RFC 5321 address, maxLength 254 characters.
      role must be exactly one of the enum values USER or ADMIN (case-sensitive).
      Any unrecognised role value returns 400 Bad Request.
      Empty string for email or role returns 400 Bad Request.

  - id: BR-30
    name: Frontend login flow
    description: >
      User clicks "Login" button on ArticleListView.
      Frontend navigates to GET /auth/login which redirects to Google OIDC.
      OAuth callback is processed server-side using Authorization Code + PKCE.
      Frontend JavaScript MUST NOT receive or store raw OAuth tokens.
      UI stores only minimal display state (e.g. authenticated=true, email, role).
      ArticleListView updates UI to show logout button and "Add Article" button.
  - id: BR-31
    name: Backend session issuance
    description: >
      On successful OAuth callback, backend creates authenticated server session.
      Session cookie is HttpOnly, Secure in production, SameSite=Lax, Path=/.
      Role is resolved from allowlist (`app_user`) using normalized email.
      Session lifetime has idle timeout and absolute timeout configured in app properties.
  - id: BR-32
    name: Logout clears session
    description: >
      POST /auth/logout invalidates the server session, clears session cookie,
      and returns 204.
      Frontend clears local user state and shows "Login" button again.
  - id: BR-33
    name: Admin panel RBAC
    description: >
      GET /admin route requires authenticated user with role=ADMIN.
      If user is not authenticated or not ADMIN, redirect to /?require-login=true or show 403.
      Admin can list users, add users, delete users, and update roles.
      These actions are executed server-side via application services.
  - id: BR-34
    name: Article creation requires login
    description: >
      "Add Article" button visible only when user is authenticated (active server session).
      Click opens modal with form (url, language, optional quote).
      Submission executes server-side `ArticleService` create operation from Vaadin event handler.
      On success (201), modal closes, grid refreshes, success toast shown.
      On failure (400, 409, 422, 403), error toast shown with detail.
  - id: BR-35
    name: Session renewal and expiry
    description: >
      Session expiry is controlled server-side by idle and absolute timeouts.
      Session renewal uses server policy (sliding expiration) and does not expose
      OAuth tokens or custom JWT refresh endpoints to frontend JavaScript.
      Expired session returns 401 for /auth/me and requires re-login.
  - id: BR-36
    name: CSRF protection with cookies
    description: >
      Cookie-based authenticated UI requests MUST be protected by CSRF tokens.
      HttpOnly protects against token theft via JavaScript but does NOT mitigate CSRF.
      Vaadin/Spring Security CSRF mechanisms remain enabled for session-backed UI endpoints.
      Stateless bearer-token API endpoints MAY remain CSRF-disabled.
# ──────────────────────────────────────────────────────────────
# VAADIN UI SPEC  (x-vaadin-ui)
# ──────────────────────────────────────────────────────────────
x-vaadin-ui:
  mountPath: /
  technology: Vaadin 25, server-side rendering
  views:
    - name: ArticleListView
      route: /
      description: >
        Paginated, read-only grid listing all articles.
      columns: [id, title, language, url, createdAt]
      features:
        - Server-side pagination; default page size 20
        - Page size selector dropdown with options [10, 20, 40, 60, 80, 100]
        - Sort by any displayed column (allowlist: id, createdAt, language, title, url)
        - Click row to open source URL in a new tab

    - name: (Enhanced) ArticleListView
      route: /
      enhancements:
        - "Top-right corner: Login button if not authenticated; Logout button if authenticated (present on every page)"
        - "Logout button click -> invalidates server session, clears security context, redirects to /"
        - "Login button click -> navigates to GET /auth/login (OAuth flow)"
        - "If authenticated: Add Article button below grid or in toolbar"
        - "Click Add Article -> modal with form (url, language, quote)"
        - "Form validation: url required (^https?://.+), language required, quote optional"
        - "Submit server-side via ArticleService with loading spinner; on success close modal + refresh grid + success toast"
        - "On error (400/409/422): show error toast with detail"
        - "On successful callback: close login modal, update UI to show logout button and Add Article, show success toast"

    - name: AdminView
      route: /admin
      description: >
        Admin-only user management panel. Requires authentication + ADMIN role.
        If not authenticated or not admin, show 403 or redirect to /?require-login=true
      columns: [id, email, role, createdAt]
      features:
        - Users table with all app_user records
        - "Delete icon/button per row: invokes AppUserService delete, confirm dialog, error toast if 409 (last admin)"
        - "Role selector per row: change role invokes AppUserService patchRole, shows success/error toast"
        - "Add User button -> modal with email input + role selector"
        - "Submit invokes AppUserService create, error toast on 400/409, success toast + table refresh"
        - "Logout button in top-right (same as every other view): invalidates session, redirects to /"
# ──────────────────────────────────────────────────────────────
# API SPEC  (standard OpenAPI)
# ──────────────────────────────────────────────────────────────
info:
  title: CoZaZjeb API
  description: |
    ## Overview
    CoZaZjeb is a link-collecting application. Users submit a URL and a language
    tag; the server fetches the target page and automatically enriches the record
    with title, thumbnail and lead before persisting it.

    ## Components
    1. **REST API** — CRUD endpoints for `Article` resources (this spec).
    2. **PostgreSQL database** — all data persisted via Spring Data JDBC.
    3. **Flyway migrations** — all schema changes are managed as versioned SQL
       migration scripts located in `src/main/resources/db/migration/`.
       No DDL is generated or executed outside of Flyway.
    4. **RSS feed** — `GET /rss` exposes articles as an RSS 2.0 feed;
       filterable per language with `?lang=<BCP-47>`.
    5. **Vaadin UI** — server-side paginated view of articles (separate from
       this REST spec; rendered at the root path `/`).

    ## Implementation notes
    - Language is a free-form BCP-47 string (e.g. `pl`, `en`, `de`).
    - `title`, `thumbnail` and `lead` are server-fetched; clients supply
      `url`, `language` and optional `quote` on create/replace.
    - `aiSummary` is reserved for a future AI enrichment step; always `null`
      in the current version.
    - Read endpoints (`GET /api/articles`, `GET /api/articles/{id}`, `GET /rss`)
      are public. Write endpoints require Google OAuth2/OIDC Bearer tokens.
    - Error responses use `application/problem+json` (RFC 9457 /
      Spring `ProblemDetail`).
  version: 0.0.1-SNAPSHOT
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080
    description: Local development

x-security-policy:
  provider: google-oidc
  issuer: https://accounts.google.com
  acceptedTokenType: access_token_jwt
  requiredClaims: [iss, aud, exp, sub, email, email_verified]
  requireEmailVerified: true
  acceptedAlgorithms: [RS256]
  requireHttpsIssuerAndJwks: true
  rejectUnsignedTokens: true
  clockSkewSeconds: 60
  denyByDefault: true
  audienceSource: spring.security.oauth2.resourceserver.jwt.audiences
  allowlist:
    enabled: true
    table: app_user
    roleColumn: role
    emailNormalization: trim+lowercase
  bootstrap:
    adminEmailEnvVar: COZAZJEB_BOOTSTRAP_ADMIN_EMAIL
    enforcedOnlyWhenNoAdminsExist: true
    failFastWhenRequiredButMissingOrEmpty: true
    failFastOnInvalidEmail: true
    seedAdminRow: true
    promoteExistingUserToAdmin: true
  cors:
    allowedOrigins: [https://cozazjeb.pl]
    allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowedHeaders: [Authorization, Content-Type]
    preflightMaxAgeSeconds: 600
    allowCredentials: false
  csrf:
    disabledPaths: [/api/**, /rss]
    enabledForVaadinUi: true

x-problem-types:
  articleUrlConflict:
    uri: https://cozazjeb.pl/problems/article-url-conflict
    status: 409
    title: Article URL Already Exists
  allowlistEmailConflict:
    uri: https://cozazjeb.pl/problems/allowlist-email-conflict
    status: 409
    title: Allowlisted Email Already Exists
  lastAdminRequired:
    uri: https://cozazjeb.pl/problems/last-admin-required
    status: 409
    title: Last Admin Required

tags:
  - name: Articles
    description: CRUD operations for Article resources
  - name: RSS
    description: RSS feed endpoints
  - name: Security
    description: Allowlist management endpoints

paths:

  /api/articles:

    get:
      tags: [Articles]
      summary: List articles (paginated)
      operationId: listArticles
      security: []
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of articles per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: >
            Sort expression: field,direction — e.g. createdAt,desc.
            Permitted fields: id, createdAt, language, title, url.
            Unknown field returns 400 Bad Request.
          schema:
            type: string
            enum:
              - id,asc
              - id,desc
              - createdAt,asc
              - createdAt,desc
              - language,asc
              - language,desc
              - title,asc
              - title,desc
              - url,asc
              - url,desc
            example: createdAt,desc
      responses:
        '200':
          description: Paginated list of articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Articles]
      summary: Create a new article
      operationId: createArticle
      security:
        - googleOidc: []
      description: >
        Accepts a URL and a BCP-47 language tag.
        The server fetches the page at the given URL and automatically
        populates title, thumbnail and lead before persisting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
            example:
              url: https://example.com/some-article
              language: pl
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/articles/{id}:

    parameters:
      - $ref: '#/components/parameters/ArticleId'

    get:
      tags: [Articles]
      summary: Get article by ID
      operationId: getArticle
      security: []
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Articles]
      summary: Replace article input fields
      operationId: replaceArticle
      security:
        - googleOidc: []
      description: >
        Replaces url, language and optional quote. The server re-fetches the
        target page to refresh title, thumbnail and lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Article replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Articles]
      summary: Partially update an article
      operationId: patchArticle
      security:
        - googleOidc: []
      description: >
        Updates only the provided fields. Updatable fields: url, language, quote.
        Setting quote to null explicitly clears it; omitting quote leaves it unchanged.
        If url is changed the server re-fetches the page to refresh the enriched
        fields. Fully atomic — if enrichment fails the server responds with 422
        and the existing record is left unchanged.
        Null for url or language is invalid and returns 400.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ArticlePatch'
      responses:
        '200':
          description: Article updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Articles]
      summary: Delete an article
      operationId: deleteArticle
      security:
        - googleOidc: []
      responses:
        '204':
          description: Article deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rss:

    get:
      tags: [RSS]
      summary: RSS 2.0 feed
      operationId: getRssFeed
      security: []
      x-rss-channel:
        title: Co za zjeb
        link: https://cozazjeb.pl
        description: fucked up news
        language:
          default: en
          note: accepts any BCP-47 tag (free-form, no fixed enum)
        generator: cozazjeb.pl
        lastBuildDateSource: app.build.timestamp injected by Gradle as ISO-8601 UTC
        lastBuildDateFormat: RFC-822 UTC (converted by RSS controller from ISO-8601)
        lastBuildDateFallback: fail-fast when app.build.timestamp is missing or unparseable
      parameters:
        - name: lang
          in: query
          description: >-
            BCP-47 language tag filter (e.g. en, pl, de).
            Accepts any free-form BCP-47 tag — no fixed enum.
          required: false
          schema:
            type: string
            example: pl
      responses:
        '200':
          description: RSS feed
          content:
            application/rss+xml:
              schema:
                type: string

  /api/users:

    get:
      tags: [Security]
      summary: List allowlisted users
      operationId: listAppUsers
      x-required-role: ADMIN
      security:
        - googleOidc: []
      responses:
        '200':
          description: List of allowlisted users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Security]
      summary: Add user to allowlist
      operationId: addAppUser
      x-required-role: ADMIN
      security:
        - googleOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserInput'
      responses:
        '201':
          description: User added to allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Allowed user identifier to remove

    delete:
      tags: [Security]
      summary: Remove user from allowlist
      operationId: removeAppUser
      x-required-role: ADMIN
      security:
        - googleOidc: []
      responses:
        '204':
          description: User removed from allowlist
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Security]
      summary: Update allowlisted user role
      operationId: updateAppUserRole
      x-required-role: ADMIN
      security:
        - googleOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserRolePatch'
      responses:
        '200':
          description: Allowed user role updated (or unchanged if same role requested)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  securitySchemes:
    googleOidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration

  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      description: Unique article identifier
      schema:
        type: integer
        format: int64
        example: 42

  schemas:

    ArticleInput:
      type: object
      required: [url, language]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://.+'
          description: Full URL of the article page to fetch and store (http/https only)
          example: https://example.com/some-article
        language:
          type: string
          minLength: 1
          maxLength: 20
          description: BCP-47 language tag identifying the article's language
          example: pl
        quote:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          description: Optional user-provided quote or comment about the article
          example: "This perfectly captures the absurdity."

    ArticlePatch:
      type: object
      description: JSON Merge Patch document; omitted fields are left unchanged
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://.+'
          example: https://example.com/updated-article
        language:
          type: string
          minLength: 1
          maxLength: 20
          description: BCP-47 language tag
          example: en
        quote:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          description: User-provided quote; null explicitly clears it; empty string is invalid
          example: "This perfectly captures the absurdity."

    Article:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        url:
          type: string
          format: uri
          example: https://example.com/some-article
        language:
          type: string
          description: BCP-47 language tag
          example: pl
        title:
          type: string
          description: Title fetched from the article page
          nullable: true
          example: "An Interesting Article"
        thumbnail:
          type: string
          format: uri
          description: Thumbnail URL fetched from the article page (og:image or similar)
          nullable: true
          example: https://example.com/images/thumb.jpg
        lead:
          type: string
          description: Lead/excerpt fetched from the article page (og:description or similar)
          nullable: true
          example: "A short summary of the article content."
        quote:
          type: string
          description: User-provided quote or comment about the article
          nullable: true
          example: "This perfectly captures the absurdity."
        aiSummary:
          type: string
          description: AI-generated summary — future feature, null until implemented
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-02T10:00:00Z"

    AppUserInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Email to add to the write-operation allowlist (RFC 5321 max 254 chars)
          example: admin@cozazjeb.pl
        role:
          type: string
          enum: [USER, ADMIN]
          minLength: 1
          description: Authorization role assigned to this user
          example: USER

    AppUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        email:
          type: string
          format: email
          maxLength: 254
          example: admin@cozazjeb.pl
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-02T10:00:00Z"

    AppUserRolePatch:
      type: object
      required: [role]
      description: Role update payload for allowlisted user
      properties:
        role:
          type: string
          enum: [USER, ADMIN]
          minLength: 1
          description: New role to assign
          example: ADMIN

    ArticlePage:
      type: object
      description: Frozen page response shape for Article
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        pageable:
          $ref: '#/components/schemas/Pageable'
        totalElements:
          type: integer
          format: int64
          example: 150
        totalPages:
          type: integer
          example: 8
        size:
          type: integer
          example: 20
        number:
          type: integer
          description: Current zero-based page number
          example: 0
        numberOfElements:
          type: integer
          example: 20
        sort:
          $ref: '#/components/schemas/Sort'
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        offset:
          type: integer
          format: int64
          example: 0
        paged:
          type: boolean
          example: true
        unpaged:
          type: boolean
          example: false
        sort:
          $ref: '#/components/schemas/Sort'

    Sort:
      type: object
      properties:
        sorted:
          type: boolean
          example: true
        unsorted:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false

    ProblemDetail:
      type: object
      description: RFC 9457 / Spring ProblemDetail error response
      required: [type, title, status, detail]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          example: https://example.com/problems/validation-error
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'url' must be a valid URI"
        instance:
          type: string
          format: uri
          example: /api/articles
        conflictField:
          type: string
          description: Optional field name that caused a conflict
          example: url
        existingId:
          type: integer
          format: int64
          description: Optional existing resource identifier for conflict cases
          example: 42
        remainingAdmins:
          type: integer
          description: Optional count of admins that would remain after operation
          example: 0

  responses:

    BadRequest:
      description: Request payload is invalid or malformed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: Conflict with business rules
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            articleUrlConflict:
              summary: Duplicate article URL
              value:
                type: https://cozazjeb.pl/problems/article-url-conflict
                title: Article URL Already Exists
                status: 409
                detail: "Article with this URL already exists (canonicalized: <url>)."
                instance: /api/articles
                conflictField: url
                existingId: 42
            allowlistEmailConflict:
              summary: Duplicate allowlist email
              value:
                type: https://cozazjeb.pl/problems/allowlist-email-conflict
                title: Allowlisted Email Already Exists
                status: 409
                detail: User with this email is already allowlisted.
                instance: /api/users
                conflictField: email
                existingId: 7
            lastAdminRequired:
              summary: Attempt to remove final admin
              value:
                type: https://cozazjeb.pl/problems/last-admin-required
                title: Last Admin Required
                status: 409
                detail: Operation would leave the system without an ADMIN user.
                instance: /api/users/1
                remainingAdmins: 0

    Unauthorized:
      description: Missing or invalid OAuth2 Bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: Authenticated but not allowed to perform this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnprocessableEntity:
      description: The URL could not be fetched or its content could not be parsed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
