services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - './docker-data/postgres:/var/lib/postgresql'
  zipkin:
    image: 'openzipkin/zipkin:latest'
    ports:
      - '9411'
