services:
  springboot:
    build:
      context: .
      args:
        APP_BUILD_COMMIT: '${APP_BUILD_COMMIT:-unknown}'
    image: cozazjeb:local
    restart: unless-stopped
    cpus: '1.25'
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      - 'JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=25'
      - 'SPRING_PROFILES_ACTIVE=prod'
      - 'APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}'
      - 'JDBC_DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}'
      - 'JDBC_DATABASE_USERNAME=${POSTGRES_USER}'
      - 'JDBC_DATABASE_PASSWORD=${POSTGRES_PASSWORD}'
      - 'SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES}'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}'
      - 'COZAZJEB_BOOTSTRAP_ADMIN_EMAIL=${COZAZJEB_BOOTSTRAP_ADMIN_EMAIL}'
      - 'SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}'
      - 'SERVER_SERVLET_SESSION_TIMEOUT=${SERVER_SERVLET_SESSION_TIMEOUT:-30m}'
      - 'MANAGEMENT_TRACING_EXPORT_ENABLED=${MANAGEMENT_TRACING_EXPORT_ENABLED:-true}'
      - 'MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED=${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED:-true}'
      - 'MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:-${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}}'
      - 'MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}'
      - 'GOOGLE_ANALYTICS_MEASUREMENT_ID=${GOOGLE_ANALYTICS_MEASUREMENT_ID:-}'
      - 'STATCOUNTER_PROJECT_ID=${STATCOUNTER_PROJECT_ID:-}'
      - 'STATCOUNTER_SECURITY_ID=${STATCOUNTER_SECURITY_ID:-}'
      - 'APP_FACEBOOK_IMPORT_ENABLED=${APP_FACEBOOK_IMPORT_ENABLED:-false}'
      - 'APP_FACEBOOK_IMPORT_USERNAME=${APP_FACEBOOK_IMPORT_USERNAME:-}'
      - 'APP_FACEBOOK_IMPORT_PASSWORD=${APP_FACEBOOK_IMPORT_PASSWORD:-}'
      - 'APP_FACEBOOK_IMPORT_HEADLESS=${APP_FACEBOOK_IMPORT_HEADLESS:-false}'
      - 'APP_FACEBOOK_IMPORT_TARGET_API_BASE_URL=${APP_FACEBOOK_IMPORT_TARGET_API_BASE_URL:-}'
      - 'APP_FACEBOOK_IMPORT_TARGET_API_KEY=${APP_FACEBOOK_IMPORT_TARGET_API_KEY:-}'
      - 'APP_FACEBOOK_IMPORT_TARGET_API_KEY_HEADER=${APP_FACEBOOK_IMPORT_TARGET_API_KEY_HEADER:-X-CoZaZjeb-M2M-Key}'
      - 'APP_FACEBOOK_IMPORT_TARGET_ARTICLE_PATH=${APP_FACEBOOK_IMPORT_TARGET_ARTICLE_PATH:-/api/articles}'
      - 'APP_MACHINE_AUTH_ENABLED=${APP_MACHINE_AUTH_ENABLED:-false}'
      - 'APP_MACHINE_AUTH_HEADER_NAME=${APP_MACHINE_AUTH_HEADER_NAME:-X-CoZaZjeb-M2M-Key}'
      - 'APP_MACHINE_AUTH_API_KEY=${APP_MACHINE_AUTH_API_KEY:-}'
      - 'APP_MACHINE_AUTH_PRINCIPAL_EMAIL=${APP_MACHINE_AUTH_PRINCIPAL_EMAIL:-}'
    volumes:
      - './.env:/app/.env:ro'
    ports:
      - '${APP_PORT:-8086}:8080'
  postgres:
    image: 'postgres:latest'
    restart: unless-stopped
    cpus: '0.75'
    mem_limit: 1024m
    memswap_limit: 1024m
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - './docker-data/postgres:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
  zipkin:
    image: 'openzipkin/zipkin:latest'
    restart: unless-stopped
    cpus: '0.25'
    mem_limit: 384m
    memswap_limit: 384m
    ports:
      - '9411'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9411/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
