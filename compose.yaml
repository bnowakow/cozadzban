services:
  app:
    build:
      context: .
    image: cozazjeb:local
    cpus: '1.25'
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - 'JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=25'
      - 'SPRING_PROFILES_ACTIVE=prod'
      - 'JDBC_DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}'
      - 'JDBC_DATABASE_USERNAME=${POSTGRES_USER}'
      - 'JDBC_DATABASE_PASSWORD=${POSTGRES_PASSWORD}'
      - 'SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES}'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}'
      - 'COZAZJEB_BOOTSTRAP_ADMIN_EMAIL=${COZAZJEB_BOOTSTRAP_ADMIN_EMAIL}'
      - 'SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}'
      - 'SERVER_SERVLET_SESSION_TIMEOUT=${SERVER_SERVLET_SESSION_TIMEOUT:-30m}'
      - 'GOOGLE_ANALYTICS_MEASUREMENT_ID=${GOOGLE_ANALYTICS_MEASUREMENT_ID:-}'
      - 'STATCOUNTER_PROJECT_ID=${STATCOUNTER_PROJECT_ID:-}'
      - 'STATCOUNTER_SECURITY_ID=${STATCOUNTER_SECURITY_ID:-}'
    ports:
      - '${APP_PORT:-8086}:8080'
  postgres:
    image: 'postgres:latest'
    cpus: '0.75'
    mem_limit: 1024m
    memswap_limit: 1024m
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - './docker-data/postgres:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
  zipkin:
    image: 'openzipkin/zipkin:latest'
    cpus: '0.25'
    mem_limit: 384m
    memswap_limit: 384m
    ports:
      - '9411'
