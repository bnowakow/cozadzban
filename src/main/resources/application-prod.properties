# ============================================================
# Production profile
# ============================================================
vaadin.launch-browser=false

# ============================================================
# PostgreSQL datasource (provided by deployment env)
# ============================================================
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# Observability: Brave/Zipkin tracing
# ============================================================
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.10}
management.tracing.export.enabled=${MANAGEMENT_TRACING_EXPORT_ENABLED:true}
management.tracing.export.zipkin.enabled=${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED:true}
management.tracing.export.zipkin.endpoint=${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}}
management.tracing.export.zipkin.connect-timeout=1s
management.tracing.export.zipkin.read-timeout=5s
