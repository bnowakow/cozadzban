# ============================================================
# Spring Boot configuration
# ============================================================
spring.application.name=co-za-zjeb
# Active profile should be set using SPRING_PROFILES_ACTIVE (local/prod)

# ============================================================
# Flyway migrations
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# Spring Data JDBC
# ============================================================
spring.sql.init.platform=postgresql

# ============================================================
# Security: Google OAuth2 OIDC Resource Server
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
# Audience (client ID) should be configured via environment variable
spring.security.oauth2.resourceserver.jwt.audiences=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:}

# ============================================================
# CORS configuration
# ============================================================
# Per BR-16: CORS allows only https://cozazjeb.pl
# Note: CORS is configured programmatically in SecurityConfig

# ============================================================
# CSRF configuration
# ============================================================
# Per BR-16: CSRF disabled for /api/** and /rss, enabled for Vaadin UI routes
# Note: CSRF is configured programmatically in SecurityConfig

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# Application build metadata
# ============================================================
app.build.timestamp=${appBuildTimestamp}
