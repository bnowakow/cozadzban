# ============================================================
# Spring Boot configuration
# ============================================================
spring.application.name=co-za-zjeb
# Active profile should be set using SPRING_PROFILES_ACTIVE (local/prod)

# ============================================================
# Flyway migrations
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# Spring Data JDBC
# ============================================================
spring.sql.init.platform=postgresql

# ============================================================
# Security: Google OAuth2 OIDC Resource Server
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
# Audience (client ID) should be configured via environment variable
spring.security.oauth2.resourceserver.jwt.audiences=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:}

# ============================================================
# Security: Google OAuth2 client (UI login, Authorization Code flow)
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ============================================================
# Session cookie hardening for UI auth
# ============================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:30m}

# ============================================================
# CORS configuration
# ============================================================
# Per BR-16: CORS allows only https://cozazjeb.pl
# Note: CORS is configured programmatically in SecurityConfig

# ============================================================
# CSRF configuration
# ============================================================
# Per BR-16: CSRF disabled for /api/** and /rss, enabled for Vaadin UI routes
# Note: CSRF is configured programmatically in SecurityConfig

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoint.health.show-details=when-authorized

# ============================================================
# Logging
# ============================================================
# Internet scanners can send non-HTTP bytes to the public HTTP port. Tomcat logs
# the first bad request line with a stack trace at INFO unless this is narrowed.
logging.level.org.apache.coyote.http11.Http11Processor=WARN
# Application diagnostics are controlled by APP_LOG_LEVEL in the active .env.
logging.level.pl.bnowakowski.cozazjeb=${APP_LOG_LEVEL:INFO}

# ============================================================
# Application build metadata
# ============================================================
app.build.timestamp=${appBuildTimestamp}
app.build.version=${appBuildVersion}
app.build.commit=${appBuildCommit}

# ============================================================
# Analytics (optional — leave blank to disable)
# ============================================================
app.analytics.google-measurement-id=${GOOGLE_ANALYTICS_MEASUREMENT_ID:}
app.analytics.statcounter-project-id=${STATCOUNTER_PROJECT_ID:}
app.analytics.statcounter-security-id=${STATCOUNTER_SECURITY_ID:}

# ============================================================
# Article favicon cache/backfill
# ============================================================
app.favicon-backfill.enabled=${APP_FAVICON_BACKFILL_ENABLED:true}
app.favicon-backfill.max-articles=${APP_FAVICON_BACKFILL_MAX_ARTICLES:500}

# ============================================================
# Facebook profile import (manual, disabled by default)
# ============================================================
app.facebook-import.enabled=${APP_FACEBOOK_IMPORT_ENABLED:false}
app.facebook-import.profile-url=${APP_FACEBOOK_IMPORT_PROFILE_URL:https://www.facebook.com/bartek.dobrowolski.nowakowski}
app.facebook-import.marker-phrase=${APP_FACEBOOK_IMPORT_MARKER_PHRASE:co za zjeb}
app.facebook-import.translated-marker-phrase=${APP_FACEBOOK_IMPORT_TRANSLATED_MARKER_PHRASE:what a fucker}
app.facebook-import.language=${APP_FACEBOOK_IMPORT_LANGUAGE:pl}
app.facebook-import.username=${APP_FACEBOOK_IMPORT_USERNAME:}
app.facebook-import.password=${APP_FACEBOOK_IMPORT_PASSWORD:}
app.facebook-import.browser=${APP_FACEBOOK_IMPORT_BROWSER:FIREFOX}
app.facebook-import.headless=${APP_FACEBOOK_IMPORT_HEADLESS:false}
app.facebook-import.scrolls=${APP_FACEBOOK_IMPORT_SCROLLS:8}
app.facebook-import.wait-after-login=${APP_FACEBOOK_IMPORT_WAIT_AFTER_LOGIN:8s}
app.facebook-import.wait-after-page-open=${APP_FACEBOOK_IMPORT_WAIT_AFTER_PAGE_OPEN:5s}
app.facebook-import.wait-after-scroll=${APP_FACEBOOK_IMPORT_WAIT_AFTER_SCROLL:2s}
app.facebook-import.manual-login-timeout=${APP_FACEBOOK_IMPORT_MANUAL_LOGIN_TIMEOUT:3m}
app.facebook-import.target-api-base-url=${APP_FACEBOOK_IMPORT_TARGET_API_BASE_URL:}
app.facebook-import.target-api-key=${APP_FACEBOOK_IMPORT_TARGET_API_KEY:}
app.facebook-import.target-api-key-header=${APP_FACEBOOK_IMPORT_TARGET_API_KEY_HEADER:X-CoZaZjeb-M2M-Key}
app.facebook-import.target-article-path=${APP_FACEBOOK_IMPORT_TARGET_ARTICLE_PATH:/api/articles}
app.facebook-import.rejection-artifact-dir=${APP_FACEBOOK_IMPORT_REJECTION_ARTIFACT_DIR:logs/facebook-import-rejections}

# ============================================================
# Machine-to-machine API auth for remote article writes
# ============================================================
app.machine-auth.enabled=${APP_MACHINE_AUTH_ENABLED:false}
app.machine-auth.header-name=${APP_MACHINE_AUTH_HEADER_NAME:X-CoZaZjeb-M2M-Key}
app.machine-auth.api-key=${APP_MACHINE_AUTH_API_KEY:}
app.machine-auth.principal-email=${APP_MACHINE_AUTH_PRINCIPAL_EMAIL:}
